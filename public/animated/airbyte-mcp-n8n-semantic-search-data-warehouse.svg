<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Animated schematic: a question travels into a data press and a grounded answer comes out">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#111111" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="450" fill="#FFFDF5"/>
  <rect width="800" height="450" fill="url(#grid)"/>
  <rect x="20" y="20" width="760" height="410" fill="none" stroke="#111111" stroke-width="3"/>

  <!-- Question hopper, left -->
  <g stroke="#111111" stroke-width="3" fill="none">
    <path d="M 90 130 L 210 130 L 190 210 L 110 210 Z" fill="#FFFDF5"/>
    <circle cx="150" cy="170" r="22" fill="none"/>
    <path d="M 150 158 L 150 172 M 150 180 L 150 184" stroke-linecap="round"/>
  </g>
  <g>
    <circle cx="150" cy="170" r="30" fill="none" stroke="#FF4D00" stroke-width="2" stroke-dasharray="6 8">
      <animateTransform attributeName="transform" type="rotate" from="0 150 170" to="360 150 170" dur="45s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Conveyor pipe to the press -->
  <g stroke="#111111" stroke-width="3" fill="none">
    <path d="M 210 170 L 330 170" />
    <path d="M 210 190 L 330 190" />
  </g>
  <circle cx="230" cy="180" r="7" fill="#FF4D00" stroke="#111111" stroke-width="2">
    <animate attributeName="cx" values="225;315;225" dur="9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="300" cy="180" r="7" fill="#FF4D00" stroke="#111111" stroke-width="2">
    <animate attributeName="cx" values="315;225;315" dur="9s" repeatCount="indefinite"/>
  </circle>

  <!-- Semantic drum (top) -->
  <g stroke="#111111" stroke-width="3" fill="#FFFDF5">
    <ellipse cx="400" cy="120" rx="70" ry="26"/>
    <path d="M 330 120 L 330 170 A 70 26 0 0 0 470 170 L 470 120"/>
    <ellipse cx="400" cy="170" rx="70" ry="26"/>
  </g>
  <g stroke="#111111" stroke-width="2" fill="none">
    <path d="M 370 128 L 430 128 M 370 145 L 430 145 M 370 162 L 430 162">
      <animate attributeName="stroke-dashoffset" values="0;-24" dur="8s" repeatCount="indefinite"/>
    </path>
  </g>
  <circle cx="400" cy="145" r="10" fill="#FF4D00" stroke="#111111" stroke-width="2">
    <animate attributeName="r" values="10;13;10" dur="6s" repeatCount="indefinite"/>
  </circle>

  <!-- Warehouse drum (bottom) -->
  <g stroke="#111111" stroke-width="3" fill="#FFFDF5">
    <ellipse cx="400" cy="280" rx="70" ry="26"/>
    <path d="M 330 280 L 330 330 A 70 26 0 0 0 470 330 L 470 280"/>
    <ellipse cx="400" cy="330" rx="70" ry="26"/>
  </g>
  <g stroke="#111111" stroke-width="2" fill="none">
    <path d="M 355 288 L 445 288 M 355 305 L 445 305 M 355 322 L 445 322">
      <animate attributeName="stroke-dashoffset" values="0;24" dur="8s" repeatCount="indefinite"/>
    </path>
  </g>
  <circle cx="400" cy="305" r="10" fill="#FF4D00" stroke="#111111" stroke-width="2">
    <animate attributeName="r" values="10;13;10" dur="6s" begin="3s" repeatCount="indefinite"/>
  </circle>

  <!-- Press, right -->
  <g stroke="#111111" stroke-width="3" fill="none">
    <rect x="560" y="110" width="150" height="230" fill="#FFFDF5"/>
    <rect x="585" y="140" width="100" height="60" fill="#FFFDF5"/>
    <rect x="585" y="230" width="100" height="60" fill="#FFFDF5"/>
  </g>
  <rect x="600" y="150" width="70" height="40" fill="#FF4D00" stroke="#111111" stroke-width="3">
    <animate attributeName="y" values="150;165;150" dur="7s" repeatCount="indefinite"/>
  </rect>
  <g stroke="#111111" stroke-width="2" fill="none">
    <path d="M 600 250 L 670 250 M 600 265 L 670 265 M 600 280 L 645 280">
      <animate attributeName="opacity" values="1;0.4;1" dur="7s" repeatCount="indefinite"/>
    </path>
  </g>
  <!-- Approval lever -->
  <g stroke="#111111" stroke-width="3" fill="none">
    <line x1="710" y1="200" x2="745" y2="160"/>
  </g>
  <circle cx="745" cy="160" r="10" fill="#FF4D00" stroke="#111111" stroke-width="3">
    <animateTransform attributeName="transform" type="rotate" values="-12 710 200;12 710 200;-12 710 200" dur="10s" repeatCount="indefinite"/>
  </circle>

  <!-- Pipes from drums to press -->
  <g stroke="#111111" stroke-width="3" fill="none">
    <path d="M 470 145 L 560 145"/>
    <path d="M 470 305 L 560 305"/>
  </g>
  <circle cx="500" cy="145" r="6" fill="#FF4D00" stroke="#111111" stroke-width="2">
    <animate attributeName="cx" values="480;550;480" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="520" cy="305" r="6" fill="#FF4D00" stroke="#111111" stroke-width="2">
    <animate attributeName="cx" values="550;480;550" dur="8s" repeatCount="indefinite"/>
  </circle>
</svg>
