<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Animated schematic of a social scheduling press">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#111111" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- paper -->
  <rect x="0" y="0" width="800" height="450" fill="#FFFDF5"/>
  <rect x="0" y="0" width="800" height="450" fill="url(#grid)"/>
  <rect x="6" y="6" width="788" height="438" fill="none" stroke="#111111" stroke-width="3"/>

  <!-- title plate -->
  <rect x="40" y="34" width="330" height="34" fill="#FFFDF5" stroke="#111111" stroke-width="3"/>
  <rect x="48" y="42" width="120" height="6" fill="#111111"/>
  <rect x="48" y="54" width="80" height="6" fill="#111111"/>
  <rect x="330" y="42" width="14" height="14" fill="#FF4D00" stroke="#111111" stroke-width="2"/>

  <!-- central calendar press -->
  <g>
    <rect x="240" y="120" width="320" height="220" fill="#FFFDF5" stroke="#111111" stroke-width="4"/>
    <rect x="252" y="132" width="296" height="196" fill="none" stroke="#111111" stroke-width="1.5"/>
    <!-- calendar grid -->
    <g stroke="#111111" stroke-width="1.5">
      <line x1="301" y1="132" x2="301" y2="328"/>
      <line x1="350" y1="132" x2="350" y2="328"/>
      <line x1="399" y1="132" x2="399" y2="328"/>
      <line x1="448" y1="132" x2="448" y2="328"/>
      <line x1="499" y1="132" x2="499" y2="328"/>
      <line x1="252" y1="181" x2="548" y2="181"/>
      <line x1="252" y1="230" x2="548" y2="230"/>
      <line x1="252" y1="279" x2="548" y2="279"/>
    </g>
    <!-- scheduled cells filling in, one by one -->
    <g fill="#FF4D00" stroke="#111111" stroke-width="2">
      <rect x="256" y="136" width="41" height="41" opacity="0">
        <animate attributeName="opacity" values="0;1;1;0" dur="24s" repeatCount="indefinite"/>
      </rect>
      <rect x="354" y="185" width="41" height="41" opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;0" dur="24s" repeatCount="indefinite"/>
      </rect>
      <rect x="452" y="234" width="41" height="41" opacity="0">
        <animate attributeName="opacity" values="0;0;0;1;1;0" dur="24s" repeatCount="indefinite"/>
      </rect>
      <rect x="305" y="283" width="41" height="41" opacity="0">
        <animate attributeName="opacity" values="0;0;0;0;1;1;0" dur="24s" repeatCount="indefinite"/>
      </rect>
    </g>
    <!-- press gears, slow rotation -->
    <g transform="translate(200 230)">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="60s" repeatCount="indefinite"/>
        <circle r="34" fill="#FFFDF5" stroke="#111111" stroke-width="3"/>
        <circle r="12" fill="#111111"/>
        <g stroke="#111111" stroke-width="6">
          <line x1="0" y1="-34" x2="0" y2="-46"/>
          <line x1="0" y1="34" x2="0" y2="46"/>
          <line x1="-34" y1="0" x2="-46" y2="0"/>
          <line x1="34" y1="0" x2="46" y2="0"/>
          <line x1="-24" y1="-24" x2="-33" y2="-33"/>
          <line x1="24" y1="-24" x2="33" y2="-33"/>
          <line x1="-24" y1="24" x2="-33" y2="33"/>
          <line x1="24" y1="24" x2="33" y2="33"/>
        </g>
      </g>
    </g>
    <g transform="translate(600 230)">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="60s" repeatCount="indefinite"/>
        <circle r="34" fill="#FFFDF5" stroke="#111111" stroke-width="3"/>
        <circle r="12" fill="#FF4D00" stroke="#111111" stroke-width="2"/>
        <g stroke="#111111" stroke-width="6">
          <line x1="0" y1="-34" x2="0" y2="-46"/>
          <line x1="0" y1="34" x2="0" y2="46"/>
          <line x1="-34" y1="0" x2="-46" y2="0"/>
          <line x1="34" y1="0" x2="46" y2="0"/>
          <line x1="-24" y1="-24" x2="-33" y2="-33"/>
          <line x1="24" y1="-24" x2="33" y2="-33"/>
          <line x1="-24" y1="24" x2="-33" y2="33"/>
          <line x1="24" y1="24" x2="33" y2="33"/>
        </g>
      </g>
    </g>
  </g>

  <!-- approval lever, slow swing -->
  <g transform="translate(560 110)">
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-14;10;-14" dur="12s" repeatCount="indefinite"/>
      <line x1="0" y1="0" x2="0" y2="-58" stroke="#111111" stroke-width="6"/>
      <circle cx="0" cy="-64" r="16" fill="#FF4D00" stroke="#111111" stroke-width="3"/>
    </g>
    <circle cx="0" cy="0" r="10" fill="#FFFDF5" stroke="#111111" stroke-width="3"/>
  </g>

  <!-- feed pipe from left -->
  <path d="M 40 230 L 196 230" fill="none" stroke="#111111" stroke-width="5"/>
  <path d="M 40 246 L 196 246" fill="none" stroke="#111111" stroke-width="5"/>
  <!-- draft card sliding along the pipe -->
  <g>
    <rect x="0" y="218" width="46" height="40" fill="#FFFDF5" stroke="#111111" stroke-width="3"/>
    <line x1="8" y1="230" x2="38" y2="230" stroke="#111111" stroke-width="2"/>
    <line x1="8" y1="240" x2="30" y2="240" stroke="#111111" stroke-width="2"/>
    <animateTransform attributeName="transform" type="translate" values="30 0; 150 0; 150 0; 30 0" dur="16s" repeatCount="indefinite"/>
  </g>

  <!-- output fan to the right: channel tiles -->
  <g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -6; 0 0" dur="8s" repeatCount="indefinite"/>
      <rect x="640" y="120" width="70" height="46" fill="#FFFDF5" stroke="#111111" stroke-width="3"/>
      <rect x="652" y="134" width="46" height="6" fill="#111111"/>
      <rect x="652" y="146" width="30" height="6" fill="#FF4D00"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -6; 0 0" dur="8s" begin="2s" repeatCount="indefinite"/>
      <rect x="660" y="190" width="70" height="46" fill="#FFFDF5" stroke="#111111" stroke-width="3"/>
      <rect x="672" y="204" width="46" height="6" fill="#111111"/>
      <rect x="672" y="216" width="30" height="6" fill="#FF4D00"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -6; 0 0" dur="8s" begin="4s" repeatCount="indefinite"/>
      <rect x="640" y="260" width="70" height="46" fill="#FFFDF5" stroke="#111111" stroke-width="3"/>
      <rect x="652" y="274" width="46" height="6" fill="#111111"/>
      <rect x="652" y="286" width="30" height="6" fill="#FF4D00"/>
    </g>
  </g>

  <!-- output pipes from press to fan -->
  <path d="M 560 170 L 636 143" fill="none" stroke="#111111" stroke-width="3"/>
  <path d="M 560 230 L 656 213" fill="none" stroke="#111111" stroke-width="3"/>
  <path d="M 560 290 L 636 283" fill="none" stroke="#111111" stroke-width="3"/>

  <!-- bottom status strip -->
  <rect x="40" y="380" width="720" height="34" fill="#FFFDF5" stroke="#111111" stroke-width="3"/>
  <rect x="56" y="392" width="90" height="10" fill="#111111">
    <animate attributeName="width" values="90; 220; 90" dur="18s" repeatCount="indefinite"/>
  </rect>
  <rect x="700" y="392" width="44" height="10" fill="#FF4D00" stroke="#111111" stroke-width="2"/>
</svg>
