<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Abstract animation: a single query-parameter token travels toward a splitting blade and is divided at its comma into two tokens">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#111111" stroke-width="0.5" opacity="0.12"/>
    </pattern>
  </defs>
  <rect x="0" y="0" width="800" height="450" fill="#FFFDF5"/>
  <rect x="0" y="0" width="800" height="450" fill="url(#grid)"/>
  <rect x="18" y="18" width="764" height="414" fill="none" stroke="#111111" stroke-width="3"/>

  <!-- conveyor lane -->
  <rect x="70" y="195" width="660" height="60" fill="none" stroke="#111111" stroke-width="2.5"/>
  <g stroke="#111111" stroke-width="1.5" opacity="0.35">
    <line x1="90" y1="195" x2="90" y2="255"/>
    <line x1="150" y1="195" x2="150" y2="255"/>
    <line x1="210" y1="195" x2="210" y2="255"/>
    <line x1="270" y1="195" x2="270" y2="255"/>
    <line x1="330" y1="195" x2="330" y2="255"/>
    <line x1="390" y1="195" x2="390" y2="255"/>
    <line x1="450" y1="195" x2="450" y2="255"/>
    <line x1="510" y1="195" x2="510" y2="255"/>
    <line x1="570" y1="195" x2="570" y2="255"/>
    <line x1="630" y1="195" x2="630" y2="255"/>
    <line x1="690" y1="195" x2="690" y2="255"/>
  </g>

  <!-- single parameter token moving left to right (loops) -->
  <g>
    <rect x="0" y="205" width="130" height="40" rx="6" fill="#FFFDF5" stroke="#111111" stroke-width="2.5"/>
    <rect x="60" y="205" width="6" height="40" fill="#FF4D00"/>
    <animateTransform attributeName="transform" type="translate" values="90 0; 560 0" keyTimes="0;1" dur="14s" repeatCount="indefinite"/>
  </g>

  <!-- splitting blade (slow pulse, orange edge) -->
  <g>
    <path d="M 330 60 L 348 190 L 312 190 Z" fill="#111111"/>
    <line x1="330" y1="190" x2="330" y2="205" stroke="#FF4D00" stroke-width="3">
      <animate attributeName="opacity" values="1;0.35;1" dur="7s" repeatCount="indefinite"/>
    </line>
    <rect x="305" y="30" width="50" height="34" fill="#FFFDF5" stroke="#111111" stroke-width="2.5"/>
  </g>

  <!-- two split tokens drifting apart after the blade -->
  <g>
    <rect x="360" y="205" width="58" height="40" rx="6" fill="#FFFDF5" stroke="#111111" stroke-width="2.5">
      <animate attributeName="x" values="360;470" dur="14s" repeatCount="indefinite"/>
    </rect>
    <rect x="436" y="205" width="58" height="40" rx="6" fill="#FFFDF5" stroke="#FF4D00" stroke-width="2.5">
      <animate attributeName="x" values="436;560" dur="14s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- placeholder slots -->
  <g stroke="#111111" stroke-width="2" fill="none">
    <circle cx="150" cy="330" r="22"/>
    <circle cx="230" cy="330" r="22"/>
    <circle cx="310" cy="330" r="22" opacity="0.25">
      <animate attributeName="opacity" values="0.25;1;0.25" dur="14s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- reject marker (slow pulse) -->
  <g>
    <rect x="560" y="310" width="40" height="40" fill="none" stroke="#FF4D00" stroke-width="3">
      <animate attributeName="opacity" values="1;0.3;1" dur="7s" repeatCount="indefinite"/>
    </rect>
    <line x1="570" y1="320" x2="590" y2="340" stroke="#FF4D00" stroke-width="3"/>
    <line x1="590" y1="320" x2="570" y2="340" stroke="#FF4D00" stroke-width="3"/>
  </g>

  <!-- slow drifting accents -->
  <g fill="#FF4D00" opacity="0.18">
    <circle cx="700" cy="90" r="10">
      <animate attributeName="cy" values="90;120;90" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="120" cy="110" r="6">
      <animate attributeName="cy" values="110;140;110" dur="12s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
