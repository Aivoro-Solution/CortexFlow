<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Gemini 4 Neon thinking-level dial — abstract animated schematic">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#111111" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- cream sheet + fine grid -->
  <rect x="0" y="0" width="800" height="450" fill="#FFFDF5"/>
  <rect x="0" y="0" width="800" height="450" fill="url(#grid)"/>

  <!-- frame -->
  <rect x="24" y="24" width="752" height="402" fill="none" stroke="#111111" stroke-width="3"/>

  <!-- four thinking-level beams rising from the core -->
  <g stroke="#111111" stroke-width="2" fill="none">
    <line x1="400" y1="330" x2="180" y2="150"/>
    <line x1="400" y1="330" x2="330" y2="110"/>
    <line x1="400" y1="330" x2="470" y2="110"/>
    <line x1="400" y1="330" x2="620" y2="150"/>
  </g>

  <!-- beam pulses travelling upward, slow -->
  <g fill="#FF4D00">
    <circle r="6" cx="400" cy="330">
      <animateMotion dur="12s" repeatCount="indefinite" path="M 400 330 L 180 150"/>
    </circle>
    <circle r="6" cx="400" cy="330">
      <animateMotion dur="10s" repeatCount="indefinite" path="M 400 330 L 330 110"/>
    </circle>
    <circle r="6" cx="400" cy="330">
      <animateMotion dur="8s" repeatCount="indefinite" path="M 400 330 L 470 110"/>
    </circle>
    <circle r="6" cx="400" cy="330">
      <animateMotion dur="14s" repeatCount="indefinite" path="M 400 330 L 620 150"/>
    </circle>
  </g>

  <!-- level nodes -->
  <g stroke="#111111" stroke-width="3" fill="#FFFDF5">
    <circle cx="180" cy="150" r="26"/>
    <circle cx="330" cy="110" r="30"/>
    <circle cx="470" cy="110" r="34"/>
    <circle cx="620" cy="150" r="38"/>
  </g>
  <g fill="#FF4D00">
    <circle cx="180" cy="150" r="10"/>
    <circle cx="330" cy="110" r="12"/>
    <circle cx="470" cy="110" r="14"/>
    <circle cx="620" cy="150" r="16">
      <animate attributeName="r" values="16;20;16" dur="6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- the core: rotating neon prism -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 400 330" to="360 400 330" dur="60s" repeatCount="indefinite"/>
    <polygon points="400,278 445,330 400,382 355,330" fill="#FF4D00" stroke="#111111" stroke-width="3"/>
    <polygon points="400,300 422,330 400,360 378,330" fill="#FFFDF5" stroke="#111111" stroke-width="2"/>
  </g>
  <circle cx="400" cy="330" r="8" fill="#111111"/>

  <!-- orbiting token ring, slow -->
  <g fill="none" stroke="#111111" stroke-width="2">
    <circle cx="400" cy="330" r="86" stroke-dasharray="4 10"/>
    <animateTransform attributeName="transform" type="rotate" from="360 400 330" to="0 400 330" dur="45s" repeatCount="indefinite"/>
  </g>
  <circle cx="400" cy="244" r="7" fill="#FF4D00">
    <animateTransform attributeName="transform" type="rotate" from="0 400 330" to="360 400 330" dur="45s" repeatCount="indefinite"/>
  </circle>

  <!-- base line + approval lever -->
  <line x1="120" y1="382" x2="680" y2="382" stroke="#111111" stroke-width="3"/>
  <g>
    <line x1="660" y1="382" x2="660" y2="330" stroke="#111111" stroke-width="3"/>
    <circle cx="660" cy="322" r="10" fill="#FF4D00" stroke="#111111" stroke-width="3">
      <animate attributeName="cy" values="322;312;322" dur="7s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
