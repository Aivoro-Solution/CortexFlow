<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="Animated abstract data-table lookup: one row splitting into matched and unmatched paths">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#111111" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="450" fill="#FFFDF5"/>
  <rect width="800" height="450" fill="url(#grid)"/>

  <!-- Table: three rows entering from the left -->
  <g stroke="#111111" stroke-width="3" fill="none">
    <rect x="60" y="90" width="220" height="60" fill="#FFFDF5"/>
    <rect x="60" y="150" width="220" height="60" fill="#FFFDF5"/>
    <rect x="60" y="210" width="220" height="60" fill="#FFFDF5"/>
    <line x1="60" y1="120" x2="280" y2="120"/>
    <line x1="60" y1="180" x2="280" y2="180"/>
    <line x1="60" y1="240" x2="280" y2="240"/>
    <line x1="140" y1="90" x2="140" y2="270"/>
    <line x1="200" y1="90" x2="200" y2="270"/>
  </g>

  <!-- Orange dots travelling left to right through the rows -->
  <circle cx="90" cy="105" r="8" fill="#FF4D00">
    <animate attributeName="cx" values="90;250;250" keyTimes="0;0.7;1" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="105;105;195" keyTimes="0;0.7;1" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="90" cy="165" r="8" fill="#FF4D00">
    <animate attributeName="cx" values="90;250;250" keyTimes="0;0.7;1" dur="8s" begin="1.2s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="165;165;255" keyTimes="0;0.7;1" dur="8s" begin="1.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="90" cy="225" r="8" fill="#FF4D00">
    <animate attributeName="cx" values="90;250;250" keyTimes="0;0.7;1" dur="8s" begin="2.4s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="225;225;315" keyTimes="0;0.7;1" dur="8s" begin="2.4s" repeatCount="indefinite"/>
  </circle>

  <!-- Lookup gate: the single empty item that fans out ambiguously -->
  <g>
    <rect x="330" y="150" width="120" height="120" fill="#FFFDF5" stroke="#111111" stroke-width="3"/>
    <rect x="345" y="165" width="90" height="90" fill="none" stroke="#FF4D00" stroke-width="3" stroke-dasharray="10 8">
      <animate attributeName="stroke-dashoffset" values="0;-72" dur="6s" repeatCount="indefinite"/>
    </rect>
    <animateTransform attributeName="transform" type="rotate" values="0 390 210; 3 390 210; 0 390 210" dur="12s" repeatCount="indefinite"/>
  </g>

  <!-- Branching paths to the right: matched (solid) vs unmatched (dashed, tangled) -->
  <g stroke="#111111" stroke-width="3" fill="none">
    <path d="M 450 180 L 560 180 L 640 120 L 740 120"/>
    <path d="M 450 210 L 560 210 L 640 210 L 740 210" stroke-dasharray="12 8"/>
    <path d="M 450 240 L 560 240 L 640 300 L 740 300" stroke-dasharray="12 8"/>
  </g>

  <!-- Outcome boxes -->
  <g stroke="#111111" stroke-width="3">
    <rect x="640" y="90" width="100" height="60" fill="#FF4D00"/>
    <rect x="640" y="180" width="100" height="60" fill="#FFFDF5"/>
    <rect x="640" y="270" width="100" height="60" fill="#FFFDF5"/>
  </g>

  <!-- Slow drifting ring around the gate -->
  <circle cx="390" cy="210" r="95" fill="none" stroke="#111111" stroke-width="2" stroke-dasharray="4 10" opacity="0.5">
    <animateTransform attributeName="transform" type="rotate" values="0 390 210; 360 390 210" dur="40s" repeatCount="indefinite"/>
  </circle>

  <!-- Gentle pulse on the empty-item box -->
  <rect x="330" y="150" width="120" height="120" fill="none" stroke="#FF4D00" stroke-width="2" opacity="0">
    <animate attributeName="opacity" values="0;0.7;0" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="x" values="330;322;330" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="y" values="150;142;150" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="width" values="120;136;120" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="height" values="120;136;120" dur="8s" repeatCount="indefinite"/>
  </rect>
</svg>
