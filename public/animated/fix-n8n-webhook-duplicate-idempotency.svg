<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Abstract schematic of an idempotency gate: duplicate webhook event tokens filtered, only originals passing through">
  <rect width="800" height="450" fill="#FFFDF5"/>
  <g stroke="#111" stroke-width="1" opacity="0.18">
    <path d="M0 75 H800 M0 150 H800 M0 225 H800 M0 300 H800 M0 375 H800"/>
    <path d="M100 0 V450 M200 0 V450 M300 0 V450 M400 0 V450 M500 0 V450 M600 0 V450 M700 0 V450"/>
  </g>

  <!-- event tokens arriving on the feed rail (left) -->
  <g fill="none" stroke="#111" stroke-width="3">
    <line x1="40" y1="170" x2="330" y2="170"/>
    <line x1="40" y1="280" x2="330" y2="280"/>
  </g>
  <g fill="#FFFDF5" stroke="#111" stroke-width="3">
    <circle cx="120" cy="225" r="26"/>
    <circle cx="220" cy="225" r="26"/>
  </g>
  <circle cx="120" cy="225" r="26" fill="none" stroke="#111" stroke-width="3">
    <animate attributeName="cx" values="60;330" dur="9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="220" cy="225" r="26" fill="none" stroke="#FF4D00" stroke-width="4">
    <animate attributeName="cx" values="160;330" dur="9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="270" cy="225" r="26" fill="none" stroke="#111" stroke-width="3">
    <animate attributeName="cx" values="240;330" dur="9s" repeatCount="indefinite"/>
  </circle>

  <!-- the gate: vertical press frame with slow stamping motion -->
  <g stroke="#111" stroke-width="4" fill="none">
    <rect x="330" y="110" width="90" height="230"/>
  </g>
  <g fill="#FF4D00">
    <rect x="352" y="150" width="46" height="30">
      <animate attributeName="y" values="150;235;150" dur="6s" repeatCount="indefinite"/>
    </rect>
  </g>
  <line x1="375" y1="180" x2="375" y2="250" stroke="#111" stroke-width="3">
    <animate attributeName="y2" values="200;265;200" dur="6s" repeatCount="indefinite"/>
  </line>

  <!-- ledger drum rotating slowly behind the gate -->
  <g opacity="0.55" fill="none" stroke="#111" stroke-width="2">
    <ellipse cx="375" cy="380" rx="70" ry="18"/>
  </g>
  <g fill="none" stroke="#111" stroke-width="2">
    <g>
      <line x1="375" y1="380" x2="445" y2="380"/>
      <line x1="375" y1="380" x2="375" y2="362"/>
      <line x1="375" y1="380" x2="305" y2="380"/>
      <animateTransform attributeName="transform" type="rotate" from="0 375 380" to="360 375 380" dur="40s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- approved original exits right rail toward the charge node -->
  <g fill="none" stroke="#111" stroke-width="3">
    <line x1="420" y1="170" x2="620" y2="170"/>
    <line x1="420" y1="280" x2="620" y2="280"/>
  </g>
  <circle cx="470" cy="225" r="26" fill="none" stroke="#FF4D00" stroke-width="4">
    <animate attributeName="cx" values="430;610" dur="12s" repeatCount="indefinite"/>
  </circle>

  <!-- duplicate rejected downward into the bin -->
  <circle cx="560" cy="225" r="26" fill="none" stroke="#111" stroke-width="3" opacity="0.7">
    <animate attributeName="cy" values="225;330" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;0.15" dur="12s" repeatCount="indefinite"/>
  </circle>
  <g stroke="#111" stroke-width="4" fill="none">
    <rect x="510" y="330" width="100" height="60"/>
  </g>
  <rect x="510" y="330" width="100" height="12" fill="#111">
    <animate attributeName="width" values="20;100;20" dur="12s" repeatCount="indefinite"/>
  </rect>

  <!-- slow scanning beam across the gate -->
  <rect x="330" y="112" width="90" height="4" fill="#FF4D00" opacity="0.6">
    <animate attributeName="y" values="112;336;112" dur="8s" repeatCount="indefinite"/>
  </rect>
</svg>
