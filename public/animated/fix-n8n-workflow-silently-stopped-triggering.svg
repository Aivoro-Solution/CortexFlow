<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Abstract animation of a stalled schedule gear, a flatlined heartbeat, and a heartbeat lamp that finally blinks back on">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#111111" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- cream sheet + fine grid -->
  <rect x="0" y="0" width="800" height="450" fill="#FFFDF5"/>
  <rect x="0" y="0" width="800" height="450" fill="url(#grid)"/>
  <rect x="14" y="14" width="772" height="422" fill="none" stroke="#111111" stroke-width="3"/>

  <!-- stalled gear, left: rotates very slowly, pauses implied by long duration -->
  <g transform="translate(190 225)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="60s" repeatCount="indefinite"/>
      <g fill="none" stroke="#111111" stroke-width="4">
        <circle r="86"/>
        <circle r="52"/>
        <g>
          <rect x="-10" y="-104" width="20" height="36" fill="#FFFDF5"/>
          <rect x="-10" y="68" width="20" height="36" fill="#FFFDF5"/>
          <rect x="-104" y="-10" width="36" height="20" fill="#FFFDF5"/>
          <rect x="68" y="-10" width="36" height="20" fill="#FFFDF5"/>
          <rect x="-80" y="-80" width="20" height="30" fill="#FFFDF5" transform="rotate(45 0 0)"/>
          <rect x="60" y="-80" width="20" height="30" fill="#FFFDF5" transform="rotate(45 0 0)"/>
          <rect x="-80" y="50" width="20" height="30" fill="#FFFDF5" transform="rotate(45 0 0)"/>
          <rect x="60" y="50" width="20" height="30" fill="#FFFDF5" transform="rotate(45 0 0)"/>
        </g>
        <circle r="14" fill="#FFFDF5"/>
      </g>
      <!-- one orange tooth marks the gear's slow turn -->
      <rect x="-7" y="-104" width="14" height="36" fill="#FF4D00" stroke="#111111" stroke-width="3"/>
    </g>
    <!-- hub dot -->
    <circle r="6" fill="#111111"/>
  </g>

  <!-- flatline heartbeat trace, centre-right: line draws, holds flat, pulses again -->
  <g fill="none" stroke="#111111" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 330 225 L 430 225 L 455 225 L 475 175 L 500 285 L 525 205 L 545 225 L 770 225">
      <animate attributeName="stroke-dasharray" values="0 440; 440 0; 440 0; 0 440" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="stroke-dashoffset" values="0; 0; 0; -440" dur="12s" repeatCount="indefinite"/>
    </path>
  </g>
  <!-- orange pulse dot travelling along the trace -->
  <circle r="7" fill="#FF4D00" stroke="#111111" stroke-width="3">
    <animateMotion dur="12s" repeatCount="indefinite" path="M 330 225 L 430 225 L 455 225 L 475 175 L 500 285 L 525 205 L 545 225 L 770 225"/>
  </circle>

  <!-- signal lamp, top right: dark, then blinks orange back to life -->
  <g transform="translate(700 90)">
    <rect x="-34" y="-26" width="68" height="52" fill="#FFFDF5" stroke="#111111" stroke-width="3"/>
    <circle r="14" fill="#111111">
      <animate attributeName="fill" values="#111111; #111111; #FF4D00; #FF4D00; #111111" dur="12s" repeatCount="indefinite"/>
    </circle>
    <line x1="-34" y1="26" x2="34" y2="26" stroke="#111111" stroke-width="3"/>
  </g>

  <!-- slow drifting tick marks under the gear -->
  <g stroke="#111111" stroke-width="3" stroke-linecap="round">
    <line x1="120" y1="360" x2="120" y2="384">
      <animate attributeName="opacity" values="1; 0.15; 1" dur="6s" repeatCount="indefinite"/>
    </line>
    <line x1="190" y1="360" x2="190" y2="384">
      <animate attributeName="opacity" values="0.15; 1; 0.15" dur="6s" repeatCount="indefinite"/>
    </line>
    <line x1="260" y1="360" x2="260" y2="384">
      <animate attributeName="opacity" values="1; 0.15; 1" dur="6s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- small orange square drifting across the bottom, slow -->
  <rect x="0" y="410" width="14" height="14" fill="#FF4D00" stroke="#111111" stroke-width="2">
    <animate attributeName="x" values="40; 720; 40" dur="24s" repeatCount="indefinite"/>
  </rect>
</svg>
