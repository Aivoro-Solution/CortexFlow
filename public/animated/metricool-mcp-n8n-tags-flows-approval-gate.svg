<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Abstract tag press with an approval gate and an execution counter">
  <rect width="800" height="450" fill="#FFFDF5"/>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#111" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="450" fill="url(#grid)"/>
  <g fill="none" stroke="#111" stroke-width="6">
    <rect x="70" y="300" width="660" height="26" fill="#FFFDF5"/>
    <rect x="330" y="90" width="140" height="210" fill="#FFFDF5"/>
  </g>
  <g>
    <rect x="110" y="252" width="120" height="44" fill="#FFFDF5" stroke="#111" stroke-width="5">
      <animateTransform attributeName="transform" type="translate" values="0 0;60 0;0 0" dur="12s" repeatCount="indefinite"/>
    </rect>
    <rect x="560" y="252" width="120" height="44" fill="#FFFDF5" stroke="#111" stroke-width="5">
      <animateTransform attributeName="transform" type="translate" values="0 0;-40 0;0 0" dur="12s" repeatCount="indefinite"/>
    </rect>
  </g>
  <g>
    <rect x="362" y="150" width="76" height="26" fill="#FF4D00" stroke="#111" stroke-width="5">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 34;0 0" dur="8s" repeatCount="indefinite"/>
    </rect>
    <line x1="400" y1="90" x2="400" y2="150" stroke="#111" stroke-width="6">
      <animate attributeName="y2" values="150;184;150" dur="8s" repeatCount="indefinite"/>
    </line>
  </g>
  <g>
    <circle cx="150" cy="150" r="62" fill="none" stroke="#111" stroke-width="6"/>
    <circle cx="150" cy="150" r="8" fill="#111"/>
    <line x1="150" y1="150" x2="150" y2="102" stroke="#FF4D00" stroke-width="7" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" from="0 150 150" to="360 150 150" dur="40s" repeatCount="indefinite"/>
    </line>
    <line x1="150" y1="150" x2="188" y2="150" stroke="#111" stroke-width="6" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" from="0 150 150" to="360 150 150" dur="60s" repeatCount="indefinite"/>
    </line>
  </g>
  <g stroke="#111" stroke-width="5" fill="none">
    <path d="M470 225 H560" stroke-dasharray="10 8">
      <animate attributeName="stroke-dashoffset" from="36" to="0" dur="6s" repeatCount="indefinite"/>
    </path>
    <path d="M230 225 H330" stroke-dasharray="10 8">
      <animate attributeName="stroke-dashoffset" from="0" to="36" dur="6s" repeatCount="indefinite"/>
    </path>
  </g>
  <g fill="none" stroke="#111" stroke-width="5">
    <circle cx="640" cy="130" r="26">
      <animate attributeName="r" values="22;30;22" dur="8s" repeatCount="indefinite"/>
    </circle>
    <rect x="590" y="180" width="100" height="16" fill="#111" stroke="none">
      <animate attributeName="opacity" values="1;0.35;1" dur="6s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
