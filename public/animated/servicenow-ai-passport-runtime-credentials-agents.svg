<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Animated schematic of an AI agent receiving a signed runtime credential">
  <!-- cream background -->
  <rect x="0" y="0" width="800" height="450" fill="#FFFDF5"/>
  <!-- fine grid -->
  <g stroke="#111111" stroke-width="0.5" opacity="0.08">
    <path d="M0 45 H800 M0 90 H800 M0 135 H800 M0 180 H800 M0 225 H800 M0 270 H800 M0 315 H800 M0 360 H800 M0 405 H800"/>
    <path d="M40 0 V450 M80 0 V450 M120 0 V450 M160 0 V450 M200 0 V450 M240 0 V450 M280 0 V450 M320 0 V450 M360 0 V450 M400 0 V450 M440 0 V450 M480 0 V450 M520 0 V450 M560 0 V450 M600 0 V450 M640 0 V450 M680 0 V450 M720 0 V450 M760 0 V450"/>
  </g>

  <!-- agent node (left) -->
  <g>
    <circle cx="150" cy="225" r="34" fill="#FFFDF5" stroke="#111111" stroke-width="4"/>
    <circle cx="150" cy="225" r="10" fill="#111111"/>
    <circle cx="150" cy="225" r="18" fill="none" stroke="#111111" stroke-width="2" stroke-dasharray="6 6">
      <animateTransform attributeName="transform" type="rotate" from="0 150 225" to="360 150 225" dur="30s" repeatCount="indefinite"/>
    </circle>
    <path d="M150 259 v40" stroke="#111111" stroke-width="4"/>
  </g>

  <!-- dashed trust path from agent to credential -->
  <path id="trustPath" d="M190 225 C 300 150, 380 300, 470 225" fill="none" stroke="#111111" stroke-width="3" stroke-dasharray="10 8"/>

  <!-- travelling token dot along the path -->
  <circle cx="0" cy="0" r="9" fill="#FF4D00" stroke="#111111" stroke-width="3">
    <animateMotion dur="12s" repeatCount="indefinite" path="M190 225 C 300 150, 380 300, 470 225"/>
  </circle>

  <!-- credential card (right) -->
  <g>
    <rect x="500" y="150" width="170" height="150" rx="6" fill="#FFFDF5" stroke="#111111" stroke-width="5"/>
    <rect x="512" y="162" width="146" height="126" rx="4" fill="none" stroke="#111111" stroke-width="2"/>
    <!-- key motif on the card -->
    <circle cx="560" cy="215" r="16" fill="none" stroke="#FF4D00" stroke-width="5"/>
    <path d="M572 227 l34 34 M596 251 l10 -10 M588 259 l10 -10" stroke="#FF4D00" stroke-width="5" fill="none" stroke-linecap="round"/>
    <!-- card field lines -->
    <line x1="600" y1="185" x2="640" y2="185" stroke="#111111" stroke-width="4"/>
    <line x1="600" y1="200" x2="640" y2="200" stroke="#111111" stroke-width="4"/>
    <line x1="520" y1="272" x2="650" y2="272" stroke="#111111" stroke-width="4"/>
    <!-- expiry tick -->
    <circle cx="640" cy="240" r="8" fill="#FFFDF5" stroke="#111111" stroke-width="3"/>
    <path d="M640 232 v8 l6 4" stroke="#111111" stroke-width="3" fill="none"/>
  </g>

  <!-- rotating seal stamp behind the card -->
  <g opacity="0.9">
    <circle cx="585" cy="225" r="104" fill="none" stroke="#111111" stroke-width="3" stroke-dasharray="4 10" transform="translate(0 0)">
      <animateTransform attributeName="transform" type="rotate" from="0 585 225" to="360 585 225" dur="40s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- slow pulsing signal arcs above the card -->
  <g fill="none" stroke="#FF4D00" stroke-width="4">
    <path d="M585 120 a40 40 0 0 1 34 20" opacity="0.9">
      <animate attributeName="opacity" values="0.9;0.15;0.9" dur="8s" repeatCount="indefinite"/>
    </path>
    <path d="M585 100 a62 62 0 0 1 53 31" opacity="0.5">
      <animate attributeName="opacity" values="0.5;0.1;0.5" dur="8s" begin="2s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- drifting shield outline (slow float) -->
  <g stroke="#111111" stroke-width="4" fill="none">
    <path d="M700 320 l22 -8 22 8 v20 c0 16 -10 26 -22 32 c-12 -6 -22 -16 -22 -32 z">
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -10; 0 0" dur="9s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
