<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Abstract animation of a chat trigger leaking a field into a tool call">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#111111" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- paper -->
  <rect x="0" y="0" width="800" height="450" fill="#FFFDF5"/>
  <rect x="0" y="0" width="800" height="450" fill="url(#grid)"/>

  <!-- border -->
  <rect x="14" y="14" width="772" height="422" fill="none" stroke="#111111" stroke-width="3"/>

  <!-- chat bubble (trigger) -->
  <g stroke="#111111" stroke-width="3" fill="#FFFDF5">
    <rect x="70" y="120" width="180" height="120" rx="14"/>
    <path d="M 110 240 L 95 275 L 140 240" fill="#FFFDF5"/>
  </g>
  <!-- message lines inside the bubble -->
  <g stroke="#111111" stroke-width="3" stroke-linecap="round">
    <line x1="95" y1="155" x2="225" y2="155"/>
    <line x1="95" y1="185" x2="195" y2="185"/>
    <line x1="95" y1="215" x2="215" y2="215"/>
  </g>

  <!-- funnel / filter between trigger and tool -->
  <g stroke="#111111" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 300 140 L 420 140 L 385 225 L 385 310"/>
    <path d="M 300 310 L 420 310 L 385 225"/>
  </g>
  <!-- data blocks travelling through the funnel -->
  <circle r="7" fill="#111111">
    <animateMotion dur="12s" repeatCount="indefinite" path="M 280 180 L 360 180 L 385 225 L 385 300 L 470 300"/>
  </circle>
  <circle r="7" fill="#111111">
    <animateMotion dur="12s" begin="4s" repeatCount="indefinite" path="M 280 210 L 360 210 L 385 240 L 385 300 L 470 300"/>
  </circle>

  <!-- the leaked field: one orange block slipping through the filter -->
  <g>
    <rect x="365" y="245" width="40" height="40" rx="4" fill="#FF4D00" stroke="#111111" stroke-width="3">
      <animate attributeName="opacity" values="1;0.35;1" dur="8s" repeatCount="indefinite"/>
    </rect>
  </g>
  <circle r="8" fill="#FF4D00">
    <animateMotion dur="12s" begin="8s" repeatCount="indefinite" path="M 280 195 L 360 195 L 385 232 L 385 300 L 470 300"/>
  </circle>

  <!-- tool gear (MCP tool) -->
  <g transform="translate(580 225)">
    <g stroke="#111111" stroke-width="3" fill="#FFFDF5">
      <circle r="62"/>
      <circle r="30" fill="none"/>
      <rect x="-10" y="-78" width="20" height="22" rx="3"/>
      <rect x="-10" y="56" width="20" height="22" rx="3"/>
      <rect x="-78" y="-10" width="22" height="20" rx="3"/>
      <rect x="56" y="-10" width="22" height="20" rx="3"/>
      <rect x="-62" y="-62" width="20" height="20" rx="3" transform="rotate(45)"/>
      <rect x="42" y="-62" width="20" height="20" rx="3" transform="rotate(45)"/>
      <rect x="-62" y="42" width="20" height="20" rx="3" transform="rotate(45)"/>
      <rect x="42" y="42" width="20" height="20" rx="3" transform="rotate(45)"/>
    </g>
    <animateTransform attributeName="transform" type="rotate" values="0 580 225; 360 580 225" dur="60s" repeatCount="indefinite"/>
  </g>

  <!-- gear centre dot -->
  <circle cx="580" cy="225" r="10" fill="#FF4D00">
    <animate attributeName="opacity" values="1;0.3;1" dur="6s" repeatCount="indefinite"/>
  </circle>

  <!-- connector line: funnel to gear -->
  <g stroke="#111111" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M 420 225 L 500 225"/>
    <path d="M 250 180 L 300 180"/>
  </g>

  <!-- small status dots -->
  <circle cx="280" cy="180" r="8" fill="#111111"/>
  <circle cx="280" cy="210" r="8" fill="#111111"/>
  <circle cx="500" cy="225" r="8" fill="#111111"/>
</svg>
