<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Schematic animation of a webhook response timing out while a downstream wait node resumes">
  <rect x="0" y="0" width="800" height="450" fill="#FFFDF5"/>
  <g stroke="#E4E0D5" stroke-width="1">
    <path d="M0 50 H800 M0 100 H800 M0 150 H800 M0 200 H800 M0 250 H800 M0 300 H800 M0 350 H800 M0 400 H800"/>
    <path d="M50 0 V450 M100 0 V450 M150 0 V450 M200 0 V450 M250 0 V450 M300 0 V450 M350 0 V450 M400 0 V450 M450 0 V450 M500 0 V450 M550 0 V450 M600 0 V450 M650 0 V450 M700 0 V450 M750 0 V450"/>
  </g>

  <!-- Caller (browser) -->
  <g stroke="#111" stroke-width="3" fill="#FFFDF5">
    <rect x="30" y="180" width="110" height="90" fill="#FFFDF5"/>
    <rect x="40" y="192" width="90" height="14" fill="#FFFDF5"/>
    <rect x="40" y="214" width="60" height="10" fill="#E4E0D5"/>
    <rect x="40" y="230" width="75" height="10" fill="#E4E0D5"/>
    <rect x="40" y="246" width="50" height="10" fill="#FF4D00"/>
  </g>

  <!-- Request pulse: caller -> n8n (fast) -->
  <g fill="#111">
    <circle r="7" cx="150" cy="225">
      <animateMotion dur="6s" repeatCount="indefinite" path="M0 0 L400 0"/>
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.55;0.7;1" dur="6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- n8n node: webhook -->
  <g stroke="#111" stroke-width="3">
    <rect x="540" y="180" width="120" height="90" fill="#FF4D00"/>
    <rect x="560" y="205" width="80" height="40" fill="#FFFDF5"/>
  </g>

  <!-- Downstream AI agent node -->
  <g stroke="#111" stroke-width="3">
    <rect x="540" y="300" width="120" height="90" fill="#FFFDF5"/>
    <rect x="560" y="322" width="80" height="12" fill="#E4E0D5"/>
    <rect x="560" y="342" width="50" height="12" fill="#FF4D00">
      <animate attributeName="width" values="50;80;50" dur="12s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Connection line webhook -> agent (processing) -->
  <path d="M600 270 V300" stroke="#111" stroke-width="3" stroke-dasharray="8 6">
    <animate attributeName="stroke-dashoffset" from="0" to="-56" dur="6s" repeatCount="indefinite"/>
  </path>

  <!-- Response dashed path back to caller: fast immediate response vs slow wait -->
  <g fill="#FF4D00" stroke="#111" stroke-width="2">
    <rect x="300" y="100" width="18" height="18" transform="rotate(45 309 109)">
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 110" dur="24s" repeatCount="indefinite"/>
    </rect>
  </g>
  <path d="M309 119 L309 240" stroke="#111" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- Wait node paused indicator: slow pulsing ring -->
  <g stroke="#FF4D00" stroke-width="3" fill="none">
    <circle cx="600" cy="345" r="70" opacity="0">
      <animate attributeName="opacity" values="0;0.8;0" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="r" values="60;90;60" dur="10s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Clock hand: slow rotation showing the timing trap -->
  <g stroke="#111" stroke-width="3" fill="none">
    <circle cx="400" cy="330" r="46" fill="#FFFDF5"/>
    <line x1="400" y1="330" x2="400" y2="298" stroke="#FF4D00" stroke-width="4">
      <animateTransform attributeName="transform" type="rotate" from="0 400 330" to="360 400 330" dur="30s" repeatCount="indefinite"/>
    </line>
    <line x1="400" y1="330" x2="422" y2="330">
      <animateTransform attributeName="transform" type="rotate" from="0 400 330" to="360 400 330" dur="90s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- Timeline bar: immediate response vs downstream finish -->
  <g stroke="#111" stroke-width="3">
    <rect x="180" y="395" width="440" height="22" fill="#FFFDF5"/>
    <rect x="184" y="399" width="60" height="14" fill="#FF4D00">
      <animate attributeName="width" values="60;130;60" dur="18s" repeatCount="indefinite"/>
    </rect>
    <rect x="384" y="399" width="60" height="14" fill="#111" opacity="0.85">
      <animate attributeName="x" values="384;500;384" dur="18s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
