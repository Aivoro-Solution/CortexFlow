<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Abstract schematic of a bank vault door, a liability stamp press and a ledger drum">
  <rect width="800" height="450" fill="#FFFDF5"/>
  <g stroke="#111" stroke-width="1" opacity="0.18">
    <path d="M0 75 H800 M0 150 H800 M0 225 H800 M0 300 H800 M0 375 H800"/>
    <path d="M100 0 V450 M200 0 V450 M300 0 V450 M400 0 V450 M500 0 V450 M600 0 V450 M700 0 V450"/>
  </g>

  <!-- vault door: concentric rings, dial turning very slowly -->
  <g fill="none" stroke="#111" stroke-width="3">
    <circle cx="200" cy="225" r="120"/>
    <circle cx="200" cy="225" r="95"/>
    <circle cx="200" cy="225" r="70"/>
    <circle cx="200" cy="225" r="26"/>
  </g>
  <g fill="none" stroke="#111" stroke-width="2">
    <g>
      <line x1="200" y1="225" x2="200" y2="135"/>
      <line x1="200" y1="225" x2="278" y2="225"/>
      <line x1="200" y1="225" x2="200" y2="315"/>
      <line x1="200" y1="225" x2="122" y2="225"/>
      <animateTransform attributeName="transform" type="rotate" from="0 200 225" to="360 200 225" dur="60s" repeatCount="indefinite"/>
    </g>
  </g>
  <g>
    <line x1="200" y1="135" x2="200" y2="155" stroke="#FF4D00" stroke-width="6">
      <animateTransform attributeName="transform" type="rotate" from="0 200 225" to="360 200 225" dur="60s" repeatCount="indefinite"/>
    </line>
  </g>
  <g fill="#111">
    <circle cx="200" cy="105" r="5"/>
    <circle cx="200" cy="345" r="5"/>
    <circle cx="80" cy="225" r="5"/>
    <circle cx="320" cy="225" r="5"/>
  </g>

  <!-- instruction tokens sliding from the vault toward the press -->
  <g fill="none" stroke="#111" stroke-width="3">
    <line x1="330" y1="170" x2="470" y2="170"/>
    <line x1="330" y1="280" x2="470" y2="280"/>
  </g>
  <rect x="360" y="205" width="36" height="26" fill="#FFFDF5" stroke="#111" stroke-width="3">
    <animate attributeName="x" values="340;440" dur="9s" repeatCount="indefinite"/>
  </rect>
  <rect x="400" y="205" width="36" height="26" fill="#FFFDF5" stroke="#FF4D00" stroke-width="3">
    <animate attributeName="x" values="380;440" dur="9s" repeatCount="indefinite"/>
  </rect>

  <!-- the stamp press: frame with the orange stamp descending slowly -->
  <g stroke="#111" stroke-width="4" fill="none">
    <rect x="470" y="110" width="90" height="230"/>
  </g>
  <g fill="#FF4D00">
    <rect x="492" y="150" width="46" height="30">
      <animate attributeName="y" values="150;235;150" dur="7s" repeatCount="indefinite"/>
    </rect>
  </g>
  <line x1="515" y1="180" x2="515" y2="250" stroke="#111" stroke-width="3">
    <animate attributeName="y2" values="200;265;200" dur="7s" repeatCount="indefinite"/>
  </line>

  <!-- ledger drum turning slowly behind the exit rail -->
  <g opacity="0.55" fill="none" stroke="#111" stroke-width="2">
    <ellipse cx="660" cy="380" rx="70" ry="18"/>
  </g>
  <g fill="none" stroke="#111" stroke-width="2">
    <g>
      <line x1="660" y1="380" x2="730" y2="380"/>
      <line x1="660" y1="380" x2="660" y2="362"/>
      <line x1="660" y1="380" x2="590" y2="380"/>
      <animateTransform attributeName="transform" type="rotate" from="0 660 380" to="360 660 380" dur="45s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- stamped token exits right toward the ledger -->
  <g fill="none" stroke="#111" stroke-width="3">
    <line x1="560" y1="170" x2="740" y2="170"/>
    <line x1="560" y1="280" x2="740" y2="280"/>
  </g>
  <rect x="600" y="205" width="36" height="26" fill="#FFFDF5" stroke="#FF4D00" stroke-width="3">
    <animate attributeName="x" values="570;700" dur="12s" repeatCount="indefinite"/>
  </rect>

  <!-- the gate bar: the bank can shut the machine down -->
  <g>
    <rect x="585" y="120" width="120" height="10" fill="#FF4D00">
      <animate attributeName="opacity" values="1;0.35;1" dur="8s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
