<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M25 0H0V25" fill="none" stroke="#111111" stroke-width="0.5" opacity="0.12"/>
    </pattern>
  </defs>
  <rect width="800" height="450" fill="#FFFDF5"/>
  <rect width="800" height="450" fill="url(#grid)"/>
  <rect x="8" y="8" width="784" height="434" fill="none" stroke="#111111" stroke-width="4"/>

  <!-- left machine block -->
  <g>
    <rect x="70" y="165" width="150" height="120" fill="#FFFDF5" stroke="#111111" stroke-width="5"/>
    <rect x="86" y="181" width="118" height="34" fill="none" stroke="#111111" stroke-width="3"/>
    <rect x="86" y="229" width="52" height="40" fill="none" stroke="#111111" stroke-width="3"/>
    <circle cx="175" cy="249" r="10" fill="none" stroke="#111111" stroke-width="3"/>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -6; 0 0" dur="8s" repeatCount="indefinite"/>
  </g>

  <!-- right machine block -->
  <g>
    <rect x="580" y="165" width="150" height="120" fill="#FFFDF5" stroke="#111111" stroke-width="5"/>
    <rect x="596" y="181" width="118" height="34" fill="none" stroke="#111111" stroke-width="3"/>
    <rect x="662" y="229" width="52" height="40" fill="none" stroke="#111111" stroke-width="3"/>
    <circle cx="625" cy="249" r="10" fill="none" stroke="#111111" stroke-width="3"/>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 6; 0 0" dur="9s" repeatCount="indefinite"/>
  </g>

  <!-- connecting arms to the shared key -->
  <path d="M220 225 H330" stroke="#111111" stroke-width="6" stroke-dasharray="14 10">
    <animate attributeName="stroke-dashoffset" values="0; -48" dur="8s" repeatCount="indefinite"/>
  </path>
  <path d="M470 225 H580" stroke="#111111" stroke-width="6" stroke-dasharray="14 10">
    <animate attributeName="stroke-dashoffset" values="0; 48" dur="8s" repeatCount="indefinite"/>
  </path>

  <!-- single shared key, slow rotation -->
  <g>
    <circle cx="400" cy="225" r="58" fill="none" stroke="#111111" stroke-width="3" stroke-dasharray="6 8" opacity="0.5">
      <animateTransform attributeName="transform" type="rotate" from="0 400 225" to="360 400 225" dur="40s" repeatCount="indefinite"/>
    </circle>
    <g>
      <rect x="372" y="168" width="56" height="44" fill="#FF4D00" stroke="#111111" stroke-width="5"/>
      <rect x="386" y="182" width="28" height="16" fill="#FFFDF5" stroke="#111111" stroke-width="3"/>
      <rect x="392" y="212" width="16" height="72" fill="#FF4D00" stroke="#111111" stroke-width="5"/>
      <path d="M408 248 h22 M408 268 h16" stroke="#111111" stroke-width="6"/>
      <animateTransform attributeName="transform" type="rotate" values="-6 400 225; 6 400 225; -6 400 225" dur="12s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- token dot travelling between both machines through the key -->
  <circle r="8" fill="#FF4D00" stroke="#111111" stroke-width="3">
    <animateMotion path="M145 225 H655" dur="14s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1; 0.4; 1" dur="7s" repeatCount="indefinite"/>
  </circle>

  <!-- corner accents -->
  <path d="M40 60 l34 0 l-34 34 Z" fill="none" stroke="#111111" stroke-width="4"/>
  <path d="M760 390 l-34 0 l34 -34 Z" fill="none" stroke="#111111" stroke-width="4"/>
  <circle cx="720" cy="70" r="12" fill="none" stroke="#111111" stroke-width="4">
    <animate attributeName="r" values="10; 15; 10" dur="10s" repeatCount="indefinite"/>
  </circle>
  <circle cx="80" cy="380" r="12" fill="none" stroke="#111111" stroke-width="4">
    <animate attributeName="r" values="15; 10; 15" dur="10s" repeatCount="indefinite"/>
  </circle>
</svg>
