<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Abstract schematic of a blocked gateway">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#0C0C10" stroke-width="0.5" opacity="0.18"/>
    </pattern>
  </defs>

  <!-- cream sheet + fine grid -->
  <rect x="0" y="0" width="800" height="450" fill="#FFFDF5"/>
  <rect x="0" y="0" width="800" height="450" fill="url(#grid)"/>

  <!-- frame -->
  <rect x="24" y="24" width="752" height="402" fill="none" stroke="#0C0C10" stroke-width="6"/>

  <!-- server / gateway box -->
  <rect x="70" y="150" width="180" height="150" fill="#FFFDF5" stroke="#0C0C10" stroke-width="5"/>
  <rect x="95" y="180" width="130" height="12" fill="#0C0C10"/>
  <rect x="95" y="205" width="90" height="12" fill="#0C0C10" opacity="0.6"/>
  <rect x="95" y="230" width="110" height="12" fill="#0C0C10" opacity="0.6"/>
  <circle cx="230" cy="280" r="8" fill="#FF4D00">
    <animate attributeName="opacity" values="1;0.25;1" dur="6s" repeatCount="indefinite"/>
  </circle>

  <!-- packet stream moving slowly toward the wall -->
  <g>
    <circle cx="330" cy="225" r="10" fill="none" stroke="#0C0C10" stroke-width="4">
      <animate attributeName="cx" values="280;330;280" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="380" cy="225" r="10" fill="none" stroke="#0C0C10" stroke-width="4" opacity="0.7">
      <animate attributeName="cx" values="330;380;330" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="430" cy="225" r="10" fill="none" stroke="#0C0C10" stroke-width="4" opacity="0.45">
      <animate attributeName="cx" values="380;430;380" dur="8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- the wall: brick pattern, black bars -->
  <g stroke="#0C0C10" stroke-width="5" fill="#0C0C10">
    <rect x="500" y="60" width="40" height="330"/>
    <rect x="560" y="60" width="40" height="330"/>
    <rect x="620" y="60" width="40" height="330"/>
  </g>
  <g stroke="#FFFDF5" stroke-width="3">
    <line x1="540" y1="120" x2="560" y2="120"/>
    <line x1="600" y1="180" x2="620" y2="180"/>
    <line x1="540" y1="240" x2="560" y2="240"/>
    <line x1="600" y1="300" x2="620" y2="300"/>
  </g>

  <!-- orange strike band pulsing slowly across the wall -->
  <rect x="490" y="200" width="190" height="50" fill="#FF4D00" opacity="0.85">
    <animate attributeName="y" values="200;190;200" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.85;0.5;0.85" dur="7s" repeatCount="indefinite"/>
  </rect>

  <!-- shield shape, slowly rotating -->
  <g transform="translate(712,110)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="40s" repeatCount="indefinite"/>
      <path d="M0,-34 L30,-18 L30,8 C30,26 16,34 0,38 C-16,34 -30,26 -30,8 L-30,-18 Z"
            fill="none" stroke="#0C0C10" stroke-width="5"/>
      <line x1="-14" y1="-4" x2="14" y2="16" stroke="#FF4D00" stroke-width="6"/>
      <line x1="14" y1="-4" x2="-14" y2="16" stroke="#FF4D00" stroke-width="6"/>
    </g>
  </g>

  <!-- blocked return pulses bouncing off the wall -->
  <g stroke="#FF4D00" stroke-width="4" fill="none">
    <path d="M500 225 q-30 -20 -55 -10">
      <animate attributeName="d" values="M500 225 q-30 -20 -55 -10;M500 225 q-40 -28 -75 -14;M500 225 q-30 -20 -55 -10" dur="9s" repeatCount="indefinite"/>
    </path>
    <path d="M500 225 q-30 20 -55 10">
      <animate attributeName="d" values="M500 225 q-30 20 -55 10;M500 225 q-40 28 -75 14;M500 225 q-30 20 -55 10" dur="9s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- drifting crosshair, very slow -->
  <g stroke="#0C0C10" stroke-width="3" opacity="0.55">
    <circle cx="150" cy="80" r="22" fill="none"/>
    <line x1="128" y1="80" x2="172" y2="80"/>
    <line x1="150" y1="58" x2="150" y2="102"/>
    <animateTransform attributeName="transform" type="translate" values="0 0;30 14;0 0" dur="14s" repeatCount="indefinite"/>
  </g>

  <!-- schematic corner ticks -->
  <g stroke="#0C0C10" stroke-width="4">
    <path d="M24 44 V24 H44" fill="none"/>
    <path d="M756 24 H776 V44" fill="none"/>
    <path d="M24 406 V426 H44" fill="none"/>
    <path d="M756 426 H776 V406" fill="none"/>
  </g>
</svg>
