<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Abstract animation of record cards passing through a press and a permission gate">
  <defs>
    <pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M25 0H0V25" fill="none" stroke="#111111" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <path id="railPath" d="M70 320 H730" fill="none"/>
  </defs>
  <rect width="800" height="450" fill="#FFFDF5"/>
  <rect width="800" height="450" fill="url(#grid)"/>
  <!-- rail -->
  <line x1="70" y1="320" x2="730" y2="320" stroke="#111111" stroke-width="4"/>
  <line x1="70" y1="334" x2="730" y2="334" stroke="#111111" stroke-width="2"/>
  <g stroke="#111111" stroke-width="2">
    <line x1="110" y1="320" x2="110" y2="334"/><line x1="170" y1="320" x2="170" y2="334"/>
    <line x1="230" y1="320" x2="230" y2="334"/><line x1="290" y1="320" x2="290" y2="334"/>
    <line x1="350" y1="320" x2="350" y2="334"/><line x1="410" y1="320" x2="410" y2="334"/>
    <line x1="470" y1="320" x2="470" y2="334"/><line x1="530" y1="320" x2="530" y2="334"/>
    <line x1="590" y1="320" x2="590" y2="334"/><line x1="650" y1="320" x2="650" y2="334"/>
  </g>
  <!-- press frame -->
  <g stroke="#111111" stroke-width="4" fill="#FFFDF5">
    <rect x="300" y="120" width="18" height="200"/>
    <rect x="430" y="120" width="18" height="200"/>
    <rect x="292" y="104" width="164" height="22"/>
  </g>
  <!-- press head bobbing slowly -->
  <g>
    <rect x="330" y="170" width="88" height="34" fill="#111111"/>
    <rect x="362" y="126" width="24" height="48" fill="#111111"/>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 26;0 0" dur="6s" repeatCount="indefinite"/>
  </g>
  <!-- cam drum rotating slowly -->
  <g>
    <circle cx="520" cy="190" r="42" fill="#FFFDF5" stroke="#111111" stroke-width="4"/>
    <circle cx="520" cy="190" r="10" fill="#111111"/>
    <g stroke="#111111" stroke-width="4">
      <line x1="520" y1="148" x2="520" y2="232"/>
      <line x1="478" y1="190" x2="562" y2="190"/>
      <line x1="490" y1="160" x2="550" y2="220"/>
      <line x1="550" y1="160" x2="490" y2="220"/>
    </g>
    <animateTransform attributeName="transform" type="rotate" from="0 520 190" to="360 520 190" dur="30s" repeatCount="indefinite"/>
  </g>
  <!-- permission gate, orange accent -->
  <g stroke="#111111" stroke-width="4">
    <rect x="622" y="190" width="16" height="130" fill="#FFFDF5"/>
    <rect x="686" y="190" width="16" height="130" fill="#FFFDF5"/>
  </g>
  <g>
    <rect x="638" y="205" width="48" height="14" fill="#FF4D00" stroke="#111111" stroke-width="3"/>
    <animateTransform attributeName="transform" type="rotate" values="0 638 212;-38 638 212;0 638 212" dur="12s" repeatCount="indefinite"/>
  </g>
  <!-- record cards travelling the rail -->
  <g>
    <rect x="-26" y="-34" width="52" height="34" fill="#FFFDF5" stroke="#111111" stroke-width="3"/>
    <line x1="-16" y1="-22" x2="16" y2="-22" stroke="#111111" stroke-width="3"/>
    <line x1="-16" y1="-12" x2="6" y2="-12" stroke="#111111" stroke-width="3"/>
    <animateMotion dur="18s" repeatCount="indefinite" path="M70 320 H730"/>
  </g>
  <g>
    <rect x="-26" y="-34" width="52" height="34" fill="#FF4D00" stroke="#111111" stroke-width="3"/>
    <animateMotion dur="18s" begin="-9s" repeatCount="indefinite" path="M70 320 H730"/>
  </g>
  <!-- output tray -->
  <g stroke="#111111" stroke-width="4" fill="none">
    <path d="M700 360 H770 L758 392 H712 Z"/>
  </g>
  <!-- base line -->
  <line x1="60" y1="400" x2="740" y2="400" stroke="#111111" stroke-width="3"/>
</svg>
