<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Three connected nodes with a repaired link">
  <defs>
    <pattern id="grid2" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#d8d8d4" stroke-width="0.6"/>
    </pattern>
    <pattern id="gridMajor2" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M 100 0 L 0 0 0 100" fill="none" stroke="#c9c9c5" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- drawing sheet -->
  <rect x="0" y="0" width="800" height="450" fill="#ffffff"/>
  <rect x="0" y="0" width="800" height="450" fill="url(#grid2)"/>
  <rect x="0" y="0" width="800" height="450" fill="url(#gridMajor2)"/>
  <rect x="14" y="14" width="772" height="422" fill="none" stroke="#111111" stroke-width="2.5"/>

  <!-- corner registration ticks -->
  <g stroke="#111111" stroke-width="2.5">
    <path d="M14 44 L14 14 L44 14"/>
    <path d="M756 14 L786 14 L786 44"/>
    <path d="M786 406 L786 436 L756 436"/>
    <path d="M44 436 L14 436 L14 406"/>
  </g>

  <!-- three connector nodes -->
  <g>
    <!-- left node -->
    <rect x="110" y="175" width="90" height="90" fill="#ffffff" stroke="#111111" stroke-width="2.5"/>
    <circle cx="155" cy="220" r="22" fill="none" stroke="#111111" stroke-width="2"/>
    <circle cx="155" cy="220" r="8" fill="#111111"/>

    <!-- middle node -->
    <rect x="355" y="175" width="90" height="90" fill="#ffffff" stroke="#111111" stroke-width="2.5"/>
    <circle cx="400" cy="220" r="22" fill="none" stroke="#111111" stroke-width="2"/>
    <circle cx="400" cy="220" r="8" fill="#FF4D00"/>

    <!-- right node -->
    <rect x="600" y="175" width="90" height="90" fill="#ffffff" stroke="#111111" stroke-width="2.5"/>
    <circle cx="645" cy="220" r="22" fill="none" stroke="#111111" stroke-width="2"/>
    <circle cx="645" cy="220" r="8" fill="#111111"/>
  </g>

  <!-- healthy link: left -> middle -->
  <line x1="200" y1="220" x2="355" y2="220" stroke="#111111" stroke-width="2.5"/>

  <!-- repaired link: middle -> right (two segments rejoined at the orange joint) -->
  <line x1="445" y1="220" x2="520" y2="220" stroke="#111111" stroke-width="2.5"/>
  <line x1="548" y1="220" x2="600" y2="220" stroke="#111111" stroke-width="2.5"/>
  <rect x="520" y="206" width="28" height="28" fill="#ffffff" stroke="#FF4D00" stroke-width="2.5" transform="rotate(45 534 220)">
    <animateTransform attributeName="transform" type="rotate" from="45 534 220" to="405 534 220" dur="40s" repeatCount="indefinite"/>
  </rect>

  <!-- signal pulse traveling the repaired link -->
  <circle r="6" fill="#FF4D00">
    <animateMotion dur="9s" repeatCount="indefinite" path="M 445 220 L 600 220"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="9s" repeatCount="indefinite"/>
  </circle>

  <!-- debug crosshairs around the repair joint -->
  <g stroke="#FF4D00" stroke-width="1.6" opacity="0.8">
    <path d="M534 160 L534 176 M526 168 L542 168"/>
    <path d="M534 264 L534 280 M526 272 L542 272"/>
  </g>

  <!-- slow diagnostic sweep line -->
  <line x1="60" y1="60" x2="740" y2="60" stroke="#111111" stroke-width="1.2" stroke-dasharray="4 8" opacity="0.6">
    <animate attributeName="y1" values="60;390;60" dur="18s" repeatCount="indefinite"/>
    <animate attributeName="y2" values="60;390;60" dur="18s" repeatCount="indefinite"/>
  </line>

  <!-- slowly rotating dashed ring around middle node -->
  <circle cx="400" cy="220" r="74" fill="none" stroke="#111111" stroke-width="1.4" stroke-dasharray="6 10" opacity="0.55">
    <animateTransform attributeName="transform" type="rotate" from="0 400 220" to="360 400 220" dur="48s" repeatCount="indefinite"/>
  </circle>
</svg>
