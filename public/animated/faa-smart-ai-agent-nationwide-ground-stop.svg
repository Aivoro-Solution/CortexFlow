<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="Animated schematic: a radar tower sweeping while flight-route arcs cross the sky and a human approval lever gates the signal">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#111111" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="450" fill="#FFFDF5"/>
  <rect width="800" height="450" fill="url(#grid)"/>

  <!-- ground line -->
  <line x1="40" y1="380" x2="760" y2="380" stroke="#111111" stroke-width="3"/>

  <!-- radar tower -->
  <g stroke="#111111" stroke-width="3" fill="none">
    <path d="M 150 380 L 170 250 L 210 250 L 230 380 Z" fill="#FFFDF5"/>
    <line x1="160" y1="330" x2="220" y2="330"/>
    <line x1="166" y1="290" x2="214" y2="290"/>
    <line x1="190" y1="250" x2="190" y2="215"/>
    <circle cx="190" cy="200" r="16" fill="#FFFDF5"/>
    <line x1="190" y1="184" x2="190" y2="172"/>
  </g>
  <!-- sweeping radar beam -->
  <g>
    <line x1="190" y1="200" x2="330" y2="120" stroke="#FF4D00" stroke-width="3"/>
    <circle cx="330" cy="120" r="6" fill="#FF4D00" stroke="none"/>
    <animateTransform attributeName="transform" type="rotate" from="0 190 200" to="360 190 200" dur="36s" repeatCount="indefinite"/>
  </g>
  <circle cx="190" cy="200" r="34" fill="none" stroke="#111111" stroke-width="1.5" stroke-dasharray="4 6">
    <animate attributeName="r" values="34;52;34" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="stroke-opacity" values="0.7;0.15;0.7" dur="12s" repeatCount="indefinite"/>
  </circle>

  <!-- flight route arcs -->
  <g fill="none" stroke="#111111" stroke-width="2.5">
    <path d="M 300 380 Q 480 180 660 300">
      <animate attributeName="stroke-dashoffset" from="0" to="-240" dur="14s" repeatCount="indefinite"/>
      <animate attributeName="stroke-dasharray" values="2 10; 14 10; 2 10" dur="14s" repeatCount="indefinite"/>
    </path>
    <path d="M 330 380 Q 500 240 700 340">
      <animate attributeName="stroke-dashoffset" from="0" to="240" dur="18s" repeatCount="indefinite"/>
      <animate attributeName="stroke-dasharray" values="2 10; 14 10; 2 10" dur="18s" repeatCount="indefinite"/>
    </path>
  </g>
  <!-- plane dot travelling the first arc -->
  <circle r="7" fill="#FF4D00" stroke="#111111" stroke-width="2">
    <animateMotion dur="14s" repeatCount="indefinite" path="M 300 380 Q 480 180 660 300"/>
  </circle>
  <circle r="5" fill="#FFFDF5" stroke="#111111" stroke-width="2">
    <animateMotion dur="18s" repeatCount="indefinite" path="M 330 380 Q 500 240 700 340"/>
  </circle>

  <!-- human approval lever gate between tower and routes -->
  <g stroke="#111111" stroke-width="3" fill="#FFFDF5">
    <rect x="420" y="330" width="90" height="50" rx="4"/>
    <line x1="465" y1="330" x2="465" y2="300"/>
  </g>
  <g>
    <line x1="465" y1="300" x2="505" y2="262" stroke="#FF4D00" stroke-width="5" stroke-linecap="round"/>
    <circle cx="505" cy="262" r="9" fill="#FF4D00" stroke="#111111" stroke-width="3"/>
    <animateTransform attributeName="transform" type="rotate" values="-6 465 300; 6 465 300; -6 465 300" dur="9s" repeatCount="indefinite"/>
  </g>

  <!-- suggestion queue dots drifting up from the tower -->
  <g fill="#111111">
    <circle cx="250" cy="360" r="4">
      <animate attributeName="cy" values="360;300;360" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0.2;0.9" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="272" cy="350" r="4">
      <animate attributeName="cy" values="350;290;350" dur="8s" begin="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0.2;0.9" dur="8s" begin="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="294" cy="360" r="4">
      <animate attributeName="cy" values="360;300;360" dur="8s" begin="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0.2;0.9" dur="8s" begin="4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- orange signal lamp on the tower -->
  <circle cx="190" cy="172" r="6" fill="#FF4D00" stroke="#111111" stroke-width="2">
    <animate attributeName="opacity" values="1;0.25;1" dur="6s" repeatCount="indefinite"/>
  </circle>
</svg>
