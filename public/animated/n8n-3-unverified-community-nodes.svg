<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <pattern id="gridf1" width="6" height="6" patternUnits="userSpaceOnUse">
      <path d="M6 0H0V6" fill="none" stroke="#111111" stroke-width="0.35" opacity="0.07"/>
    </pattern>
    <pattern id="grid1" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#111111" stroke-width="0.5" opacity="0.16"/>
    </pattern>
  </defs>
  <rect x="0" y="0" width="800" height="450" fill="#ffffff"/>
  <rect x="0" y="0" width="800" height="450" fill="url(#gridf1)"/>
  <rect x="0" y="0" width="800" height="450" fill="url(#grid1)"/>
  <!-- drawing sheet frame -->
  <rect x="14" y="14" width="772" height="422" fill="none" stroke="#111111" stroke-width="2"/>
  <!-- corner registration ticks -->
  <g stroke="#111111" stroke-width="2">
    <path d="M14 44 V14 H44"/><path d="M756 14 H786 V44"/>
    <path d="M786 406 V436 H756"/><path d="M44 436 H14 V406"/>
  </g>
  <!-- crosshair marks -->
  <g stroke="#111111" stroke-width="1" opacity="0.55" fill="none">
    <circle cx="80" cy="90" r="14"/><path d="M80 68 V112 M58 90 H102"/>
    <circle cx="720" cy="360" r="14"/><path d="M720 338 V382 M698 360 H742"/>
  </g>

  <!-- slow rotating dashed survey ring -->
  <circle cx="400" cy="262" r="172" fill="none" stroke="#111111" stroke-width="1.2" stroke-dasharray="12 9" opacity="0.7">
    <animateTransform attributeName="transform" type="rotate" from="0 400 262" to="360 400 262" dur="60s" repeatCount="indefinite"/>
  </circle>
  <circle cx="400" cy="262" r="150" fill="none" stroke="#111111" stroke-width="0.8" stroke-dasharray="3 6" opacity="0.45">
    <animateTransform attributeName="transform" type="rotate" from="360 400 262" to="0 400 262" dur="90s" repeatCount="indefinite"/>
  </circle>

  <!-- orbiting plugin-node markers -->
  <g fill="#ffffff" stroke="#111111" stroke-width="1.5">
    <rect x="-9" y="-9" width="18" height="18">
      <animateMotion dur="24s" repeatCount="indefinite" path="M 228 262 A 172 172 0 1 1 572 262 A 172 172 0 1 1 228 262"/>
    </rect>
    <rect x="-9" y="-9" width="18" height="18">
      <animateMotion dur="24s" begin="-8s" repeatCount="indefinite" path="M 228 262 A 172 172 0 1 1 572 262 A 172 172 0 1 1 228 262"/>
    </rect>
    <rect x="-9" y="-9" width="18" height="18" stroke="#FF4D00" stroke-width="2">
      <animateMotion dur="24s" begin="-16s" repeatCount="indefinite" path="M 228 262 A 172 172 0 1 1 572 262 A 172 172 0 1 1 228 262"/>
    </rect>
  </g>

  <!-- shield -->
  <path d="M 300 150 L 500 150 L 500 285 Q 500 360 400 402 Q 300 360 300 285 Z"
        fill="#ffffff" stroke="#111111" stroke-width="2.5"/>
  <path d="M 318 166 L 482 166 L 482 282 Q 482 344 400 380 Q 318 344 318 282 Z"
        fill="none" stroke="#111111" stroke-width="1" opacity="0.5"/>
  <!-- circuit traces inside shield -->
  <g stroke="#111111" stroke-width="1" fill="none" opacity="0.65">
    <path d="M 340 300 L 340 340 L 380 340"/>
    <path d="M 460 300 L 460 336 L 420 336"/>
    <circle cx="340" cy="300" r="3" fill="#111111"/>
    <circle cx="460" cy="300" r="3" fill="#111111"/>
  </g>

  <!-- padlock -->
  <rect x="362" y="196" width="76" height="58" fill="#ffffff" stroke="#111111" stroke-width="2.5"/>
  <path d="M 376 196 V 178 A 24 24 0 0 1 424 178 V 196" fill="none" stroke="#111111" stroke-width="2.5"/>
  <!-- keyhole: the one signal-orange accent, slow pulse -->
  <g fill="#FF4D00">
    <circle cx="400" cy="216" r="8">
      <animate attributeName="opacity" values="0.45;1;0.45" dur="8s" repeatCount="indefinite"/>
    </circle>
    <rect x="396" y="220" width="8" height="16">
      <animate attributeName="opacity" values="0.45;1;0.45" dur="8s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- slow data packets along bottom track -->
  <line x1="60" y1="412" x2="740" y2="412" stroke="#111111" stroke-width="1" stroke-dasharray="6 6" opacity="0.5"/>
  <circle cx="0" cy="0" r="6" fill="#FF4D00">
    <animateMotion dur="16s" repeatCount="indefinite" path="M 60 412 L 740 412"/>
  </circle>
  <circle cx="0" cy="0" r="6" fill="#ffffff" stroke="#111111" stroke-width="1.5">
    <animateMotion dur="16s" begin="-8s" repeatCount="indefinite" path="M 60 412 L 740 412"/>
  </circle>
</svg>
