<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Abstract schematic of a swarm of small blocky agents feeding into a coordination press with a message counter">
  <rect width="800" height="450" fill="#FFFDF5"/>
  <g stroke="#111" stroke-width="1" opacity="0.18">
    <path d="M0 75 H800 M0 150 H800 M0 225 H800 M0 300 H800 M0 375 H800"/>
    <path d="M100 0 V450 M200 0 V450 M300 0 V450 M400 0 V450 M500 0 V450 M600 0 V450 M700 0 V450"/>
  </g>

  <!-- blocky voxel terrain -->
  <g fill="none" stroke="#111" stroke-width="3">
    <path d="M60 380 H180 V330 H260 V360 H360 V320 H470 V365 H560 V335 H740"/>
    <path d="M60 380 V450 M740 335 V450"/>
  </g>
  <g fill="#111">
    <rect x="100" y="350" width="18" height="18"/>
    <rect x="300" y="330" width="18" height="18"/>
    <rect x="500" y="345" width="18" height="18"/>
  </g>

  <!-- swarm cubes drifting slowly toward the press -->
  <g fill="#FFFDF5" stroke="#111" stroke-width="3">
    <rect x="90" y="180" width="34" height="34">
      <animate attributeName="y" values="180;150;180" dur="7s" repeatCount="indefinite"/>
    </rect>
    <rect x="150" y="220" width="34" height="34">
      <animate attributeName="y" values="220;190;220" dur="8s" repeatCount="indefinite"/>
    </rect>
    <rect x="120" y="260" width="34" height="34">
      <animate attributeName="y" values="260;235;260" dur="9s" repeatCount="indefinite"/>
    </rect>
    <rect x="210" y="180" width="34" height="34">
      <animate attributeName="y" values="180;155;180" dur="7.5s" repeatCount="indefinite"/>
    </rect>
  </g>
  <g fill="#FF4D00" stroke="#111" stroke-width="3">
    <rect x="180" y="140" width="34" height="34">
      <animate attributeName="y" values="140;115;140" dur="6s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- message lines between cubes, pulsing slowly -->
  <g fill="none" stroke="#111" stroke-width="2" opacity="0.7">
    <line x1="124" y1="197" x2="180" y2="157">
      <animate attributeName="opacity" values="0.7;0.2;0.7" dur="6s" repeatCount="indefinite"/>
    </line>
    <line x1="184" y1="237" x2="154" y2="277">
      <animate attributeName="opacity" values="0.2;0.7;0.2" dur="8s" repeatCount="indefinite"/>
    </line>
    <line x1="227" y1="197" x2="197" y2="157">
      <animate attributeName="opacity" values="0.7;0.2;0.7" dur="7s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- the coordination press: frame with a slowly descending orange stamp -->
  <g stroke="#111" stroke-width="4" fill="none">
    <rect x="380" y="90" width="110" height="250"/>
  </g>
  <g fill="#FF4D00">
    <rect x="405" y="130" width="60" height="36">
      <animate attributeName="y" values="130;220;130" dur="7s" repeatCount="indefinite"/>
    </rect>
  </g>
  <line x1="435" y1="166" x2="435" y2="230" stroke="#111" stroke-width="3">
    <animate attributeName="y2" values="190;250;190" dur="7s" repeatCount="indefinite"/>
  </line>

  <!-- cubes sliding from the swarm into the press -->
  <g fill="none" stroke="#111" stroke-width="3">
    <line x1="260" y1="180" x2="380" y2="180"/>
    <line x1="260" y1="280" x2="380" y2="280"/>
  </g>
  <rect x="290" y="215" width="34" height="34" fill="#FFFDF5" stroke="#111" stroke-width="3">
    <animate attributeName="x" values="270;330" dur="9s" repeatCount="indefinite"/>
  </rect>

  <!-- message drum turning very slowly behind the exit rail -->
  <g opacity="0.55" fill="none" stroke="#111" stroke-width="2">
    <ellipse cx="620" cy="380" rx="80" ry="20"/>
  </g>
  <g fill="none" stroke="#111" stroke-width="2">
    <g>
      <line x1="620" y1="380" x2="700" y2="380"/>
      <line x1="620" y1="380" x2="620" y2="360"/>
      <line x1="620" y1="380" x2="540" y2="380"/>
      <animateTransform attributeName="transform" type="rotate" from="0 620 380" to="360 620 380" dur="45s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- stamped cube exits right toward the drum -->
  <g fill="none" stroke="#111" stroke-width="3">
    <line x1="490" y1="180" x2="700" y2="180"/>
    <line x1="490" y1="280" x2="700" y2="280"/>
  </g>
  <rect x="560" y="215" width="34" height="34" fill="#FFFDF5" stroke="#FF4D00" stroke-width="3">
    <animate attributeName="x" values="520;660" dur="12s" repeatCount="indefinite"/>
  </rect>

  <!-- the coordination gauge needle sweeping slowly -->
  <g fill="none" stroke="#111" stroke-width="3">
    <circle cx="660" cy="120" r="52"/>
    <circle cx="660" cy="120" r="8"/>
  </g>
  <g>
    <line x1="660" y1="120" x2="660" y2="78" stroke="#FF4D00" stroke-width="5">
      <animateTransform attributeName="transform" type="rotate" from="-50 660 120" to="50 660 120" dur="10s" repeatCount="indefinite"/>
    </line>
  </g>
</svg>
