<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <rect width="800" height="450" fill="#FFFDF5"/>
  <!-- fine grid -->
  <g stroke="#111" stroke-width="0.5" opacity="0.12">
    <path d="M0 45 H800 M0 90 H800 M0 135 H800 M0 180 H800 M0 225 H800 M0 270 H800 M0 315 H800 M0 360 H800 M0 405 H800"/>
    <path d="M80 0 V450 M160 0 V450 M240 0 V450 M320 0 V450 M400 0 V450 M480 0 V450 M560 0 V450 M640 0 V450 M720 0 V450"/>
  </g>

  <!-- left block: the key (n8n) -->
  <g stroke="#111" stroke-width="6" fill="#FFFDF5">
    <rect x="90" y="150" width="150" height="150" fill="#FFFDF5">
      <animate attributeName="x" values="90;110;90" dur="7s" repeatCount="indefinite"/>
    </rect>
    <!-- key shape -->
    <circle cx="185" cy="210" r="26" fill="#FF4D00">
      <animate attributeName="cx" values="185;205;185" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="185" cy="210" r="10" fill="#FFFDF5">
      <animate attributeName="cx" values="185;205;185" dur="7s" repeatCount="indefinite"/>
    </circle>
    <rect x="208" y="203" width="60" height="14" fill="#FF4D00">
      <animate attributeName="x" values="208;228;208" dur="7s" repeatCount="indefinite"/>
    </rect>
    <rect x="250" y="203" width="12" height="30" fill="#111">
      <animate attributeName="x" values="250;270;250" dur="7s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- right block: the socket (google) -->
  <g stroke="#111" stroke-width="6" fill="#FFFDF5">
    <rect x="560" y="150" width="150" height="150" fill="#FFFDF5">
      <animate attributeName="x" values="560;540;560" dur="7s" repeatCount="indefinite"/>
    </rect>
    <circle cx="655" cy="225" r="34" fill="#FFFDF5">
      <animate attributeName="cx" values="655;635;655" dur="7s" repeatCount="indefinite"/>
    </circle>
    <rect x="643" y="216" width="24" height="18" fill="#111">
      <animate attributeName="x" values="643;623;643" dur="7s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- connecting bridge: URL path dashes -->
  <g stroke="#FF4D00" stroke-width="8" stroke-linecap="round">
    <line x1="255" y1="225" x2="545" y2="225" stroke-dasharray="24 22">
      <animate attributeName="stroke-dashoffset" values="0;-92" dur="6s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- checkmark badge that pops in -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.45;0.5;0.95;1" dur="10s" repeatCount="indefinite"/>
    <circle cx="400" cy="225" r="46" fill="#FF4D00" stroke="#111" stroke-width="6"/>
    <path d="M378 225 L395 242 L424 206" fill="none" stroke="#FFFDF5" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- slow orbiting spark -->
  <circle cx="400" cy="80" r="10" fill="#FF4D00" stroke="#111" stroke-width="5">
    <animateTransform attributeName="transform" type="rotate" from="0 400 225" to="360 400 225" dur="32s" repeatCount="indefinite"/>
  </circle>
</svg>
