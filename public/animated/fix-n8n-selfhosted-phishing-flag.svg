<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Animated abstract motif: a warning shield being released from quarantine">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#111111" stroke-width="1" opacity="0.12"/>
    </pattern>
    <filter id="hardshadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="6" dy="6" stdDeviation="0" flood-color="#111111" flood-opacity="1"/>
    </filter>
  </defs>

  <rect width="800" height="450" fill="#FFFDF5"/>
  <rect width="800" height="450" fill="url(#grid)"/>

  <!-- Quarantine chamber: rotating dashed ring (slow) -->
  <g transform="translate(400,225)">
    <circle r="150" fill="none" stroke="#111111" stroke-width="6" stroke-dasharray="28 16" opacity="0.85">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="40s" repeatCount="indefinite"/>
    </circle>
    <circle r="150" fill="none" stroke="#111111" stroke-width="6" stroke-dasharray="28 16" opacity="0.2">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="60s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Shield card: bobs gently (slow) -->
  <g filter="url(#hardshadow)">
    <g>
      <rect x="320" y="145" width="160" height="170" rx="10" fill="#FFFDF5" stroke="#111111" stroke-width="6"/>
      <!-- shield body -->
      <path d="M400 165 L455 185 V235 C455 275 430 300 400 310 C370 300 345 275 345 235 V185 Z"
            fill="#FF4D00" stroke="#111111" stroke-width="6" stroke-linejoin="round"/>
      <!-- checkmark -->
      <path d="M378 238 L396 256 L426 220" fill="none" stroke="#FFFDF5" stroke-width="10"
            stroke-linecap="round" stroke-linejoin="round"/>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -14; 0 0" keyTimes="0; 0.5; 1" dur="8s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- Warning triangles being pushed away (slow pulse + drift) -->
  <g opacity="0.9">
    <g transform="translate(180,225)">
      <polygon points="0,-34 30,26 -30,26" fill="#FFFDF5" stroke="#111111" stroke-width="5" stroke-linejoin="round"/>
      <rect x="-5" y="-12" width="10" height="22" fill="#FF4D00"/>
      <rect x="-5" y="14" width="10" height="10" fill="#111111"/>
      <animateTransform attributeName="transform" type="translate" values="180 225; 160 225; 180 225" keyTimes="0; 0.5; 1" dur="10s" repeatCount="indefinite" additive="replace"/>
      <animate attributeName="opacity" values="0.9; 0.35; 0.9" dur="10s" repeatCount="indefinite"/>
    </g>
    <g transform="translate(620,225)">
      <polygon points="0,-34 30,26 -30,26" fill="#FFFDF5" stroke="#111111" stroke-width="5" stroke-linejoin="round"/>
      <rect x="-5" y="-12" width="10" height="22" fill="#FF4D00"/>
      <rect x="-5" y="14" width="10" height="10" fill="#111111"/>
      <animateTransform attributeName="transform" type="translate" values="620 225; 640 225; 620 225" keyTimes="0; 0.5; 1" dur="12s" repeatCount="indefinite" additive="replace"/>
      <animate attributeName="opacity" values="0.9; 0.35; 0.9" dur="12s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- Scanning sweep bar over the chamber (slow) -->
  <rect x="170" y="215" width="460" height="8" fill="#FF4D00" opacity="0.55">
    <animate attributeName="y" values="95; 345; 95" keyTimes="0; 0.5; 1" dur="9s" repeatCount="indefinite"/>
  </rect>

  <!-- Corner stamps -->
  <g font-family="sans-serif" stroke="#111111">
    <rect x="36" y="36" width="120" height="44" fill="#FFFDF5" stroke-width="4"/>
    <rect x="36" y="36" width="120" height="44" fill="none" stroke="#111111" stroke-width="4"/>
    <rect x="644" y="370" width="120" height="44" fill="#FF4D00" stroke-width="4"/>
    <rect x="644" y="370" width="120" height="44" fill="none" stroke="#111111" stroke-width="4"/>
  </g>
</svg>
