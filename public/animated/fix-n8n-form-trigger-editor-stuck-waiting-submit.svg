<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Animated schematic: a form card sends a signal that stalls before reaching the editor window">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#111111" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- sheet -->
  <rect x="0" y="0" width="800" height="450" fill="#FFFDF5"/>
  <rect x="0" y="0" width="800" height="450" fill="url(#grid)"/>
  <rect x="14" y="14" width="772" height="422" fill="none" stroke="#111111" stroke-width="3"/>

  <!-- form card (left) -->
  <g>
    <rect x="70" y="150" width="190" height="150" fill="#FFFFFF" stroke="#111111" stroke-width="3"/>
    <rect x="78" y="158" width="190" height="150" fill="none" stroke="#111111" stroke-width="1" stroke-opacity="0.25"/>
    <rect x="90" y="172" width="150" height="14" fill="#111111"/>
    <rect x="90" y="200" width="150" height="10" fill="none" stroke="#111111" stroke-width="2"/>
    <rect x="90" y="222" width="150" height="10" fill="none" stroke="#111111" stroke-width="2"/>
    <rect x="90" y="244" width="150" height="10" fill="none" stroke="#111111" stroke-width="2"/>
    <rect x="90" y="268" width="70" height="18" fill="#FF4D00" stroke="#111111" stroke-width="2">
      <animate attributeName="opacity" values="1;0.55;1" dur="6s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- signal line: form -> editor, with a gap where the pulse stops -->
  <g stroke="#111111" stroke-width="3" fill="none">
    <path d="M 260 225 L 400 225" stroke-dasharray="10 8">
      <animate attributeName="stroke-dashoffset" values="0;-36" dur="6s" repeatCount="indefinite"/>
    </path>
    <path d="M 470 225 L 540 225" stroke-dasharray="10 8" stroke-opacity="0.35">
      <animate attributeName="stroke-dashoffset" values="0;-36" dur="6s" repeatCount="indefinite"/>
    </path>
  </g>
  <!-- the gap -->
  <g>
    <line x1="400" y1="205" x2="470" y2="245" stroke="#FF4D00" stroke-width="4"/>
    <line x1="470" y1="205" x2="400" y2="245" stroke="#FF4D00" stroke-width="4"/>
  </g>
  <!-- pulse dot travelling to the gap, then fading -->
  <circle cx="260" cy="225" r="9" fill="#FF4D00" stroke="#111111" stroke-width="2">
    <animate attributeName="cx" values="260;400;400;260" keyTimes="0;0.45;0.6;1" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;1;0.15;1" keyTimes="0;0.45;0.6;1" dur="8s" repeatCount="indefinite"/>
  </circle>

  <!-- editor window (right) -->
  <g>
    <rect x="540" y="130" width="190" height="190" fill="#FFFFFF" stroke="#111111" stroke-width="3"/>
    <rect x="540" y="130" width="190" height="28" fill="#111111"/>
    <circle cx="558" cy="144" r="5" fill="#FF4D00"/>
    <circle cx="576" cy="144" r="5" fill="#FFFDF5"/>
    <circle cx="594" cy="144" r="5" fill="#FFFDF5"/>
    <rect x="560" y="176" width="150" height="12" fill="#111111" opacity="0.85"/>
    <rect x="560" y="198" width="110" height="10" fill="none" stroke="#111111" stroke-width="2"/>
    <rect x="560" y="220" width="130" height="10" fill="none" stroke="#111111" stroke-width="2"/>
    <!-- waiting spinner -->
    <g transform="translate(635 275)">
      <circle cx="0" cy="0" r="16" fill="none" stroke="#111111" stroke-width="3" stroke-dasharray="70 30">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="30s" repeatCount="indefinite" additive="sum"/>
      </circle>
      <circle cx="0" cy="-16" r="5" fill="#FF4D00" stroke="#111111" stroke-width="2">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="30s" repeatCount="indefinite" additive="sum"/>
      </circle>
    </g>
  </g>

  <!-- slow drifting accent ring -->
  <circle cx="400" cy="80" r="26" fill="none" stroke="#FF4D00" stroke-width="3">
    <animate attributeName="r" values="22;30;22" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.9;0.4;0.9" dur="9s" repeatCount="indefinite"/>
  </circle>
</svg>
