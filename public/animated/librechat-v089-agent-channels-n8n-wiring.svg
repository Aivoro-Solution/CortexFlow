<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="Animated schematic: a chat message enters a gateway, passes an agent drum and an approval gate, and leaves as an action">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#111111" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="450" fill="#FFFDF5"/>
  <rect width="800" height="450" fill="url(#grid)"/>
  <rect x="10" y="10" width="780" height="430" fill="none" stroke="#111111" stroke-width="3"/>

  <!-- Title plate -->
  <rect x="30" y="26" width="330" height="34" fill="#FFFDF5" stroke="#111111" stroke-width="2.5"/>
  <rect x="30" y="26" width="330" height="34" fill="none" stroke="#111111" stroke-width="2.5"/>
  <circle cx="52" cy="43" r="8" fill="#FF4D00" stroke="#111111" stroke-width="2"/>
  <rect x="68" y="39" width="120" height="8" fill="#111111"/>
  <rect x="68" y="50" width="80" height="6" fill="#111111" opacity="0.45"/>

  <!-- Incoming chat bubble (slides in slowly) -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 60 0; 0 0" dur="12s" repeatCount="indefinite"/>
    <rect x="60" y="150" width="130" height="70" rx="10" fill="#FFFDF5" stroke="#111111" stroke-width="3"/>
    <rect x="76" y="168" width="98" height="8" fill="#111111"/>
    <rect x="76" y="184" width="70" height="8" fill="#111111" opacity="0.45"/>
    <rect x="76" y="200" width="84" height="8" fill="#111111" opacity="0.25"/>
    <path d="M 78 220 L 66 238 L 96 220 Z" fill="#FFFDF5" stroke="#111111" stroke-width="3"/>
  </g>

  <!-- Arrow 1: bubble to drum -->
  <g stroke="#111111" stroke-width="3" fill="none">
    <path d="M 196 185 L 258 185"/>
    <path d="M 250 177 L 262 185 L 250 193" fill="none"/>
    <animate attributeName="stroke-dashoffset" values="0;-24" dur="6s" repeatCount="indefinite"/>
  </g>

  <!-- Agent selector drum (rotates slowly) -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="0 320 185; 360 320 185" dur="36s" repeatCount="indefinite"/>
    <circle cx="320" cy="185" r="62" fill="#FFFDF5" stroke="#111111" stroke-width="3"/>
    <circle cx="320" cy="185" r="44" fill="none" stroke="#111111" stroke-width="2"/>
    <circle cx="320" cy="185" r="10" fill="#FF4D00" stroke="#111111" stroke-width="2.5"/>
    <g stroke="#111111" stroke-width="2.5">
      <line x1="320" y1="123" x2="320" y2="141"/>
      <line x1="320" y1="229" x2="320" y2="247"/>
      <line x1="258" y1="185" x2="276" y2="185"/>
      <line x1="364" y1="185" x2="382" y2="185"/>
    </g>
    <rect x="306" y="150" width="28" height="10" fill="#111111"/>
    <rect x="306" y="210" width="28" height="10" fill="#111111" opacity="0.4"/>
  </g>
  <rect x="288" y="262" width="64" height="20" fill="#FFFDF5" stroke="#111111" stroke-width="2"/>
  <rect x="296" y="269" width="48" height="6" fill="#111111"/>

  <!-- Arrow 2: drum to gate -->
  <g stroke="#111111" stroke-width="3" fill="none">
    <path d="M 386 185 L 448 185"/>
    <path d="M 440 177 L 452 185 L 440 193" fill="none"/>
  </g>

  <!-- Approval gate (lever swings slowly) -->
  <g>
    <rect x="452" y="120" width="110" height="130" fill="#FFFDF5" stroke="#111111" stroke-width="3"/>
    <rect x="452" y="120" width="110" height="130" fill="none" stroke="#111111" stroke-width="3"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-14 507 185; 14 507 185; -14 507 185" dur="9s" repeatCount="indefinite"/>
      <line x1="507" y1="185" x2="507" y2="132" stroke="#FF4D00" stroke-width="7" stroke-linecap="round"/>
      <circle cx="507" cy="185" r="12" fill="#FF4D00" stroke="#111111" stroke-width="2.5"/>
    </g>
    <circle cx="507" cy="185" r="5" fill="#111111"/>
    <rect x="468" y="222" width="78" height="8" fill="#111111"/>
    <rect x="468" y="234" width="52" height="6" fill="#111111" opacity="0.45"/>
  </g>

  <!-- Arrow 3: gate to action -->
  <g stroke="#111111" stroke-width="3" fill="none">
    <path d="M 566 185 L 628 185"/>
    <path d="M 620 177 L 632 185 L 620 193" fill="none"/>
  </g>

  <!-- Outgoing action card (pulses gently) -->
  <g>
    <animate attributeName="opacity" values="1;0.55;1" dur="8s" repeatCount="indefinite"/>
    <rect x="632" y="140" width="120" height="90" fill="#FF4D00" stroke="#111111" stroke-width="3"/>
    <rect x="632" y="140" width="120" height="90" fill="none" stroke="#111111" stroke-width="3"/>
    <path d="M 652 185 L 678 210 L 730 158" fill="none" stroke="#FFFDF5" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Ground line + drifting dots -->
  <line x1="40" y1="330" x2="760" y2="330" stroke="#111111" stroke-width="2.5"/>
  <circle cx="120" cy="360" r="6" fill="none" stroke="#111111" stroke-width="2">
    <animate attributeName="cy" values="360;348;360" dur="7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="400" cy="368" r="5" fill="#FF4D00">
    <animate attributeName="cy" values="368;356;368" dur="9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="680" cy="358" r="6" fill="none" stroke="#111111" stroke-width="2">
    <animate attributeName="cy" values="358;346;358" dur="8s" repeatCount="indefinite"/>
  </circle>
  <rect x="40" y="392" width="180" height="8" fill="#111111"/>
  <rect x="40" y="406" width="120" height="6" fill="#111111" opacity="0.45"/>
</svg>
