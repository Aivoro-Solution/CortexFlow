<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <rect x="0" y="0" width="800" height="450" fill="#FFFDF5"/>
  <g stroke="#111111" stroke-width="1" opacity="0.22">
    <line x1="0" y1="75" x2="800" y2="75"/>
    <line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="225" x2="800" y2="225"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="375" x2="800" y2="375"/>
    <line x1="133" y1="0" x2="133" y2="450"/>
    <line x1="266" y1="0" x2="266" y2="450"/>
    <line x1="400" y1="0" x2="400" y2="450"/>
    <line x1="533" y1="0" x2="533" y2="450"/>
    <line x1="666" y1="0" x2="666" y2="450"/>
  </g>

  <!-- chat messages stack (left) : slow vertical bob -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -10;0 0" dur="8s" repeatCount="indefinite"/>
    <rect x="70" y="120" width="200" height="52" rx="10" fill="#FFFDF5" stroke="#111111" stroke-width="5"/>
    <line x1="95" y1="140" x2="225" y2="140" stroke="#111111" stroke-width="5"/>
    <line x1="95" y1="154" x2="195" y2="154" stroke="#111111" stroke-width="5"/>
    <rect x="100" y="196" width="170" height="52" rx="10" fill="#111111"/>
    <line x1="125" y1="216" x2="225" y2="216" stroke="#FFFDF5" stroke-width="5"/>
    <line x1="125" y1="230" x2="200" y2="230" stroke="#FFFDF5" stroke-width="5"/>
    <rect x="70" y="272" width="200" height="52" rx="10" fill="#FFFDF5" stroke="#111111" stroke-width="5"/>
    <line x1="95" y1="292" x2="225" y2="292" stroke="#111111" stroke-width="5"/>
    <line x1="95" y1="306" x2="180" y2="306" stroke="#111111" stroke-width="5"/>
  </g>

  <!-- session wire : messages travel along it to the database -->
  <path id="wire" d="M 300 225 L 470 225 L 470 150 L 560 150" fill="none" stroke="#111111" stroke-width="5" stroke-dasharray="14 10"/>
  <circle r="12" fill="#FF4D00" stroke="#111111" stroke-width="4">
    <animateMotion dur="10s" repeatCount="indefinite">
      <mpath href="#wire"/>
    </animateMotion>
  </circle>
  <circle r="12" fill="#FF4D00" stroke="#111111" stroke-width="4" opacity="0.85">
    <animateMotion dur="10s" begin="5s" repeatCount="indefinite">
      <mpath href="#wire"/>
    </animateMotion>
  </circle>

  <!-- database cylinder (right) : slow breathing scale -->
  <g transform="translate(630,150)">
    <g>
      <animateTransform attributeName="transform" type="scale" values="1;1.06;1" dur="7s" repeatCount="indefinite"/>
      <ellipse cx="0" cy="-70" rx="70" ry="20" fill="#FFFDF5" stroke="#111111" stroke-width="6"/>
      <path d="M -70 -70 L -70 70 A 70 20 0 0 0 70 70 L 70 -70" fill="#FFFDF5" stroke="#111111" stroke-width="6"/>
      <ellipse cx="0" cy="-70" rx="70" ry="20" fill="none" stroke="#111111" stroke-width="6"/>
      <line x1="-70" y1="-20" x2="70" y2="-20" stroke="#111111" stroke-width="4"/>
      <line x1="-70" y1="20" x2="70" y2="20" stroke="#111111" stroke-width="4"/>
      <!-- orange pulse rings on write -->
      <ellipse cx="0" cy="-70" rx="70" ry="20" fill="none" stroke="#FF4D00" stroke-width="5" opacity="0">
        <animate attributeName="opacity" values="0;0.9;0" dur="6s" repeatCount="indefinite"/>
        <animate attributeName="rx" values="70;110;110" dur="6s" repeatCount="indefinite"/>
        <animate attributeName="ry" values="20;32;32" dur="6s" repeatCount="indefinite"/>
      </ellipse>
    </g>
  </g>
  <line x1="630" y1="240" x2="630" y2="380" stroke="#111111" stroke-width="6"/>

  <!-- summarizer loop : slow rotating dashed ring under the database -->
  <g transform="translate(630,330)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="30s" repeatCount="indefinite"/>
      <circle r="52" fill="none" stroke="#111111" stroke-width="4" stroke-dasharray="20 14"/>
    </g>
    <circle r="14" fill="#FF4D00" stroke="#111111" stroke-width="4">
      <animate attributeName="opacity" values="1;0.35;1" dur="6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- label-free caption plate (decorative, no words) -->
  <rect x="560" y="404" width="140" height="16" fill="#111111"/>
  <rect x="100" y="404" width="170" height="16" fill="none" stroke="#111111" stroke-width="4"/>
</svg>
