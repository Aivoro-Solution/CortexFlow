<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Abstract animated diagram of a governed data lake: concentric access rings around a lake, with an orange gate that admits one agent at a time">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#111111" stroke-width="0.75" opacity="0.12"/>
    </pattern>
    <radialGradient id="gateGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF4D00" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#FF4D00" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="800" height="450" fill="#FFFDF5"/>
  <rect x="0" y="0" width="800" height="450" fill="url(#grid)"/>
  <rect x="14" y="14" width="772" height="422" fill="none" stroke="#111111" stroke-width="3"/>

  <!-- The lake: layered data reservoir -->
  <g opacity="0.95">
    <ellipse cx="400" cy="252" rx="250" ry="118" fill="#FFFFFF" stroke="#111111" stroke-width="4"/>
    <ellipse cx="400" cy="238" rx="205" ry="94" fill="#FFFDF5" stroke="#111111" stroke-width="3"/>
    <ellipse cx="400" cy="224" rx="158" ry="70" fill="#EFEFEA" stroke="#111111" stroke-width="2.5"/>
  </g>

  <!-- Data wave lines inside the lake -->
  <g stroke="#111111" stroke-width="2" fill="none" opacity="0.85">
    <path d="M 285 250 q 20 -12 40 0 t 40 0 t 40 0 t 40 0 t 40 0 t 40 0">
      <animate attributeName="d" dur="9s" repeatCount="indefinite"
        values="M 285 250 q 20 -12 40 0 t 40 0 t 40 0 t 40 0 t 40 0 t 40 0;
                M 285 250 q 20 12 40 0 t 40 0 t 40 0 t 40 0 t 40 0 t 40 0;
                M 285 250 q 20 -12 40 0 t 40 0 t 40 0 t 40 0 t 40 0 t 40 0"/>
    </path>
    <path d="M 300 285 q 20 -10 40 0 t 40 0 t 40 0 t 40 0 t 40 0">
      <animate attributeName="d" dur="12s" repeatCount="indefinite"
        values="M 300 285 q 20 -10 40 0 t 40 0 t 40 0 t 40 0 t 40 0;
                M 300 285 q 20 10 40 0 t 40 0 t 40 0 t 40 0 t 40 0;
                M 300 285 q 20 -10 40 0 t 40 0 t 40 0 t 40 0 t 40 0"/>
    </path>
  </g>

  <!-- Governance rings: slow expanding pulse from lake edge -->
  <ellipse cx="400" cy="252" rx="250" ry="118" fill="none" stroke="#FF4D00" stroke-width="2.5" opacity="0">
    <animate attributeName="rx" values="250;320;250" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="ry" values="118;150;118" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.6;0" dur="10s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="400" cy="252" rx="250" ry="118" fill="none" stroke="#111111" stroke-width="1.5" stroke-dasharray="10 8" opacity="0.5">
    <animateTransform attributeName="transform" type="rotate" from="0 400 252" to="360 400 252" dur="45s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Access gate: orange portcullis at the lake's edge -->
  <g>
    <circle cx="400" cy="92" r="58" fill="url(#gateGlow)">
      <animate attributeName="r" values="58;74;58" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.85;1;0.85" dur="8s" repeatCount="indefinite"/>
    </circle>
    <rect x="368" y="58" width="64" height="80" rx="6" fill="#FFFDF5" stroke="#111111" stroke-width="4"/>
    <circle cx="400" cy="92" r="16" fill="#FF4D00" stroke="#111111" stroke-width="3.5">
      <animate attributeName="r" values="16;19;16" dur="6s" repeatCount="indefinite"/>
    </circle>
    <rect x="395.5" y="104" width="9" height="22" fill="#111111"/>
  </g>

  <!-- Agent 1: admitted through the gate, drifts down toward the lake -->
  <g>
    <rect x="384" y="120" width="32" height="32" rx="8" fill="#FF4D00" stroke="#111111" stroke-width="3.5">
      <animate attributeName="y" values="120;196;120" dur="14s" repeatCount="indefinite"/>
    </rect>
    <line x1="400" y1="152" x2="400" y2="228" stroke="#FF4D00" stroke-width="3" stroke-dasharray="6 6" opacity="0.7">
      <animate attributeName="y1" values="152;228;152" dur="14s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- Agent 2: bounces off the outer ring, held back -->
  <g>
    <rect x="120" y="150" width="32" height="32" rx="8" fill="#FFFFFF" stroke="#111111" stroke-width="3.5">
      <animate attributeName="x" values="120;170;120" dur="11s" repeatCount="indefinite"/>
    </rect>
    <line x1="152" y1="166" x2="150" y2="222" stroke="#111111" stroke-width="2.5" opacity="0.6">
      <animate attributeName="x1" values="152;202;152" dur="11s" repeatCount="indefinite"/>
    </line>
    <path d="M 186 222 l 12 -8 m -12 8 l 12 8" fill="none" stroke="#111111" stroke-width="2.5">
      <animate attributeName="transform" type="translate" values="0 0;50 0;0 0" dur="11s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Agent 3: slow drift along the ring, never admitted -->
  <g>
    <rect x="0" y="0" width="28" height="28" rx="7" fill="#FFFFFF" stroke="#111111" stroke-width="3">
      <animateMotion dur="20s" repeatCount="indefinite"
        path="M 620 180 A 120 90 0 1 1 620 360 A 120 90 0 1 1 620 180"/>
    </rect>
  </g>

  <!-- Small floating context tokens feeding the lake -->
  <g fill="#FF4D00" stroke="#111111" stroke-width="1.5">
    <circle cx="250" cy="120" r="7">
      <animate attributeName="cy" values="120;140;120" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.5;1" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="560" cy="110" r="6">
      <animate attributeName="cy" values="110;132;110" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;1;0.6" dur="9s" repeatCount="indefinite"/>
    </circle>
    <rect x="640" y="250" width="12" height="12" transform="rotate(20 646 256)">
      <animateTransform attributeName="transform" type="rotate" from="20 646 256" to="380 646 256" dur="30s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
