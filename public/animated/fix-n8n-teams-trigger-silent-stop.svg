<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Abstract animation of an expiring webhook subscription">
  <!-- cream drawing sheet -->
  <rect x="0" y="0" width="800" height="450" fill="#FFFDF5"/>
  <!-- fine grid -->
  <g stroke="#111111" stroke-width="0.6" opacity="0.14">
    <path d="M40 0v450M80 0v450M120 0v450M160 0v450M200 0v450M240 0v450M280 0v450M320 0v450M360 0v450M400 0v450M440 0v450M480 0v450M520 0v450M560 0v450M600 0v450M640 0v450M680 0v450M720 0v450M760 0v450"/>
    <path d="M0 40h800M0 80h800M0 120h800M0 160h800M0 200h800M0 240h800M0 280h800M0 320h800M0 360h800M0 400h800"/>
  </g>

  <!-- border frame -->
  <rect x="14" y="14" width="772" height="422" fill="none" stroke="#111111" stroke-width="3"/>

  <!-- big expiring timer ring (left) -->
  <g transform="translate(220,225)">
    <circle cx="0" cy="0" r="110" fill="none" stroke="#111111" stroke-width="10"/>
    <!-- remaining-time arc in signal orange, drains then refills -->
    <circle cx="0" cy="0" r="110" fill="none" stroke="#FF4D00" stroke-width="10"
            stroke-linecap="round" stroke-dasharray="691.2" stroke-dashoffset="0">
      <animate attributeName="stroke-dashoffset" values="0;691.2;0" dur="48s" repeatCount="indefinite"/>
    </circle>
    <!-- clock hand, slow sweep -->
    <line x1="0" y1="0" x2="0" y2="-80" stroke="#111111" stroke-width="8" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="60s" repeatCount="indefinite"/>
    </line>
    <circle cx="0" cy="0" r="10" fill="#111111"/>
    <!-- small second hand, slower accent -->
    <line x1="0" y1="0" x2="52" y2="0" stroke="#FF4D00" stroke-width="6" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="90s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- socket (right side) -->
  <g transform="translate(560,225)">
    <rect x="-70" y="-60" width="140" height="120" fill="#FFFDF5" stroke="#111111" stroke-width="8"/>
    <circle cx="-28" cy="0" r="12" fill="#111111"/>
    <circle cx="28" cy="0" r="12" fill="#111111"/>
  </g>

  <!-- webhook plug: drifts away from socket and back, with prongs -->
  <g>
    <g transform="translate(560,225)">
      <g>
        <animateTransform attributeName="transform" type="translate"
          values="0 0; -160 0; -160 0; 0 0; 0 0" keyTimes="0; 0.25; 0.5; 0.75; 1" dur="32s" repeatCount="indefinite"/>
        <rect x="-180" y="-44" width="120" height="88" rx="10" fill="#FFFDF5" stroke="#111111" stroke-width="8"/>
        <rect x="-60" y="-28" width="44" height="12" fill="#111111"/>
        <rect x="-60" y="16" width="44" height="12" fill="#111111"/>
        <rect x="-180" y="-20" width="52" height="40" fill="#FF4D00" stroke="#111111" stroke-width="6"/>
      </g>
    </g>
  </g>

  <!-- drifting message bubbles -->
  <g opacity="0.85">
    <rect x="120" y="330" width="120" height="64" rx="14" fill="#FFFDF5" stroke="#111111" stroke-width="6">
      <animate attributeName="y" values="330;250;330" dur="24s" repeatCount="indefinite"/>
    </rect>
    <rect x="560" y="330" width="120" height="64" rx="14" fill="#FFFDF5" stroke="#111111" stroke-width="6">
      <animate attributeName="y" values="330;260;330" dur="30s" repeatCount="indefinite"/>
    </rect>
    <rect x="340" y="360" width="120" height="64" rx="14" fill="#FFFDF5" stroke="#FF4D00" stroke-width="6">
      <animate attributeName="y" values="360;300;360" dur="36s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- pulsing notification dot on timer -->
  <circle cx="330" cy="115" r="12" fill="#FF4D00" stroke="#111111" stroke-width="4">
    <animate attributeName="opacity" values="1;0.25;1" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="r" values="12;18;12" dur="6s" repeatCount="indefinite"/>
  </circle>
</svg>
