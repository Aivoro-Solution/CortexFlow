<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <rect width="800" height="450" fill="#FFFDF5"/>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#111" stroke-width="0.5" opacity="0.12"/>
    </pattern>
  </defs>
  <rect width="800" height="450" fill="url(#grid)"/>
  <!-- retiring model card (fading) -->
  <g>
    <rect x="90" y="150" width="220" height="150" fill="#FFFDF5" stroke="#111" stroke-width="5"/>
    <circle cx="200" cy="205" r="26" fill="none" stroke="#111" stroke-width="5"/>
    <rect x="130" y="255" width="140" height="10" fill="#111"/>
    <rect x="150" y="275" width="100" height="10" fill="#111" opacity="0.5"/>
    <animate attributeName="opacity" values="1;0.35;1" dur="8s" repeatCount="indefinite"/>
  </g>
  <!-- arrow -->
  <g stroke="#FF4D00" stroke-width="8" fill="none">
    <path d="M340 225 H460"/>
    <path d="M435 200 L465 225 L435 250"/>
    <animateTransform attributeName="transform" type="translate" values="0 0;14 0;0 0" dur="6s" repeatCount="indefinite"/>
  </g>
  <!-- replacement card -->
  <g>
    <rect x="500" y="150" width="220" height="150" fill="#FF4D00" stroke="#111" stroke-width="5"/>
    <circle cx="610" cy="205" r="26" fill="#FFFDF5" stroke="#111" stroke-width="5"/>
    <rect x="540" y="255" width="140" height="10" fill="#FFFDF5"/>
    <rect x="560" y="275" width="100" height="10" fill="#FFFDF5" opacity="0.7"/>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" dur="7s" repeatCount="indefinite"/>
  </g>
  <!-- calendar ticks -->
  <g fill="#111">
    <circle cx="200" cy="360" r="6"/><circle cx="240" cy="360" r="6"/><circle cx="280" cy="360" r="6"/>
    <circle cx="320" cy="360" r="6" fill="#FF4D00">
      <animate attributeName="r" values="6;10;6" dur="6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
