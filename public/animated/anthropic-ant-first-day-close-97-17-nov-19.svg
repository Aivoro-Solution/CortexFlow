<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Abstract ticker tape with a price line that rises steeply then fades">
  <rect width="800" height="450" fill="#FFFDF5"/>
  <g stroke="#111111" stroke-width="0.6" opacity="0.12">
    <path d="M0 45H800M0 90H800M0 135H800M0 180H800M0 225H800M0 270H800M0 315H800M0 360H800M0 405H800"/>
    <path d="M80 0V450M160 0V450M240 0V450M320 0V450M400 0V450M480 0V450M560 0V450M640 0V450M720 0V450"/>
  </g>
  <rect x="14" y="14" width="772" height="422" fill="none" stroke="#111111" stroke-width="3"/>
  <!-- ticker tape strip -->
  <g>
    <rect x="60" y="180" width="680" height="90" fill="#FAFAF7" stroke="#111111" stroke-width="2.5"/>
    <animate attributeName="x" values="60;76;60" dur="12s" repeatCount="indefinite"/>
    <g stroke="#111111" stroke-width="1" opacity="0.35">
      <path d="M76 190H724M76 260H724"/>
    </g>
    <!-- perforation dots along tape edges -->
    <g fill="#111111" opacity="0.5">
      <circle cx="90" cy="188" r="2.5"/><circle cx="130" cy="188" r="2.5"/><circle cx="170" cy="188" r="2.5"/><circle cx="210" cy="188" r="2.5"/><circle cx="250" cy="188" r="2.5"/><circle cx="290" cy="188" r="2.5"/><circle cx="330" cy="188" r="2.5"/><circle cx="370" cy="188" r="2.5"/><circle cx="410" cy="188" r="2.5"/><circle cx="450" cy="188" r="2.5"/><circle cx="490" cy="188" r="2.5"/><circle cx="530" cy="188" r="2.5"/><circle cx="570" cy="188" r="2.5"/><circle cx="610" cy="188" r="2.5"/><circle cx="650" cy="188" r="2.5"/><circle cx="690" cy="188" r="2.5"/>
      <circle cx="90" cy="262" r="2.5"/><circle cx="130" cy="262" r="2.5"/><circle cx="170" cy="262" r="2.5"/><circle cx="210" cy="262" r="2.5"/><circle cx="250" cy="262" r="2.5"/><circle cx="290" cy="262" r="2.5"/><circle cx="330" cy="262" r="2.5"/><circle cx="370" cy="262" r="2.5"/><circle cx="410" cy="262" r="2.5"/><circle cx="450" cy="262" r="2.5"/><circle cx="490" cy="262" r="2.5"/><circle cx="530" cy="262" r="2.5"/><circle cx="570" cy="262" r="2.5"/><circle cx="610" cy="262" r="2.5"/><circle cx="650" cy="262" r="2.5"/><circle cx="690" cy="262" r="2.5"/>
    </g>
  </g>
  <!-- price line: steep rise then long fade -->
  <polyline points="80,250 180,250 260,150 340,140 420,170 520,205 620,225 720,235" fill="none" stroke="#FF4D00" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
    <animate attributeName="stroke-dasharray" values="0 900;900 0" dur="9s" repeatCount="indefinite"/>
  </polyline>
  <g fill="#FF4D00">
    <circle cx="260" cy="150" r="6">
      <animate attributeName="r" values="6;8;6" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="720" cy="235" r="6">
      <animate attributeName="r" values="6;8;6" dur="6s" begin="3s" repeatCount="indefinite"/>
    </circle>
  </g>
  <circle cx="80" cy="250" r="5" fill="#111111"/>
  <!-- candlestick-like bars drifting slowly -->
  <g stroke="#111111" stroke-width="2" fill="#FAFAF7">
    <g>
      <rect x="150" y="320" width="26" height="52"/>
      <line x1="163" y1="308" x2="163" y2="384"/>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" dur="10s" repeatCount="indefinite"/>
    </g>
    <g>
      <rect x="300" y="300" width="26" height="72" fill="#FF4D00" stroke="#111111"/>
      <line x1="313" y1="288" x2="313" y2="384"/>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" dur="10s" begin="2s" repeatCount="indefinite"/>
    </g>
    <g>
      <rect x="450" y="330" width="26" height="42"/>
      <line x1="463" y1="318" x2="463" y2="384"/>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" dur="10s" begin="4s" repeatCount="indefinite"/>
    </g>
    <g>
      <rect x="600" y="315" width="26" height="57"/>
      <line x1="613" y1="303" x2="613" y2="384"/>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" dur="10s" begin="6s" repeatCount="indefinite"/>
    </g>
  </g>
  <!-- slow rotating gauge dial -->
  <g transform="translate(680 90)">
    <circle r="46" fill="#FAFAF7" stroke="#111111" stroke-width="2.5"/>
    <g stroke="#111111" stroke-width="1.5">
      <line x1="0" y1="-40" x2="0" y2="-30"/><line x1="28" y1="-28" x2="22" y2="-21"/><line x1="40" y1="0" x2="30" y2="0"/><line x1="28" y1="28" x2="22" y2="21"/><line x1="0" y1="40" x2="0" y2="30"/><line x1="-28" y1="28" x2="-21" y2="21"/><line x1="-40" y1="0" x2="-30" y2="0"/><line x1="-28" y1="-28" x2="-21" y2="-21"/>
    </g>
    <g>
      <line x1="0" y1="0" x2="0" y2="-34" stroke="#FF4D00" stroke-width="3.5" stroke-linecap="round"/>
      <animateTransform attributeName="transform" type="rotate" from="-50" to="50" dur="30s" repeatCount="indefinite"/>
    </g>
    <circle r="5" fill="#111111"/>
  </g>
  <!-- slow drifting tape reels -->
  <g>
    <circle cx="110" cy="90" r="34" fill="#FAFAF7" stroke="#111111" stroke-width="2.5"/>
    <circle cx="110" cy="90" r="10" fill="none" stroke="#111111" stroke-width="2"/>
    <g stroke="#111111" stroke-width="2">
      <line x1="110" y1="66" x2="110" y2="80"/><line x1="134" y1="90" x2="120" y2="90"/><line x1="110" y1="114" x2="110" y2="100"/><line x1="86" y1="90" x2="100" y2="90"/>
    </g>
    <animateTransform attributeName="transform" type="rotate" from="0 110 90" to="360 110 90" dur="40s" repeatCount="indefinite"/>
  </g>
</svg>
