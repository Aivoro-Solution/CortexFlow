<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Animated schematic: a code node feeds a downstream node through a pipeline; a hollow null circle at the break fills orange as the link is repaired">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#111111" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- sheet -->
  <rect x="0" y="0" width="800" height="450" fill="#FFFDF5"/>
  <rect x="0" y="0" width="800" height="450" fill="url(#grid)"/>
  <rect x="14" y="14" width="772" height="422" fill="none" stroke="#111111" stroke-width="3"/>

  <!-- upstream: code node -->
  <g>
    <rect x="90" y="150" width="170" height="150" fill="#FFFFFF" stroke="#111111" stroke-width="4"/>
    <rect x="98" y="158" width="170" height="150" fill="none" stroke="#111111" stroke-width="2" stroke-opacity="0.25"/>
    <line x1="118" y1="200" x2="232" y2="200" stroke="#111111" stroke-width="6" stroke-linecap="round"/>
    <line x1="118" y1="228" x2="200" y2="228" stroke="#111111" stroke-width="6" stroke-linecap="round"/>
    <line x1="118" y1="256" x2="216" y2="256" stroke="#111111" stroke-width="6" stroke-linecap="round"/>
    <circle cx="232" cy="200" r="7" fill="#FF4D00">
      <animate attributeName="r" values="7;10;7" dur="6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- pipeline: upstream to break -->
  <line x1="260" y1="225" x2="380" y2="225" stroke="#111111" stroke-width="6" stroke-linecap="round"/>
  <!-- pipeline: break to downstream -->
  <line x1="430" y1="225" x2="540" y2="225" stroke="#111111" stroke-width="6" stroke-linecap="round" stroke-dasharray="2 14"/>

  <!-- travelling pulse along the pipeline -->
  <circle cx="260" cy="225" r="9" fill="#FF4D00">
    <animate attributeName="cx" values="260;380;380;260" keyTimes="0;0.45;0.55;1" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.45;0.55;1" dur="10s" repeatCount="indefinite"/>
  </circle>
  <circle cx="430" cy="225" r="9" fill="#FF4D00" opacity="0">
    <animate attributeName="cx" values="430;540" dur="8s" begin="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="8s" begin="5s" repeatCount="indefinite"/>
  </circle>

  <!-- the null: hollow circle at the break -->
  <g>
    <circle cx="405" cy="225" r="26" fill="#FFFDF5" stroke="#111111" stroke-width="5"/>
    <circle cx="405" cy="225" r="26" fill="#FF4D00" opacity="0">
      <animate attributeName="opacity" values="0;0;0.9;0.9;0" keyTimes="0;0.5;0.6;0.9;1" dur="12s" repeatCount="indefinite"/>
    </circle>
    <circle cx="405" cy="225" r="26" fill="none" stroke="#111111" stroke-width="5">
      <animate attributeName="r" values="26;31;26" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="405" cy="225" r="6" fill="#111111">
      <animate attributeName="opacity" values="1;0.25;1" dur="6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- downstream node -->
  <g>
    <rect x="540" y="150" width="170" height="150" fill="#FFFFFF" stroke="#111111" stroke-width="4"/>
    <rect x="548" y="158" width="170" height="150" fill="none" stroke="#111111" stroke-width="2" stroke-opacity="0.25"/>
    <rect x="578" y="190" width="94" height="70" fill="none" stroke="#111111" stroke-width="4"/>
    <line x1="578" y1="213" x2="672" y2="213" stroke="#111111" stroke-width="3"/>
    <line x1="578" y1="236" x2="672" y2="236" stroke="#111111" stroke-width="3"/>
    <rect x="596" y="200" width="14" height="13" fill="#FF4D00">
      <animate attributeName="opacity" values="1;0.2;1" dur="7s" repeatCount="indefinite"/>
    </rect>
    <rect x="622" y="223" width="14" height="13" fill="#FF4D00">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="7s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- slow rotating gear: the runner -->
  <g transform="translate(660 90)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="40s" repeatCount="indefinite"/>
      <circle r="26" fill="none" stroke="#111111" stroke-width="5"/>
      <circle r="10" fill="#FF4D00"/>
      <g stroke="#111111" stroke-width="6" stroke-linecap="round">
        <line x1="0" y1="-34" x2="0" y2="-22"/>
        <line x1="0" y1="22" x2="0" y2="34"/>
        <line x1="-34" y1="0" x2="-22" y2="0"/>
        <line x1="22" y1="0" x2="34" y2="0"/>
        <line x1="-24" y1="-24" x2="-16" y2="-16"/>
        <line x1="16" y1="16" x2="24" y2="24"/>
        <line x1="24" y1="-24" x2="16" y2="-16"/>
        <line x1="-16" y1="16" x2="-24" y2="24"/>
      </g>
    </g>
  </g>

  <!-- slow drifting dashed repair arc above the break -->
  <path d="M 350 150 Q 405 95 460 150" fill="none" stroke="#FF4D00" stroke-width="4" stroke-dasharray="10 12">
    <animate attributeName="stroke-dashoffset" values="0;-44" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.35;0.9;0.35" dur="8s" repeatCount="indefinite"/>
  </path>

  <!-- corner ticks -->
  <g stroke="#111111" stroke-width="3" stroke-linecap="round">
    <line x1="30" y1="30" x2="52" y2="30"/>
    <line x1="30" y1="30" x2="30" y2="52"/>
    <line x1="770" y1="30" x2="748" y2="30"/>
    <line x1="770" y1="30" x2="770" y2="52"/>
    <line x1="30" y1="420" x2="52" y2="420"/>
    <line x1="30" y1="420" x2="30" y2="398"/>
    <line x1="770" y1="420" x2="748" y2="420"/>
    <line x1="770" y1="420" x2="770" y2="398"/>
  </g>
</svg>
