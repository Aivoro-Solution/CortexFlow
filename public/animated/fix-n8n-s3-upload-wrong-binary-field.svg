<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Abstract animated diagram of files being sorted into storage buckets">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#111111" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- cream sheet -->
  <rect x="0" y="0" width="800" height="450" fill="#FFFDF5"/>
  <rect x="0" y="0" width="800" height="450" fill="url(#grid)"/>

  <!-- border frame -->
  <rect x="14" y="14" width="772" height="422" fill="none" stroke="#111111" stroke-width="3"/>

  <!-- conveyor line -->
  <line x1="60" y1="120" x2="740" y2="120" stroke="#111111" stroke-width="3"/>
  <line x1="60" y1="120" x2="740" y2="120" stroke="#FF4D00" stroke-width="3" stroke-dasharray="14 22">
    <animate attributeName="stroke-dashoffset" from="0" to="-288" dur="12s" repeatCount="indefinite"/>
  </line>

  <!-- file parcels travelling along the line -->
  <g>
    <rect x="-30" y="92" width="56" height="56" fill="#FFFDF5" stroke="#111111" stroke-width="3"/>
    <rect x="-20" y="102" width="36" height="6" fill="#111111"/>
    <rect x="-20" y="116" width="24" height="6" fill="#FF4D00"/>
    <animateTransform attributeName="transform" type="translate" from="0 0" to="800 0" dur="24s" repeatCount="indefinite"/>
  </g>
  <g>
    <rect x="-30" y="92" width="56" height="56" fill="#FFFDF5" stroke="#111111" stroke-width="3"/>
    <rect x="-20" y="102" width="36" height="6" fill="#111111"/>
    <rect x="-20" y="116" width="24" height="6" fill="#FF4D00"/>
    <animateTransform attributeName="transform" type="translate" from="-400 0" to="400 0" dur="24s" repeatCount="indefinite"/>
  </g>

  <!-- storage buckets -->
  <g stroke="#111111" stroke-width="3" fill="#FFFDF5">
    <path d="M 150 240 L 170 380 L 290 380 L 310 240 Z"/>
    <path d="M 340 240 L 360 380 L 480 380 L 500 240 Z" fill="#FF4D00" fill-opacity="0.14"/>
    <path d="M 530 240 L 550 380 L 670 380 L 690 240 Z"/>
  </g>
  <!-- bucket rims -->
  <g stroke="#111111" stroke-width="3" fill="none">
    <line x1="150" y1="240" x2="310" y2="240"/>
    <line x1="340" y1="240" x2="500" y2="240"/>
    <line x1="530" y1="240" x2="690" y2="240"/>
  </g>

  <!-- parcel dropping into the middle (orange) bucket -->
  <g>
    <rect x="402" y="150" width="36" height="36" fill="#FFFDF5" stroke="#111111" stroke-width="3"/>
    <rect x="410" y="160" width="20" height="5" fill="#FF4D00"/>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 130; 0 130; 0 0" keyTimes="0; 0.4; 0.7; 1" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1; 1; 0; 0; 1" keyTimes="0; 0.4; 0.7; 0.75; 1" dur="12s" repeatCount="indefinite"/>
  </g>

  <!-- wrong-slot warning: small parcel drifting toward the wrong bucket, then sliding back -->
  <g>
    <rect x="590" y="150" width="36" height="36" fill="#FFFDF5" stroke="#FF4D00" stroke-width="3"/>
    <rect x="598" y="160" width="20" height="5" fill="#111111"/>
    <animateTransform attributeName="transform" type="translate" values="0 0; -150 0; -150 0; 0 0" keyTimes="0; 0.35; 0.65; 1" dur="18s" repeatCount="indefinite"/>
  </g>

  <!-- slow rotating gear / sorting dial -->
  <g transform="translate(700 80)">
    <circle r="34" fill="#FFFDF5" stroke="#111111" stroke-width="3"/>
    <g stroke="#111111" stroke-width="3">
      <line x1="0" y1="-34" x2="0" y2="-46"/>
      <line x1="0" y1="34" x2="0" y2="46"/>
      <line x1="-34" y1="0" x2="-46" y2="0"/>
      <line x1="34" y1="0" x2="46" y2="0"/>
    </g>
    <circle r="10" fill="#FF4D00" stroke="#111111" stroke-width="3"/>
    <animateTransform attributeName="transform" type="rotate" from="0 700 80" to="360 700 80" dur="60s" repeatCount="indefinite"/>
  </g>

  <!-- rising bubbles in the orange bucket -->
  <g fill="#FF4D00">
    <circle cx="400" cy="360" r="6">
      <animate attributeName="cy" values="360; 270; 270" keyTimes="0; 0.6; 1" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9; 0.9; 0" keyTimes="0; 0.6; 1" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="440" cy="360" r="4">
      <animate attributeName="cy" values="360; 280; 280" keyTimes="0; 0.6; 1" dur="11s" begin="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9; 0.9; 0" keyTimes="0; 0.6; 1" dur="11s" begin="2s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
