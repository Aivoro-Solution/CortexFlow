<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Animated schematic: a shopping cart rolls toward a vault dial while an approval checkmark lever slowly rises">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#111111" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- cream sheet + fine grid -->
  <rect width="800" height="450" fill="#FFFDF5"/>
  <rect width="800" height="450" fill="url(#grid)"/>
  <rect x="10" y="10" width="780" height="430" fill="none" stroke="#111111" stroke-width="3"/>

  <!-- ground rail -->
  <line x1="60" y1="360" x2="740" y2="360" stroke="#111111" stroke-width="3"/>
  <line x1="60" y1="372" x2="740" y2="372" stroke="#111111" stroke-width="1.5"/>

  <!-- shopping cart (slides slowly left-right along the rail) -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 46 0; 0 0" dur="18s" repeatCount="indefinite"/>
    <!-- cart basket -->
    <path d="M 120 190 L 300 190 L 280 320 L 150 320 Z" fill="none" stroke="#111111" stroke-width="5" stroke-linejoin="round"/>
    <line x1="140" y1="230" x2="292" y2="230" stroke="#111111" stroke-width="3"/>
    <line x1="148" y1="272" x2="286" y2="272" stroke="#111111" stroke-width="3"/>
    <line x1="180" y1="190" x2="190" y2="320" stroke="#111111" stroke-width="3"/>
    <line x1="240" y1="190" x2="232" y2="320" stroke="#111111" stroke-width="3"/>
    <!-- handle -->
    <line x1="120" y1="190" x2="92" y2="150" stroke="#111111" stroke-width="5" stroke-linecap="round"/>
    <line x1="92" y1="150" x2="66" y2="150" stroke="#111111" stroke-width="5" stroke-linecap="round"/>
    <!-- wheels -->
    <circle cx="168" cy="348" r="16" fill="#FFFDF5" stroke="#111111" stroke-width="4"/>
    <circle cx="262" cy="348" r="16" fill="#FFFDF5" stroke="#111111" stroke-width="4"/>
    <!-- goods in the cart (bobbing) -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -6; 0 0" dur="9s" repeatCount="indefinite"/>
      <rect x="168" y="150" width="34" height="40" fill="none" stroke="#111111" stroke-width="3.5"/>
      <rect x="216" y="138" width="30" height="52" fill="#FF4D00" stroke="#111111" stroke-width="3.5"/>
      <circle cx="272" cy="168" r="18" fill="none" stroke="#111111" stroke-width="3.5"/>
    </g>
  </g>

  <!-- vault dial (rotates very slowly) -->
  <g>
    <circle cx="470" cy="240" r="92" fill="#FFFDF5" stroke="#111111" stroke-width="5"/>
    <circle cx="470" cy="240" r="66" fill="none" stroke="#111111" stroke-width="3"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0 470 240; 360 470 240" dur="60s" repeatCount="indefinite"/>
      <g fill="#111111">
        <rect x="462" y="152" width="16" height="22"/>
        <rect x="462" y="306" width="16" height="22"/>
        <rect x="382" y="232" width="22" height="16"/>
        <rect x="536" y="232" width="22" height="16"/>
      </g>
      <line x1="470" y1="240" x2="470" y2="186" stroke="#FF4D00" stroke-width="5" stroke-linecap="round"/>
    </g>
    <!-- keyhole -->
    <circle cx="470" cy="240" r="14" fill="#111111"/>
    <path d="M 462 248 L 478 248 L 474 272 L 466 272 Z" fill="#111111"/>
  </g>

  <!-- approval checkmark lever (rises and settles, slow loop) -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 26; 0 0; 0 0; 0 26" keyTimes="0; 0.35; 0.7; 1" dur="12s" repeatCount="indefinite"/>
    <line x1="640" y1="330" x2="640" y2="180" stroke="#111111" stroke-width="5" stroke-linecap="round"/>
    <circle cx="640" cy="168" r="18" fill="#FFFDF5" stroke="#111111" stroke-width="4"/>
    <path d="M 668 300 L 700 332 L 748 262" fill="none" stroke="#FF4D00" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 668 300 L 700 332 L 748 262" fill="none" stroke="#111111" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.0"/>
  </g>

  <!-- dashed approval path from cart to vault to checkmark -->
  <path d="M 320 260 L 372 260" fill="none" stroke="#111111" stroke-width="2.5" stroke-dasharray="8 8">
    <animate attributeName="stroke-dashoffset" values="0; -32" dur="8s" repeatCount="indefinite"/>
  </path>
  <path d="M 566 260 L 620 260" fill="none" stroke="#FF4D00" stroke-width="2.5" stroke-dasharray="8 8">
    <animate attributeName="stroke-dashoffset" values="0; -32" dur="8s" repeatCount="indefinite"/>
  </path>

  <!-- small orbiting dot around the vault (slow) -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="0 470 240; 360 470 240" dur="30s" repeatCount="indefinite"/>
    <circle cx="470" cy="128" r="7" fill="#FF4D00" stroke="#111111" stroke-width="2"/>
  </g>
</svg>
