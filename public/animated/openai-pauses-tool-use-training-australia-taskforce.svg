<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Watchful eye closing over a robot arm's tools — agent containment">
  <rect width="800" height="450" fill="#FFFDF5"/>
  <!-- fine grid -->
  <g stroke="#111111" stroke-width="0.5" opacity="0.12">
    <path d="M0 50 H800 M0 100 H800 M0 150 H800 M0 200 H800 M0 250 H800 M0 300 H800 M0 350 H800 M0 400 H800"/>
    <path d="M50 0 V450 M100 0 V450 M150 0 V450 M200 0 V450 M250 0 V450 M300 0 V450 M350 0 V450 M400 0 V450 M450 0 V450 M500 0 V450 M550 0 V450 M600 0 V450 M650 0 V450 M700 0 V450 M750 0 V450"/>
  </g>

  <!-- drifting background nodes -->
  <g fill="#111111" opacity="0.22">
    <circle cx="110" cy="100" r="6">
      <animate attributeName="cy" values="100;150;100" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="700" cy="360" r="8">
      <animate attributeName="cy" values="360;310;360" dur="11s" repeatCount="indefinite"/>
    </circle>
    <circle cx="660" cy="90" r="5">
      <animate attributeName="cx" values="660;615;660" dur="10s" repeatCount="indefinite"/>
    </circle>
    <circle cx="120" cy="380" r="7">
      <animate attributeName="cx" values="120;165;120" dur="12s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- scattered tool tokens slowly drifting downward -->
  <g stroke="#111111" stroke-width="4" fill="#FFFDF5">
    <rect x="520" y="300" width="34" height="34" rx="4">
      <animate attributeName="y" values="300;336;300" dur="8s" repeatCount="indefinite"/>
    </rect>
    <circle cx="620" cy="330" r="17">
      <animate attributeName="cy" values="330;366;330" dur="9s" repeatCount="indefinite"/>
    </circle>
    <polygon points="690,318 712,318 712,340 690,340">
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 30; 0 0" dur="10s" additive="sum" repeatCount="indefinite"/>
    </polygon>
  </g>

  <!-- robotic arm reaching from left, slow swaying -->
  <g stroke="#111111" stroke-width="6" fill="none">
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-6 180 300; 6 180 300; -6 180 300" dur="12s" repeatCount="indefinite"/>
      <path d="M60 300 L180 300 L180 240"/>
      <circle cx="180" cy="300" r="12" fill="#FF4D00" stroke="#111111" stroke-width="5"/>
      <path d="M180 240 L260 240 L300 280"/>
      <circle cx="300" cy="280" r="10" fill="#111111"/>
    </g>
  </g>

  <!-- the watchful eye aperture from above, slowly opening/closing -->
  <g>
    <ellipse cx="420" cy="130" rx="120" ry="60" fill="none" stroke="#111111" stroke-width="6"/>
    <ellipse cx="420" cy="130" rx="34" ry="34" fill="#FF4D00" stroke="#111111" stroke-width="5">
      <animate attributeName="rx" values="34;8;34" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="ry" values="34;8;34" dur="7s" repeatCount="indefinite"/>
    </ellipse>
    <g opacity="0.35">
      <animate attributeName="opacity" values="0.35;0.05;0.35" dur="7s" repeatCount="indefinite"/>
      <path d="M420 40 L420 90 M500 45 L475 88 M340 45 L365 88" stroke="#111111" stroke-width="4"/>
    </g>
  </g>

  <!-- containment bracket frame pulsing orange -->
  <g stroke="#FF4D00" stroke-width="6" fill="none">
    <path d="M470 280 L470 400 L650 400">
      <animate attributeName="opacity" values="1;0.4;1" dur="8s" repeatCount="indefinite"/>
    </path>
    <path d="M700 260 L700 400 L640 400">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="9s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- thick brutalist frame -->
  <rect x="8" y="8" width="784" height="434" fill="none" stroke="#111111" stroke-width="10"/>
</svg>
