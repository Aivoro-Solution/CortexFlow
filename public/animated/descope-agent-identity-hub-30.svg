<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Animated schematic of AI agent identity governance">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#111111" stroke-width="0.6" opacity="0.12"/>
    </pattern>
  </defs>

  <!-- cream sheet + fine grid -->
  <rect x="0" y="0" width="800" height="450" fill="#FFFDF5"/>
  <rect x="0" y="0" width="800" height="450" fill="url(#grid)"/>

  <!-- outer frame -->
  <rect x="14" y="14" width="772" height="422" fill="none" stroke="#111111" stroke-width="6"/>

  <!-- central shield identity -->
  <g>
    <path d="M 400 90 L 520 130 L 520 230 C 520 310 460 360 400 385 C 340 360 280 310 280 230 L 280 130 Z"
          fill="#FFFDF5" stroke="#111111" stroke-width="8"/>
    <!-- orange core pulsing -->
    <circle cx="400" cy="225" r="46" fill="#FF4D00" stroke="#111111" stroke-width="6">
      <animate attributeName="r" values="46;54;46" dur="8s" repeatCount="indefinite"/>
    </circle>
    <!-- faceless agent head silhouette inside shield -->
    <circle cx="400" cy="205" r="26" fill="#FFFDF5" stroke="#111111" stroke-width="6"/>
    <path d="M 362 285 q 38 -22 76 0" fill="none" stroke="#111111" stroke-width="6"/>
    <!-- rotating orbit ring around shield -->
    <g>
      <ellipse cx="400" cy="225" rx="150" ry="120" fill="none" stroke="#111111" stroke-width="3" stroke-dasharray="10 10"/>
      <animateTransform attributeName="transform" type="rotate" from="0 400 225" to="360 400 225" dur="45s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- satellite agent tokens drifting slowly toward the hub -->
  <g>
    <!-- token 1: key badge (left) -->
    <g>
      <rect x="80" y="90" width="110" height="64" rx="8" fill="#FFFDF5" stroke="#111111" stroke-width="5"/>
      <circle cx="112" cy="122" r="12" fill="none" stroke="#111111" stroke-width="5"/>
      <rect x="132" y="116" width="40" height="12" fill="#111111"/>
      <animateTransform attributeName="transform" type="translate" values="0 0; 14 6; 0 0" dur="10s" repeatCount="indefinite"/>
    </g>
    <!-- token 2: id card (right) -->
    <g>
      <rect x="610" y="80" width="110" height="70" rx="8" fill="#FFFDF5" stroke="#111111" stroke-width="5"/>
      <rect x="626" y="98" width="34" height="34" fill="none" stroke="#111111" stroke-width="4"/>
      <rect x="670" y="102" width="34" height="8" fill="#111111"/>
      <rect x="670" y="120" width="34" height="8" fill="#111111"/>
      <animateTransform attributeName="transform" type="translate" values="0 0; -14 8; 0 0" dur="12s" repeatCount="indefinite"/>
    </g>
    <!-- token 3: cert scroll (bottom-left) -->
    <g>
      <rect x="120" y="300" width="96" height="60" rx="8" fill="#FFFDF5" stroke="#111111" stroke-width="5"/>
      <rect x="134" y="312" width="68" height="8" fill="#111111"/>
      <rect x="134" y="328" width="68" height="8" fill="#FF4D00"/>
      <animateTransform attributeName="transform" type="translate" values="0 0; 10 -8; 0 0" dur="11s" repeatCount="indefinite"/>
    </g>
    <!-- token 4: shield mini (bottom-right) -->
    <g>
      <path d="M 650 300 L 690 316 L 690 348 C 690 368 670 382 650 388 C 630 382 610 368 610 348 L 610 316 Z"
            fill="#FFFDF5" stroke="#111111" stroke-width="5"/>
      <animateTransform attributeName="transform" type="translate" values="0 0; -10 -6; 0 0" dur="9s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- policy connections: lines blinking in sequence from satellites to hub -->
  <g stroke="#111111" stroke-width="3">
    <line x1="190" y1="122" x2="292" y2="170">
      <animate attributeName="stroke-opacity" values="1;0.15;1" dur="7s" repeatCount="indefinite"/>
    </line>
    <line x1="610" y1="115" x2="512" y2="165">
      <animate attributeName="stroke-opacity" values="0.15;1;0.15" dur="7s" repeatCount="indefinite"/>
    </line>
    <line x1="216" y1="330" x2="300" y2="300">
      <animate attributeName="stroke-opacity" values="1;0.15;1" dur="9s" repeatCount="indefinite"/>
    </line>
    <line x1="610" y1="340" x2="520" y2="300">
      <animate attributeName="stroke-opacity" values="0.15;1;0.15" dur="9s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- rotating dashed outer ring for motion -->
  <g opacity="0.35">
    <circle cx="400" cy="225" r="185" fill="none" stroke="#FF4D00" stroke-width="4" stroke-dasharray="24 18">
      <animateTransform attributeName="transform" type="rotate" from="360 400 225" to="0 400 225" dur="60s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- scan sweep across the sheet -->
  <rect x="0" y="0" width="60" height="450" fill="#FF4D00" opacity="0.08">
    <animate attributeName="x" values="-80;800" dur="14s" repeatCount="indefinite"/>
  </rect>
</svg>
