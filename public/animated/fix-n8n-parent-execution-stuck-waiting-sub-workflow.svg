<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Abstract animation of a parent workflow waiting while a child workflow completes">
  <rect width="800" height="450" fill="#FFFDF5"/>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#111111" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="450" fill="url(#grid)"/>

  <!-- Parent ring: large, stalled, waiting -->
  <g transform="translate(250 225)">
    <circle r="110" fill="none" stroke="#111111" stroke-width="6"/>
    <circle r="88" fill="none" stroke="#111111" stroke-width="2" stroke-dasharray="4 10"/>
    <!-- hourglass marker inside parent ring, slowly pulsing -->
    <g>
      <path d="M -22 -26 L 22 -26 L -22 26 L 22 26 Z" fill="none" stroke="#111111" stroke-width="4" stroke-linejoin="round"/>
      <circle cx="0" cy="-8" r="7" fill="#FF4D00">
        <animate attributeName="cy" values="-8;8;-8" dur="8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;0.35;1" dur="8s" repeatCount="indefinite"/>
      </circle>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="60s" repeatCount="indefinite"/>
    </g>
    <!-- slow rotating tick marks around parent ring -->
    <g stroke="#111111" stroke-width="4">
      <line x1="0" y1="-110" x2="0" y2="-92"/>
      <line x1="0" y1="92" x2="0" y2="110"/>
      <line x1="-110" y1="0" x2="-92" y2="0"/>
      <line x1="92" y1="0" x2="110" y2="0"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="45s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- Dashed handoff line between parent and child -->
  <line x1="370" y1="225" x2="470" y2="225" stroke="#111111" stroke-width="4" stroke-dasharray="12 10">
    <animate attributeName="stroke-dashoffset" values="0;-88" dur="6s" repeatCount="indefinite"/>
  </line>
  <!-- orange packet travelling the handoff line, then fading (child result arriving) -->
  <circle cx="400" cy="225" r="10" fill="#FF4D00">
    <animate attributeName="cx" values="370;470;470;370" keyTimes="0;0.4;0.6;1" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.4;0.6;1" dur="12s" repeatCount="indefinite"/>
  </circle>

  <!-- Child ring: smaller, completed, orange check -->
  <g transform="translate(580 225)">
    <circle r="72" fill="none" stroke="#111111" stroke-width="6"/>
    <circle r="56" fill="none" stroke="#FF4D00" stroke-width="3" stroke-dasharray="6 8">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="30s" repeatCount="indefinite"/>
    </circle>
    <path d="M -28 2 L -8 22 L 30 -20" fill="none" stroke="#FF4D00" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
      <animate attributeName="stroke-dasharray" values="0 90; 90 0" dur="6s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Sweep hand: the 60-second sweep circling the parent, slow -->
  <g transform="translate(250 225)">
    <line x1="0" y1="0" x2="0" y2="-150" stroke="#FF4D00" stroke-width="3" stroke-dasharray="2 8"/>
    <circle cx="0" cy="-150" r="6" fill="#FF4D00"/>
    <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="36s" repeatCount="indefinite"/>
  </g>

  <!-- status dots: parent waiting (hollow), child done (filled orange) -->
  <g>
    <circle cx="250" cy="385" r="7" fill="none" stroke="#111111" stroke-width="3">
      <animate attributeName="opacity" values="1;0.3;1" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="580" cy="385" r="7" fill="#FF4D00">
      <animate attributeName="opacity" values="1;0.4;1" dur="6s" begin="3s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
