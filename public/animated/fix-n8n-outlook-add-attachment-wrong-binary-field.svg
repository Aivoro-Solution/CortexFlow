<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="Abstract animation of an email attachment being delivered to the wrong envelope">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#111111" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <marker id="arrowHead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#FF4D00"/>
    </marker>
  </defs>

  <!-- cream background + fine grid -->
  <rect width="800" height="450" fill="#FFFDF5"/>
  <rect width="800" height="450" fill="url(#grid)"/>

  <!-- ground line -->
  <line x1="60" y1="370" x2="740" y2="370" stroke="#111111" stroke-width="3"/>

  <!-- left envelope (correct destination) -->
  <g>
    <rect x="120" y="180" width="200" height="140" rx="6" fill="#FFFDF5" stroke="#111111" stroke-width="4"/>
    <polyline points="120,186 220,270 320,186" fill="none" stroke="#111111" stroke-width="4" stroke-linejoin="round"/>
    <circle cx="220" cy="250" r="16" fill="none" stroke="#111111" stroke-width="3"/>
    <circle cx="220" cy="250" r="5" fill="#111111">
      <animate attributeName="r" values="5;7;5" dur="8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- right envelope (wrong destination, orange accent) -->
  <g>
    <rect x="480" y="180" width="200" height="140" rx="6" fill="#FFFDF5" stroke="#111111" stroke-width="4"/>
    <polyline points="480,186 580,270 680,186" fill="none" stroke="#111111" stroke-width="4" stroke-linejoin="round"/>
    <rect x="560" y="232" width="40" height="36" rx="4" fill="#FF4D00" stroke="#111111" stroke-width="3">
      <animate attributeName="opacity" values="1;0.55;1" dur="7s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- the file / attachment travelling between envelopes (wrong-file swap) -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 360 0; 360 0; 0 0" keyTimes="0; 0.4; 0.6; 1" dur="12s" repeatCount="indefinite"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0 220 140; -6 220 140; 0 220 140" dur="12s" repeatCount="indefinite"/>
      <rect x="196" y="110" width="48" height="60" rx="4" fill="#FFFDF5" stroke="#111111" stroke-width="3"/>
      <path d="M 196 110 L 220 110 L 220 134 L 196 134 Z" fill="#FF4D00" stroke="#111111" stroke-width="2"/>
      <line x1="206" y1="146" x2="234" y2="146" stroke="#111111" stroke-width="2"/>
      <line x1="206" y1="156" x2="228" y2="156" stroke="#111111" stroke-width="2"/>
    </g>
  </g>

  <!-- dashed route arrow, slow dash drift -->
  <path d="M 330 130 C 380 90, 420 90, 470 130" fill="none" stroke="#FF4D00" stroke-width="3" stroke-dasharray="10 8" marker-end="url(#arrowHead)">
    <animate attributeName="stroke-dashoffset" values="0;-36" dur="6s" repeatCount="indefinite"/>
  </path>

  <!-- slow orbiting accent dot -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="0 400 225; 360 400 225" dur="40s" repeatCount="indefinite"/>
    <circle cx="400" cy="75" r="7" fill="#FF4D00" stroke="#111111" stroke-width="2"/>
  </g>

  <!-- small drifting paperclip shape -->
  <g opacity="0.9">
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -10; 0 0" dur="9s" repeatCount="indefinite"/>
    <path d="M 700 90 c 0 -10 16 -10 16 0 v 22 c 0 14 -22 14 -22 0 v -14 c 0 -6 10 -6 10 0 v 8" fill="none" stroke="#111111" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
