<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Animated schematic: an abstract watchful eye over a risk disclosure document">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="#111111" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- cream background + fine grid -->
  <rect x="0" y="0" width="800" height="450" fill="#FFFDF5"/>
  <rect x="0" y="0" width="800" height="450" fill="url(#grid)"/>

  <!-- thick black frame -->
  <rect x="14" y="14" width="772" height="422" fill="none" stroke="#111111" stroke-width="5"/>

  <!-- risk document page: cream sheet with black border, slowly drifting -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 10 6; 0 0" dur="9s" repeatCount="indefinite"/>
    <rect x="120" y="80" width="240" height="290" fill="#FFFDF5" stroke="#111111" stroke-width="4"/>
    <!-- document lines that fade/pulse -->
    <g stroke="#111111" stroke-width="6" stroke-linecap="round" opacity="0.85">
      <line x1="150" y1="130" x2="330" y2="130"><animate attributeName="opacity" values="0.85;0.35;0.85" dur="7s" repeatCount="indefinite"/></line>
      <line x1="150" y1="160" x2="300" y2="160"/>
      <line x1="150" y1="190" x2="330" y2="190"><animate attributeName="opacity" values="0.85;0.35;0.85" dur="7s" begin="2s" repeatCount="indefinite"/></line>
      <line x1="150" y1="220" x2="280" y2="220"/>
      <line x1="150" y1="250" x2="330" y2="250"><animate attributeName="opacity" values="0.85;0.35;0.85" dur="7s" begin="4s" repeatCount="indefinite"/></line>
      <line x1="150" y1="280" x2="310" y2="280"/>
    </g>
    <!-- orange warning accent bar -->
    <rect x="150" y="312" width="120" height="22" fill="#FF4D00" stroke="#111111" stroke-width="3">
      <animate attributeName="width" values="120;170;120" dur="8s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- watchful eye: abstract oval + iris, slow blinking iris drift -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; -8 -4; 0 0" dur="12s" repeatCount="indefinite"/>
    <ellipse cx="560" cy="225" rx="120" ry="72" fill="#FFFDF5" stroke="#111111" stroke-width="6"/>
    <circle cx="560" cy="225" r="34" fill="#FF4D00" stroke="#111111" stroke-width="5">
      <animate attributeName="cx" values="560;588;532;560" dur="14s" repeatCount="indefinite"/>
    </circle>
    <circle cx="560" cy="225" r="12" fill="#111111">
      <animate attributeName="cx" values="560;588;532;560" dur="14s" repeatCount="indefinite"/>
    </circle>
    <!-- eyelid blink: slow -->
    <rect x="432" y="105" width="256" height="0" fill="#111111" opacity="0">
      <animate attributeName="height" values="0;0;120;0;0" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;1;0;0" dur="10s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- slow rotating dashed orbit around the eye -->
  <g stroke="#111111" stroke-width="3" stroke-dasharray="14 10" fill="none">
    <circle cx="560" cy="225" r="168" opacity="0.45">
      <animateTransform attributeName="transform" type="rotate" from="0 560 225" to="360 560 225" dur="40s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- small orange nodes drifting upward, like signals escaping -->
  <g fill="#FF4D00" stroke="#111111" stroke-width="3">
    <circle cx="220" cy="380" r="10">
      <animate attributeName="cy" values="380;250;380" dur="11s" repeatCount="indefinite"/>
    </circle>
    <circle cx="660" cy="380" r="10">
      <animate attributeName="cy" values="380;250;380" dur="11s" begin="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="420" cy="390" r="8">
      <animate attributeName="cy" values="390;260;390" dur="13s" begin="6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
