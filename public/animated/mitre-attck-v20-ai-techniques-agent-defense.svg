<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Abstract schematic of an attacker path penetrating layered defenses toward an AI agent core">
  <rect width="800" height="450" fill="#FFFDF5"/>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#111111" stroke-width="0.5" opacity="0.12"/>
    </pattern>
  </defs>
  <rect width="800" height="450" fill="url(#grid)"/>

  <!-- layered defense arcs around the agent core -->
  <g fill="none" stroke="#111111" stroke-width="3">
    <circle cx="580" cy="225" r="120" opacity="0.9"/>
    <circle cx="580" cy="225" r="80" opacity="0.6"/>
    <circle cx="580" cy="225" r="42" opacity="0.35"/>
  </g>

  <!-- rotating sweep around the core (very slow) -->
  <g opacity="0.55">
    <line x1="580" y1="225" x2="580" y2="105" stroke="#FF4D00" stroke-width="4">
      <animateTransform attributeName="transform" type="rotate" from="0 580 225" to="360 580 225" dur="42s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- agent core: abstract geometric node cluster -->
  <g stroke="#111111" stroke-width="3" fill="#FFFDF5">
    <rect x="556" y="201" width="48" height="48" fill="#FF4D00">
      <animate attributeName="opacity" values="1;0.55;1" dur="8s" repeatCount="indefinite"/>
    </rect>
    <circle cx="516" cy="225" r="14"/>
    <circle cx="644" cy="225" r="14"/>
    <circle cx="580" cy="169" r="14"/>
    <circle cx="580" cy="281" r="14"/>
    <line x1="530" y1="225" x2="556" y2="225"/>
    <line x1="604" y1="225" x2="630" y2="225"/>
    <line x1="580" y1="183" x2="580" y2="201"/>
    <line x1="580" y1="249" x2="580" y2="267"/>
  </g>

  <!-- attacker path: dashed line approaching from the left, slowly animating -->
  <path d="M 60 225 L 460 225" fill="none" stroke="#111111" stroke-width="3" stroke-dasharray="14 10">
    <animate attributeName="stroke-dashoffset" from="240" to="0" dur="12s" repeatCount="indefinite"/>
  </path>
  <polygon points="60,212 60,238 36,225" fill="#FF4D00" stroke="#111111" stroke-width="3"/>

  <!-- data packets travelling along the attacker path -->
  <circle cx="0" cy="225" r="9" fill="#FF4D00" stroke="#111111" stroke-width="3">
    <animateMotion dur="10s" repeatCount="indefinite" path="M 60 225 L 460 225"/>
  </circle>
  <circle cx="0" cy="225" r="6" fill="#FFFDF5" stroke="#111111" stroke-width="3">
    <animateMotion dur="14s" begin="3s" repeatCount="indefinite" path="M 60 225 L 460 225"/>
  </circle>

  <!-- detection pings on the defense ring (slow blink) -->
  <g fill="#FF4D00" stroke="#111111" stroke-width="2">
    <circle cx="580" cy="105" r="7">
      <animate attributeName="opacity" values="1;0.2;1" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="492" cy="285" r="7">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="11s" repeatCount="indefinite"/>
    </circle>
    <circle cx="668" cy="285" r="7">
      <animate attributeName="opacity" values="1;0.2;1" dur="13s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- breach crack in the outer ring where the path meets it -->
  <path d="M 460 225 L 474 218 M 460 225 L 474 232" stroke="#FF4D00" stroke-width="4">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="7s" repeatCount="indefinite"/>
  </path>

  <!-- drifting background nodes -->
  <g fill="none" stroke="#111111" stroke-width="2" opacity="0.4">
    <rect x="120" y="90" width="34" height="34">
      <animateTransform attributeName="transform" type="rotate" from="0 137 107" to="360 137 107" dur="60s" repeatCount="indefinite"/>
    </rect>
    <circle cx="240" cy="330" r="18">
      <animate attributeName="r" values="18;24;18" dur="16s" repeatCount="indefinite"/>
    </circle>
    <rect x="300" y="70" width="26" height="26">
      <animateTransform attributeName="transform" type="rotate" from="360 313 83" to="0 313 83" dur="75s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
