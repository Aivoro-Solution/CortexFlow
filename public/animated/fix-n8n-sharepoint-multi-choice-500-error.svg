<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="Animated schematic: a list row with checkboxes, one highlighted row flowing into a clean arrow">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#111111" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- paper -->
  <rect x="0" y="0" width="800" height="450" fill="#FFFDF5"/>
  <rect x="0" y="0" width="800" height="450" fill="url(#grid)"/>

  <!-- list panel -->
  <g>
    <rect x="90" y="70" width="360" height="310" fill="#FFFFFF" stroke="#111111" stroke-width="4"/>
    <rect x="98" y="78" width="360" height="310" fill="none" stroke="#111111" stroke-width="2" stroke-opacity="0.15"/>
    <!-- header bar -->
    <rect x="90" y="70" width="360" height="52" fill="#111111"/>
    <rect x="112" y="90" width="120" height="12" fill="#FFFDF5"/>
    <rect x="112" y="106" width="70" height="8" fill="#FF4D00"/>
    <!-- rows -->
    <g stroke="#111111" stroke-width="3" fill="none">
      <line x1="112" y1="160" x2="428" y2="160"/>
      <line x1="112" y1="216" x2="428" y2="216"/>
      <line x1="112" y1="272" x2="428" y2="272"/>
      <line x1="112" y1="328" x2="428" y2="328"/>
    </g>
    <!-- checkbox squares -->
    <g fill="#FFFFFF" stroke="#111111" stroke-width="3">
      <rect x="116" y="134" width="20" height="20"/>
      <rect x="116" y="190" width="20" height="20"/>
      <rect x="116" y="246" width="20" height="20"/>
      <rect x="116" y="302" width="20" height="20"/>
    </g>
    <!-- checked marks: first two checked, third pulses orange, fourth empty -->
    <g stroke="#111111" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 120 144 L 125 149 L 133 140"/>
      <path d="M 120 200 L 125 205 L 133 196"/>
    </g>
    <g stroke="#FF4D00" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 120 256 L 125 261 L 133 252">
        <animate attributeName="stroke-opacity" values="0.15;1;0.15" dur="6s" repeatCount="indefinite"/>
      </path>
    </g>
    <!-- text-line placeholders -->
    <g fill="#111111">
      <rect x="152" y="140" width="150" height="9"/>
      <rect x="152" y="196" width="190" height="9"/>
      <rect x="152" y="252" width="120" height="9"/>
      <rect x="152" y="308" width="170" height="9"/>
    </g>
    <!-- highlighted row band slides down slowly across rows -->
    <rect x="90" y="122" width="360" height="44" fill="#FF4D00" fill-opacity="0.12">
      <animate attributeName="y" values="122;178;234;290;122" dur="24s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- tangled path morphing into a straight arrow: broken segment pulses, then the arrow draws -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- tangled input -->
    <path d="M 470 150 C 520 110, 500 210, 560 170 S 620 230, 600 180" stroke="#111111" stroke-width="4" stroke-dasharray="10 8">
      <animate attributeName="stroke-dashoffset" values="0;-72" dur="8s" repeatCount="indefinite"/>
    </path>
    <!-- clean output arrow -->
    <path d="M 500 300 L 660 300" stroke="#FF4D00" stroke-width="5"/>
    <path d="M 640 282 L 668 300 L 640 318" stroke="#FF4D00" stroke-width="5" fill="none"/>
    <!-- orange dot travelling along the straight arrow -->
    <circle r="9" fill="#FF4D00" stroke="#111111" stroke-width="3">
      <animateMotion dur="6s" repeatCount="indefinite" path="M 500 300 L 660 300"/>
    </circle>
  </g>

  <!-- rotating gear-ish ring, slow -->
  <g transform="translate(640,120)">
    <g>
      <circle r="42" fill="none" stroke="#111111" stroke-width="4"/>
      <circle r="30" fill="none" stroke="#111111" stroke-width="2" stroke-dasharray="6 8"/>
      <circle r="8" fill="#FF4D00"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="40s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- small status dot blinking slowly -->
  <circle cx="640" cy="390" r="10" fill="#FF4D00" stroke="#111111" stroke-width="3">
    <animate attributeName="fill-opacity" values="1;0.25;1" dur="6s" repeatCount="indefinite"/>
  </circle>
  <rect x="664" y="384" width="60" height="10" fill="#111111">
    <animate attributeName="width" values="60;90;60" dur="12s" repeatCount="indefinite"/>
  </rect>
</svg>
