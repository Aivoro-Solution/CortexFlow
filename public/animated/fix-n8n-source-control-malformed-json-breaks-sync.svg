<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Abstract animation of a version-control sync tree with one cracked card">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#111111" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- paper -->
  <rect x="0" y="0" width="800" height="450" fill="#FFFDF5"/>
  <rect x="0" y="0" width="800" height="450" fill="url(#grid)"/>

  <!-- border -->
  <rect x="14" y="14" width="772" height="422" fill="none" stroke="#111111" stroke-width="3"/>

  <!-- branch lines: dev -> main, with a slow travelling dot -->
  <g stroke="#111111" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M 120 225 L 300 225"/>
    <path d="M 300 225 L 480 120"/>
    <path d="M 300 225 L 480 330"/>
    <path d="M 480 120 L 660 120"/>
    <path d="M 480 330 L 660 330"/>
  </g>

  <!-- travelling sync dots along the branches -->
  <circle r="7" fill="#FF4D00">
    <animateMotion dur="12s" repeatCount="indefinite" path="M 120 225 L 300 225 L 480 120 L 660 120"/>
  </circle>
  <circle r="7" fill="#FF4D00">
    <animateMotion dur="12s" begin="6s" repeatCount="indefinite" path="M 120 225 L 300 225 L 480 330 L 660 330"/>
  </circle>

  <!-- document cards: neat black cards -->
  <g stroke="#111111" stroke-width="3" fill="#FFFDF5">
    <rect x="70" y="195" width="100" height="60" rx="4"/>
    <rect x="250" y="195" width="100" height="60" rx="4"/>
    <rect x="430" y="90" width="100" height="60" rx="4"/>
    <rect x="610" y="300" width="100" height="60" rx="4"/>
  </g>

  <!-- the cracked card: orange, slowly pulsing outline -->
  <g>
    <rect x="610" y="90" width="100" height="60" rx="4" fill="#FFFDF5" stroke="#FF4D00" stroke-width="3">
      <animate attributeName="stroke-width" values="3;6;3" dur="8s" repeatCount="indefinite"/>
    </rect>
    <!-- crack -->
    <path d="M 640 90 L 655 110 L 645 125 L 665 145 L 655 150" fill="none" stroke="#FF4D00" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <animate attributeName="opacity" values="1;0.35;1" dur="8s" repeatCount="indefinite"/>
    </path>
    <!-- folded corner hint -->
    <path d="M 690 90 L 710 90 L 710 110" fill="none" stroke="#FF4D00" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- the broken card: slow rotation of the lower card -->
  <g>
    <rect x="430" y="300" width="100" height="60" rx="4" fill="#FFFDF5" stroke="#111111" stroke-width="3"/>
    <animateTransform attributeName="transform" type="rotate" values="0 480 330; -2 480 330; 0 480 330" dur="30s" repeatCount="indefinite"/>
  </g>

  <!-- small status dots -->
  <circle cx="120" cy="225" r="8" fill="#111111"/>
  <circle cx="300" cy="225" r="8" fill="#111111"/>
  <circle cx="480" cy="120" r="8" fill="#111111"/>
  <circle cx="480" cy="330" r="8" fill="#111111"/>
  <circle cx="660" cy="120" r="8" fill="#FF4D00">
    <animate attributeName="opacity" values="1;0.3;1" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="660" cy="330" r="8" fill="#111111"/>
</svg>
