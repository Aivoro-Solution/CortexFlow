<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Animated schematic: an inventory board cataloguing AI agent nodes, one flagged agent pulsing orange">
  <rect x="0" y="0" width="800" height="450" fill="#FFFDF5"/>
  <g stroke="#111" stroke-width="1" opacity="0.08">
    <path d="M0 50 H800 M0 100 H800 M0 150 H800 M0 200 H800 M0 250 H800 M0 300 H800 M0 350 H800 M0 400 H800"/>
    <path d="M50 0 V450 M100 0 V450 M150 0 V450 M200 0 V450 M250 0 V450 M300 0 V450 M350 0 V450 M400 0 V450 M450 0 V450 M500 0 V450 M550 0 V450 M600 0 V450 M650 0 V450 M700 0 V450 M750 0 V450"/>
  </g>
  <rect x="130" y="60" width="540" height="330" fill="#FFFDF5" stroke="#111" stroke-width="4"/>
  <rect x="130" y="60" width="540" height="44" fill="#FFFDF5" stroke="#111" stroke-width="4"/>
  <line x1="130" y1="104" x2="670" y2="104" stroke="#111" stroke-width="4"/>
  <g fill="#111">
    <circle cx="170" cy="82" r="7"/><circle cx="210" cy="82" r="7"/><circle cx="250" cy="82" r="7"/><circle cx="290" cy="82" r="7"/><circle cx="330" cy="82" r="7"/>
  </g>
  <g fill="#FF4D00">
    <circle cx="620" cy="82" r="10">
      <animate attributeName="r" values="10;13;10" dur="8s" repeatCount="indefinite"/>
    </circle>
  </g>
  <g stroke="#111" stroke-width="2.5">
    <line x1="220" y1="200" x2="260" y2="160"/><line x1="260" y1="160" x2="300" y2="200"/>
    <line x1="380" y1="200" x2="420" y2="160"/><line x1="420" y1="160" x2="460" y2="200"/><line x1="380" y1="200" x2="460" y2="200"/>
    <line x1="220" y1="300" x2="260" y2="300"/><line x1="260" y1="300" x2="260" y2="260"/>
    <line x1="380" y1="300" x2="420" y2="260"/><line x1="420" y1="260" x2="460" y2="300"/>
    <line x1="540" y1="200" x2="580" y2="160"/><line x1="580" y1="160" x2="620" y2="200"/>
  </g>
  <g fill="#111">
    <circle cx="220" cy="200" r="9"/><circle cx="260" cy="160" r="9"/><circle cx="300" cy="200" r="9"/>
    <circle cx="380" cy="200" r="9"/><circle cx="420" cy="160" r="9"/><circle cx="460" cy="200" r="9"/>
    <circle cx="220" cy="300" r="9"/><circle cx="260" cy="300" r="9"/><circle cx="260" cy="260" r="9"/>
    <circle cx="380" cy="300" r="9"/><circle cx="420" cy="260" r="9"/><circle cx="460" cy="300" r="9"/>
    <circle cx="540" cy="200" r="9"/><circle cx="580" cy="160" r="9"/><circle cx="620" cy="200" r="9"/>
    <circle cx="540" cy="300" r="9"><animate attributeName="opacity" values="1;0.25;1" dur="8s" repeatCount="indefinite"/></circle>
    <circle cx="580" cy="260" r="9"><animate attributeName="opacity" values="0.25;1;0.25" dur="8s" repeatCount="indefinite"/></circle>
    <circle cx="620" cy="300" r="9"><animate attributeName="opacity" values="1;0.25;1" dur="8s" repeatCount="indefinite"/></circle>
  </g>
  <g stroke="#FF4D00" stroke-width="3">
    <circle cx="580" cy="282" r="46" fill="none">
      <animate attributeName="r" values="44;52;44" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0.45;0.9" dur="8s" repeatCount="indefinite"/>
    </circle>
  </g>
  <g stroke="#FF4D00" stroke-width="3">
    <line x1="150" y1="120" x2="150" y2="370">
      <animateTransform attributeName="transform" type="translate" values="0 0; 500 0; 0 0" dur="14s" repeatCount="indefinite"/>
    </line>
  </g>
  <g transform="rotate(-20 90 400)">
    <rect x="60" y="340" width="60" height="120" fill="#111">
      <animateTransform attributeName="transform" type="rotate" values="0 90 400; 360 90 400" dur="60s" repeatCount="indefinite"/>
    </rect>
  </g>
  <g transform="rotate(15 730 90)">
    <path d="M700 40 L760 40 L700 140 Z" fill="none" stroke="#111" stroke-width="5">
      <animateTransform attributeName="transform" type="rotate" values="0 730 90; -360 730 90" dur="45s" repeatCount="indefinite"/>
    </path>
  </g>
  <circle cx="90" cy="90" r="16" fill="#FF4D00" stroke="#111" stroke-width="4">
    <animate attributeName="cy" values="90;110;90" dur="7s" repeatCount="indefinite"/>
  </circle>
</svg>
