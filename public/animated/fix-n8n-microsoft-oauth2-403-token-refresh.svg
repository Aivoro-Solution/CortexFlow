<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Abstract animation of an expired token being renewed through a key gate">
  <rect width="800" height="450" fill="#FFFDF5"/>
  <!-- fine grid -->
  <g stroke="#111111" stroke-opacity="0.07" stroke-width="1">
    <path d="M40 0V450M80 0V450M120 0V450M160 0V450M200 0V450M240 0V450M280 0V450M320 0V450M360 0V450M400 0V450M440 0V450M480 0V450M520 0V450M560 0V450M600 0V450M640 0V450M680 0V450M720 0V450M760 0V450"/>
    <path d="M0 40H800M0 80H800M0 120H800M0 160H800M0 200H800M0 240H800M0 280H800M0 320H800M0 360H800M0 400H800"/>
  </g>

  <!-- gate frame: two posts and a lintel, hard offset shadow -->
  <g>
    <rect x="238" y="118" width="330" height="16" fill="#111111"/>
    <rect x="230" y="110" width="330" height="16" fill="#FFFDF5" stroke="#111111" stroke-width="4"/>
    <rect x="238" y="126" width="18" height="208" fill="#111111"/>
    <rect x="230" y="118" width="18" height="208" fill="#FFFDF5" stroke="#111111" stroke-width="4"/>
    <rect x="560" y="126" width="18" height="208" fill="#111111"/>
    <rect x="552" y="118" width="18" height="208" fill="#FFFDF5" stroke="#111111" stroke-width="4"/>
    <!-- gate bars that slide down slowly (the gate opening = refresh granted) -->
    <g>
      <rect x="262" y="126" width="14" height="150" fill="#111111">
        <animate attributeName="y" values="126;126;200;200;126" dur="18s" repeatCount="indefinite"/>
        <animate attributeName="height" values="150;150;76;76;150" dur="18s" repeatCount="indefinite"/>
      </rect>
      <rect x="296" y="126" width="14" height="150" fill="#111111">
        <animate attributeName="y" values="126;126;200;200;126" dur="18s" begin="1s" repeatCount="indefinite"/>
        <animate attributeName="height" values="150;150;76;76;150" dur="18s" begin="1s" repeatCount="indefinite"/>
      </rect>
      <rect x="330" y="126" width="14" height="150" fill="#111111">
        <animate attributeName="y" values="126;126;200;200;126" dur="18s" begin="2s" repeatCount="indefinite"/>
        <animate attributeName="height" values="150;150;76;76;150" dur="18s" begin="2s" repeatCount="indefinite"/>
      </rect>
      <rect x="364" y="126" width="14" height="150" fill="#FF4D00">
        <animate attributeName="y" values="126;126;200;200;126" dur="18s" begin="3s" repeatCount="indefinite"/>
        <animate attributeName="height" values="150;150;76;76;150" dur="18s" begin="3s" repeatCount="indefinite"/>
      </rect>
      <rect x="398" y="126" width="14" height="150" fill="#111111">
        <animate attributeName="y" values="126;126;200;200;126" dur="18s" begin="4s" repeatCount="indefinite"/>
        <animate attributeName="height" values="150;150;76;76;150" dur="18s" begin="4s" repeatCount="indefinite"/>
      </rect>
      <rect x="432" y="126" width="14" height="150" fill="#111111">
        <animate attributeName="y" values="126;126;200;200;126" dur="18s" begin="5s" repeatCount="indefinite"/>
        <animate attributeName="height" values="150;150;76;76;150" dur="18s" begin="5s" repeatCount="indefinite"/>
      </rect>
      <rect x="466" y="126" width="14" height="150" fill="#111111">
        <animate attributeName="y" values="126;126;200;200;126" dur="18s" begin="6s" repeatCount="indefinite"/>
        <animate attributeName="height" values="150;150;76;76;150" dur="18s" begin="6s" repeatCount="indefinite"/>
      </rect>
      <rect x="500" y="126" width="14" height="150" fill="#111111">
        <animate attributeName="y" values="126;126;200;200;126" dur="18s" begin="7s" repeatCount="indefinite"/>
        <animate attributeName="height" values="150;150;76;76;150" dur="18s" begin="7s" repeatCount="indefinite"/>
      </rect>
      <rect x="534" y="126" width="14" height="150" fill="#111111">
        <animate attributeName="y" values="126;126;200;200;126" dur="18s" begin="8s" repeatCount="indefinite"/>
        <animate attributeName="height" values="150;150;76;76;150" dur="18s" begin="8s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <!-- key: slowly rotating, slides toward the lock then back -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 90 0; 90 0; 0 0" dur="18s" repeatCount="indefinite"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0 400 250; 0 400 250; 90 400 250; 90 400 250; 0 400 250" dur="18s" repeatCount="indefinite"/>
      <!-- key bow -->
      <circle cx="400" cy="250" r="34" fill="#FFFDF5" stroke="#111111" stroke-width="5"/>
      <circle cx="400" cy="250" r="16" fill="#FF4D00"/>
      <!-- key shaft and teeth -->
      <rect x="434" y="242" width="120" height="16" fill="#FFFDF5" stroke="#111111" stroke-width="5"/>
      <rect x="520" y="258" width="12" height="22" fill="#111111"/>
      <rect x="542" y="258" width="12" height="34" fill="#111111"/>
    </g>
  </g>

  <!-- token ring: drains then refills, slow pulse -->
  <g>
    <circle cx="120" cy="330" r="46" fill="none" stroke="#111111" stroke-width="5"/>
    <circle cx="120" cy="330" r="46" fill="none" stroke="#FF4D00" stroke-width="5" stroke-dasharray="289" stroke-dashoffset="289" stroke-linecap="round" transform="rotate(-90 120 330)">
      <animate attributeName="stroke-dashoffset" values="289;0;0;289" dur="18s" repeatCount="indefinite"/>
    </circle>
    <circle cx="120" cy="330" r="18" fill="#111111">
      <animate attributeName="r" values="18;18;24;24;18" dur="18s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- drifting abstract shapes -->
  <circle cx="690" cy="120" r="22" fill="none" stroke="#111111" stroke-width="4">
    <animate attributeName="cy" values="120;100;120" dur="9s" repeatCount="indefinite"/>
  </circle>
  <rect x="660" y="330" width="60" height="14" fill="#FF4D00" transform="rotate(-12 690 337)">
    <animateTransform attributeName="transform" type="rotate" values="-12 690 337; 12 690 337; -12 690 337" dur="12s" repeatCount="indefinite"/>
  </rect>
  <circle cx="90" cy="110" r="10" fill="#111111">
    <animate attributeName="cy" values="110;130;110" dur="7s" repeatCount="indefinite"/>
  </circle>
  <g>
    <animateTransform attributeName="transform" type="rotate" values="0 690 220; 360 690 220" dur="60s" repeatCount="indefinite"/>
    <rect x="672" y="202" width="36" height="36" fill="none" stroke="#111111" stroke-width="4"/>
  </g>

  <!-- ground line -->
  <line x1="60" y1="360" x2="740" y2="360" stroke="#111111" stroke-width="4"/>
</svg>
