<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Abstract animation of a workflow node rename accidentally redirecting a reference">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#111111" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- cream sheet + fine grid -->
  <rect width="800" height="450" fill="#FFFDF5"/>
  <rect width="800" height="450" fill="url(#grid)"/>

  <!-- slow drifting frame -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 6 4; 0 0" dur="24s" repeatCount="indefinite"/>
    <!-- workflow rail -->
    <line x1="60" y1="225" x2="740" y2="225" stroke="#111111" stroke-width="3" stroke-dasharray="10 8"/>

    <!-- node A: the renamed node -->
    <g>
      <rect x="120" y="165" width="150" height="120" rx="6" fill="#FFFDF5" stroke="#111111" stroke-width="4"/>
      <rect x="132" y="177" width="126" height="14" fill="#111111"/>
      <rect x="132" y="203" width="90" height="10" fill="#111111" opacity="0.55"/>
      <rect x="132" y="221" width="110" height="10" fill="#111111" opacity="0.35"/>
      <rect x="132" y="239" width="70" height="10" fill="#111111" opacity="0.55"/>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -8; 0 0" dur="12s" repeatCount="indefinite"/>
    </g>

    <!-- node B: the similarly-named node (orange accent) -->
    <g>
      <rect x="330" y="165" width="150" height="120" rx="6" fill="#FFFDF5" stroke="#111111" stroke-width="4"/>
      <rect x="342" y="177" width="126" height="14" fill="#FF4D00"/>
      <rect x="342" y="203" width="90" height="10" fill="#111111" opacity="0.55"/>
      <rect x="342" y="221" width="110" height="10" fill="#111111" opacity="0.35"/>
      <rect x="342" y="239" width="70" height="10" fill="#111111" opacity="0.55"/>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 8; 0 0" dur="12s" repeatCount="indefinite"/>
    </g>

    <!-- node C: downstream node receiving the reference -->
    <g>
      <rect x="560" y="165" width="150" height="120" rx="6" fill="#FFFDF5" stroke="#111111" stroke-width="4"/>
      <rect x="572" y="177" width="126" height="14" fill="#111111"/>
      <rect x="572" y="203" width="90" height="10" fill="#111111" opacity="0.55"/>
      <rect x="572" y="221" width="110" height="10" fill="#111111" opacity="0.35"/>
      <rect x="572" y="239" width="70" height="10" fill="#111111" opacity="0.55"/>
    </g>

    <!-- reference arrow: correct path (node A -> node C) fading out -->
    <path d="M 270 225 L 560 225" fill="none" stroke="#111111" stroke-width="3" stroke-dasharray="8 6" opacity="0.9">
      <animate attributeName="opacity" values="0.9; 0.15; 0.9" dur="12s" repeatCount="indefinite"/>
    </path>

    <!-- reference arrow: wrong path (node B -> node C) pulsing orange -->
    <path d="M 480 225 L 560 225" fill="none" stroke="#FF4D00" stroke-width="4" stroke-dasharray="8 6">
      <animate attributeName="opacity" values="0.15; 1; 0.15" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="stroke-dashoffset" values="0; -56" dur="7s" repeatCount="indefinite"/>
    </path>

    <!-- arrowhead on the orange path -->
    <polygon points="560,216 560,234 578,225" fill="#FF4D00">
      <animate attributeName="opacity" values="0.15; 1; 0.15" dur="12s" repeatCount="indefinite"/>
    </polygon>

    <!-- slow rotating gear / dial accent -->
    <g transform="translate(680 90)">
      <circle r="26" fill="none" stroke="#111111" stroke-width="3"/>
      <line x1="0" y1="-26" x2="0" y2="-14" stroke="#FF4D00" stroke-width="4"/>
      <line x1="0" y1="14" x2="0" y2="26" stroke="#111111" stroke-width="3"/>
      <line x1="-26" y1="0" x2="-14" y2="0" stroke="#111111" stroke-width="3"/>
      <line x1="14" y1="0" x2="26" y2="0" stroke="#111111" stroke-width="3"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="60s" repeatCount="indefinite"/>
    </g>

    <!-- slow pulsing warning dot above node B -->
    <circle cx="405" cy="130" r="10" fill="#FF4D00">
      <animate attributeName="r" values="8; 13; 8" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6; 1; 0.6" dur="8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- corner ticks -->
  <path d="M 20 20 h 24 M 20 20 v 24" fill="none" stroke="#111111" stroke-width="3"/>
  <path d="M 780 20 h -24 M 780 20 v 24" fill="none" stroke="#111111" stroke-width="3"/>
  <path d="M 20 430 h 24 M 20 430 v -24" fill="none" stroke="#111111" stroke-width="3"/>
  <path d="M 780 430 h -24 M 780 430 v -24" fill="none" stroke="#111111" stroke-width="3"/>
</svg>
