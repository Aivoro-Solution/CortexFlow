<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Abstract animated node graph with a rotating gear">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#111" stroke-width="0.6" opacity="0.14"/>
    </pattern>
  </defs>
  <rect x="0" y="0" width="800" height="450" fill="#FFFDF5"/>
  <rect x="0" y="0" width="800" height="450" fill="url(#grid)"/>
  <rect x="14" y="14" width="772" height="422" fill="none" stroke="#111" stroke-width="3"/>

  <!-- release blocks ascending (left) -->
  <g stroke="#111" stroke-width="3">
    <rect x="80" y="320" width="150" height="46" fill="#FFFDF5"/>
    <rect x="80" y="258" width="150" height="46" fill="#FF4D00"/>
    <rect x="80" y="196" width="150" height="46" fill="#FFFDF5">
      <animate attributeName="y" values="196;188;196" dur="9s" repeatCount="indefinite"/>
    </rect>
    <rect x="80" y="134" width="150" height="46" fill="#FFFDF5"/>
  </g>

  <!-- animated node graph (right) -->
  <g stroke="#111" stroke-width="5" fill="none">
    <line x1="380" y1="225" x2="520" y2="130"/>
    <line x1="380" y1="225" x2="520" y2="320"/>
    <line x1="520" y1="130" x2="660" y2="225">
      <animate attributeName="stroke-dashoffset" from="40" to="0" dur="8s" repeatCount="indefinite"/>
    </line>
    <line x1="520" y1="320" x2="660" y2="225"/>
    <line x1="520" y1="130" x2="520" y2="320"/>
  </g>
  <g stroke="#111" stroke-width="5">
    <circle cx="380" cy="225" r="26" fill="#FFFDF5"/>
    <circle cx="520" cy="130" r="26" fill="#FFFDF5">
      <animate attributeName="r" values="26;32;26" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="520" cy="320" r="26" fill="#FFFDF5"/>
    <circle cx="660" cy="225" r="30" fill="#FF4D00">
      <animate attributeName="r" values="30;24;30" dur="6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- slow rotating gear (agent hub) -->
  <g transform="translate(660,225)">
    <g stroke="#111" stroke-width="5" fill="none">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="40s" repeatCount="indefinite"/>
      <circle r="54" fill="#FFFDF5"/>
      <circle r="34" fill="#FF4D00"/>
      <g stroke-width="10" stroke-linecap="round">
        <line x1="0" y1="-54" x2="0" y2="-70"/>
        <line x1="0" y1="54" x2="0" y2="70"/>
        <line x1="-54" y1="0" x2="-70" y2="0"/>
        <line x1="54" y1="0" x2="70" y2="0"/>
        <line x1="-38" y1="-38" x2="-50" y2="-50"/>
        <line x1="38" y1="-38" x2="50" y2="-50"/>
        <line x1="-38" y1="38" x2="-50" y2="50"/>
        <line x1="38" y1="38" x2="50" y2="50"/>
      </g>
    </g>
  </g>

  <!-- drifting connector bolts -->
  <g fill="#111">
    <rect x="300" y="90" width="18" height="18" transform="rotate(20 309 99)">
      <animateTransform attributeName="transform" type="rotate" from="20 309 99" to="380 309 99" dur="36s" repeatCount="indefinite"/>
    </rect>
    <rect x="120" y="400" width="14" height="14" transform="rotate(-15 127 407)">
      <animateTransform attributeName="transform" type="rotate" from="-15 127 407" to="345 127 407" dur="44s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- pulsing data dot travelling between nodes -->
  <circle cx="380" cy="225" r="8" fill="#FF4D00" stroke="none">
    <animateMotion dur="10s" repeatCount="indefinite" path="M0 0 L140 -95 L140 95 Z"/>
  </circle>
</svg>
