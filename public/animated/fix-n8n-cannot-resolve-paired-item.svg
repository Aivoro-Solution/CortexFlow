<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="Abstract animation of a broken data chain reconnecting">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#111111" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- cream sheet -->
  <rect x="0" y="0" width="800" height="450" fill="#FFFDF5"/>
  <rect x="0" y="0" width="800" height="450" fill="url(#grid)"/>
  <rect x="14" y="14" width="772" height="422" fill="none" stroke="#111111" stroke-width="3"/>

  <!-- chain spine -->
  <line x1="120" y1="225" x2="680" y2="225" stroke="#111111" stroke-width="4" stroke-linecap="round"/>

  <!-- node 1 -->
  <g>
    <rect x="100" y="195" width="60" height="60" fill="#FFFDF5" stroke="#111111" stroke-width="3"/>
    <rect x="112" y="207" width="36" height="10" fill="#111111"/>
    <rect x="112" y="227" width="36" height="10" fill="#111111"/>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -6; 0 0" dur="9s" repeatCount="indefinite"/>
  </g>

  <!-- node 2 -->
  <g>
    <rect x="230" y="195" width="60" height="60" fill="#FFFDF5" stroke="#111111" stroke-width="3"/>
    <circle cx="260" cy="225" r="14" fill="none" stroke="#111111" stroke-width="3"/>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 6; 0 0" dur="11s" repeatCount="indefinite"/>
  </g>

  <!-- broken link: two halves drifting apart and back together -->
  <g>
    <path d="M 300 225 L 330 225" stroke="#FF4D00" stroke-width="6" stroke-linecap="round">
      <animate attributeName="opacity" values="1; 0.25; 1" dur="8s" repeatCount="indefinite"/>
    </path>
    <g>
      <rect x="330" y="213" width="34" height="24" rx="12" fill="#FF4D00" stroke="#111111" stroke-width="3"/>
      <animateTransform attributeName="transform" type="translate" values="0 0; -14 0; 0 0" dur="8s" repeatCount="indefinite"/>
    </g>
    <g>
      <rect x="386" y="213" width="34" height="24" rx="12" fill="#FFFDF5" stroke="#111111" stroke-width="3"/>
      <animateTransform attributeName="transform" type="translate" values="0 0; 14 0; 0 0" dur="8s" repeatCount="indefinite"/>
    </g>
    <path d="M 430 225 L 460 225" stroke="#111111" stroke-width="4" stroke-linecap="round" stroke-dasharray="8 6">
      <animate attributeName="stroke-dashoffset" values="0; -28" dur="7s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- node 3 -->
  <g>
    <rect x="470" y="195" width="60" height="60" fill="#FFFDF5" stroke="#111111" stroke-width="3"/>
    <rect x="482" y="207" width="36" height="10" fill="#111111"/>
    <rect x="482" y="227" width="36" height="10" fill="#FF4D00"/>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -6; 0 0" dur="10s" repeatCount="indefinite"/>
  </g>

  <!-- node 4 -->
  <g>
    <rect x="600" y="195" width="60" height="60" fill="#111111" stroke="#111111" stroke-width="3"/>
    <circle cx="630" cy="225" r="12" fill="#FF4D00"/>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 6; 0 0" dur="12s" repeatCount="indefinite"/>
  </g>

  <!-- travelling signal dot along the spine -->
  <circle cx="0" cy="0" r="7" fill="#FF4D00" stroke="#111111" stroke-width="2">
    <animateMotion dur="14s" repeatCount="indefinite" path="M 130 225 L 670 225"/>
  </circle>

  <!-- slow rotating ring around node 2 -->
  <g>
    <circle cx="260" cy="225" r="46" fill="none" stroke="#111111" stroke-width="2" stroke-dasharray="10 14"/>
    <animateTransform attributeName="transform" type="rotate" from="0 260 225" to="360 260 225" dur="45s" repeatCount="indefinite"/>
  </g>

  <!-- drifting fragments from the break -->
  <g>
    <rect x="352" y="150" width="12" height="12" fill="#FF4D00" stroke="#111111" stroke-width="2"/>
    <animateTransform attributeName="transform" type="translate" values="0 0; 8 -10; 0 0" dur="8s" repeatCount="indefinite"/>
  </g>
  <g>
    <rect x="398" y="300" width="10" height="10" fill="#FFFDF5" stroke="#111111" stroke-width="2"/>
    <animateTransform attributeName="transform" type="translate" values="0 0; -8 10; 0 0" dur="9s" repeatCount="indefinite"/>
  </g>
</svg>
