<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <rect x="0" y="0" width="800" height="450" fill="#FFFDF5"/>
  <g stroke="#111111" stroke-width="1" opacity="0.18">
    <path d="M0 45 H800 M0 90 H800 M0 135 H800 M0 180 H800 M0 225 H800 M0 270 H800 M0 315 H800 M0 360 H800 M0 405 H800"/>
    <path d="M80 0 V450 M160 0 V450 M240 0 V450 M320 0 V450 M400 0 V450 M480 0 V450 M560 0 V450 M640 0 V450 M720 0 V450"/>
  </g>
  <rect x="14" y="14" width="772" height="422" fill="none" stroke="#111111" stroke-width="5"/>
  <!-- envelope: sends become clicks -->
  <g stroke="#111111" stroke-width="5" fill="none">
    <rect x="90" y="150" width="180" height="120" fill="#FFFDF5"/>
    <path d="M90 150 L180 235 L270 150"/>
  </g>
  <rect x="110" y="296" width="140" height="12" fill="#111111">
    <animate attributeName="width" values="140;60;140" dur="9s" repeatCount="indefinite"/>
  </rect>
  <!-- data packets flowing from envelope to target -->
  <g fill="#111111">
    <rect x="300" y="198" width="18" height="18">
      <animate attributeName="x" values="300;560;300" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.2;1" dur="12s" repeatCount="indefinite"/>
    </rect>
    <rect x="340" y="212" width="14" height="14">
      <animate attributeName="x" values="340;600;340" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.2;1" dur="12s" repeatCount="indefinite"/>
    </rect>
    <rect x="380" y="188" width="12" height="12">
      <animate attributeName="x" values="380;640;380" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.2;1" dur="12s" repeatCount="indefinite"/>
    </rect>
  </g>
  <!-- engagement target -->
  <g stroke="#111111" stroke-width="5" fill="none">
    <circle cx="640" cy="205" r="58"/>
    <circle cx="640" cy="205" r="30"/>
  </g>
  <circle cx="640" cy="205" r="58" fill="none" stroke="#FF4D00" stroke-width="4">
    <animate attributeName="r" values="58;88" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.9;0" dur="7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="640" cy="205" r="12" fill="#FF4D00" stroke="#111111" stroke-width="4">
    <animate attributeName="r" values="10;14;10" dur="6s" repeatCount="indefinite"/>
  </circle>
  <!-- cursor arrow nudging toward the target -->
  <g>
    <path d="M560 300 L620 260 L606 292 L630 294 L642 262 L652 296 L628 296 L642 328 Z" fill="#FF4D00" stroke="#111111" stroke-width="5"/>
    <animateTransform attributeName="transform" type="translate" values="0 0;-14 -10;0 0" dur="10s" repeatCount="indefinite"/>
  </g>
  <!-- outcome bars rising slowly -->
  <g fill="#FFFDF5" stroke="#111111" stroke-width="5">
    <rect x="420" y="330" width="44" height="80">
      <animate attributeName="height" values="80;50;80" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="y" values="330;360;330" dur="8s" repeatCount="indefinite"/>
    </rect>
    <rect x="478" y="300" width="44" height="110">
      <animate attributeName="height" values="110;140;110" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="y" values="300;270;300" dur="8s" repeatCount="indefinite"/>
    </rect>
    <rect x="536" y="345" width="44" height="65" fill="#FF4D00">
      <animate attributeName="height" values="65;120;65" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="y" values="345;290;345" dur="8s" repeatCount="indefinite"/>
    </rect>
  </g>
  <!-- rising outcome arrow, slow -->
  <path d="M90 120 L200 60 L330 95 L470 40" fill="none" stroke="#FF4D00" stroke-width="6" stroke-dasharray="18 12">
    <animate attributeName="stroke-dashoffset" values="0;-120" dur="14s" repeatCount="indefinite"/>
  </path>
  <g fill="#111111">
    <circle cx="90" cy="120" r="7"/>
    <circle cx="200" cy="60" r="7"/>
    <circle cx="330" cy="95" r="7"/>
    <circle cx="470" cy="40" r="7">
      <animate attributeName="r" values="7;10;7" dur="6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
