<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Schematic: an AI agent core with tool connections behind a human-in-the-loop guardrail barrier">
  <defs>
    <pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#111" stroke-width="0.4" opacity="0.25"/>
    </pattern>
  </defs>

  <!-- cream sheet + fine grid -->
  <rect x="0" y="0" width="800" height="450" fill="#FFFDF5"/>
  <rect x="0" y="0" width="800" height="450" fill="url(#grid)"/>
  <rect x="12" y="12" width="776" height="426" fill="none" stroke="#111" stroke-width="3"/>

  <!-- network nodes (left): tool endpoints the agent can reach -->
  <g stroke="#111" stroke-width="3" fill="#FFFDF5">
    <circle cx="110" cy="120" r="26"/>
    <circle cx="110" cy="240" r="26"/>
    <circle cx="110" cy="360" r="26"/>
  </g>
  <circle cx="110" cy="120" r="8" fill="#FF4D00"/>
  <circle cx="110" cy="240" r="8" fill="#FF4D00"/>
  <circle cx="110" cy="360" r="8" fill="#111"/>
  <!-- pulsing signal on two active tools (slow) -->
  <circle cx="110" cy="120" r="26" fill="none" stroke="#FF4D00" stroke-width="3">
    <animate attributeName="r" values="26;40;26" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.9;0.1;0.9" dur="6s" repeatCount="indefinite"/>
  </circle>

  <!-- central agent core -->
  <rect x="300" y="170" width="140" height="110" fill="#FFFDF5" stroke="#111" stroke-width="4"/>
  <circle cx="370" cy="225" r="28" fill="#FF4D00" stroke="#111" stroke-width="4">
    <animate attributeName="r" values="28;34;28" dur="7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="370" cy="225" r="10" fill="#FFFDF5"/>

  <!-- orbiting check layer: policy satellites slowly rotate around the core -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 370 225" to="360 370 225" dur="40s" repeatCount="indefinite"/>
    <g stroke="#111" stroke-width="3" fill="#FFFDF5">
      <rect x="252" y="207" width="36" height="36"/>
      <rect x="452" y="207" width="36" height="36"/>
      <circle cx="370" cy="107" r="18"/>
      <circle cx="370" cy="343" r="18"/>
    </g>
    <path d="M 266 225 l 8 8 l 14 -16" fill="none" stroke="#FF4D00" stroke-width="3"/>
    <path d="M 466 225 l 8 8 l 14 -16" fill="none" stroke="#FF4D00" stroke-width="3"/>
  </g>

  <!-- connection lines: tools -> core -->
  <g stroke="#111" stroke-width="3" fill="none">
    <line x1="136" y1="132" x2="300" y2="200"/>
    <line x1="136" y1="240" x2="300" y2="240"/>
    <line x1="136" y1="348" x2="300" y2="280"/>
  </g>

  <!-- guardrail barrier (right of core): striped gate arm that slowly raises and lowers -->
  <g>
    <rect x="520" y="120" width="18" height="210" fill="#111"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0 529 130; 22 529 130; 0 529 130" dur="12s" repeatCount="indefinite"/>
      <rect x="529" y="118" width="180" height="24" fill="#FFFDF5" stroke="#111" stroke-width="3"/>
      <g fill="#FF4D00">
        <rect x="543" y="121" width="18" height="18"/>
        <rect x="573" y="121" width="18" height="18"/>
        <rect x="603" y="121" width="18" height="18"/>
        <rect x="633" y="121" width="18" height="18"/>
        <rect x="663" y="121" width="18" height="18"/>
      </g>
    </g>
  </g>

  <!-- blocked action packets drifting toward the barrier (slow) -->
  <g fill="none" stroke="#FF4D00" stroke-width="3">
    <rect x="470" y="214" width="22" height="22">
      <animate attributeName="x" values="470;505;470" dur="9s" repeatCount="indefinite"/>
    </rect>
    <rect x="470" y="260" width="22" height="22">
      <animate attributeName="x" values="470;505;470" dur="11s" repeatCount="indefinite"/>
    </rect>
  </g>
  <!-- alert ticks on the barrier -->
  <g stroke="#FF4D00" stroke-width="4">
    <line x1="620" y1="330" x2="620" y2="352"/>
    <line x1="660" y1="330" x2="660" y2="352"/>
  </g>

</svg>
