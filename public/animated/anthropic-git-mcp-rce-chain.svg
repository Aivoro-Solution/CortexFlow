<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Abstract animated git-branch chain with a cracked link">
  <rect x="0" y="0" width="800" height="450" fill="#FFFDF5"/>
  <defs>
    <pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#111" stroke-width="0.4" opacity="0.18"/>
    </pattern>
  </defs>
  <rect x="0" y="0" width="800" height="450" fill="url(#grid)"/>

  <!-- main branch line -->
  <path d="M 60 225 H 740" fill="none" stroke="#111" stroke-width="4"/>

  <!-- commit nodes drifting slowly -->
  <g>
    <circle cx="140" cy="225" r="14" fill="#FFFDF5" stroke="#111" stroke-width="4"/>
    <animateTransform attributeName="transform" type="translate" values="0 0; 8 0; 0 0" dur="9s" repeatCount="indefinite"/>
  </g>
  <g>
    <circle cx="300" cy="225" r="14" fill="#FFFDF5" stroke="#111" stroke-width="4"/>
    <animateTransform attributeName="transform" type="translate" values="0 0; -6 0; 0 0" dur="11s" repeatCount="indefinite"/>
  </g>

  <!-- cracked chain link (the vulnerability) — pulsing orange -->
  <g transform="translate(480,225)">
    <rect x="-34" y="-20" width="30" height="40" rx="14" fill="none" stroke="#111" stroke-width="6"/>
    <rect x="4" y="-20" width="30" height="40" rx="14" fill="none" stroke="#FF4D00" stroke-width="6">
      <animate attributeName="stroke" values="#FF4D00;#111;#FF4D00" dur="7s" repeatCount="indefinite"/>
    </rect>
    <!-- crack in the orange link -->
    <line x1="18" y1="-20" x2="22" y2="20" stroke="#FFFDF5" stroke-width="5"/>
    <circle cx="20" cy="0" r="7" fill="#FF4D00" opacity="0.85">
      <animate attributeName="r" values="7;10;7" dur="6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- side branch arcing above, connecting back -->
  <path d="M 620 225 C 660 160, 700 160, 740 225" fill="none" stroke="#111" stroke-width="4"/>
  <circle cx="688" cy="178" r="12" fill="#FF4D00" stroke="#111" stroke-width="4">
    <animateMotion path="M 620 225 C 660 160, 700 160, 740 225" dur="14s" repeatCount="indefinite"/>
  </circle>

  <!-- code-execution ripple emanating from the crack -->
  <circle cx="500" cy="225" r="10" fill="none" stroke="#FF4D00" stroke-width="4" opacity="0.9">
    <animate attributeName="r" values="10;90;10" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.9;0;0.9" dur="12s" repeatCount="indefinite"/>
  </circle>
  <circle cx="500" cy="225" r="10" fill="none" stroke="#111" stroke-width="3" opacity="0.5">
    <animate attributeName="r" values="10;70;10" dur="16s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0;0.5" dur="16s" repeatCount="indefinite"/>
  </circle>

  <!-- slow-rotating gear hint at the edge -->
  <g transform="translate(80,90)">
    <circle r="26" fill="none" stroke="#111" stroke-width="4"/>
    <g>
      <line x1="-26" y1="0" x2="26" y2="0" stroke="#111" stroke-width="4"/>
      <line x1="0" y1="-26" x2="0" y2="26" stroke="#111" stroke-width="4"/>
      <line x1="-18" y1="-18" x2="18" y2="18" stroke="#111" stroke-width="4"/>
      <line x1="-18" y1="18" x2="18" y2="-18" stroke="#111" stroke-width="4"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="40s" repeatCount="indefinite"/>
    </g>
    <circle r="8" fill="#FF4D00"/>
  </g>
</svg>
