<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Abstract radar scan detecting exposed server nodes">
  <!-- cream background -->
  <rect x="0" y="0" width="800" height="450" fill="#FFFDF5"/>
  <!-- fine grid -->
  <g stroke="#111111" stroke-width="1" opacity="0.08">
    <path d="M40 0V450M80 0V450M120 0V450M160 0V450M200 0V450M240 0V450M280 0V450M320 0V450M360 0V450M400 0V450M440 0V450M480 0V450M520 0V450M560 0V450M600 0V450M640 0V450M680 0V450M720 0V450M760 0V450"/>
    <path d="M0 40H800M0 80H800M0 120H800M0 160H800M0 200H800M0 240H800M0 280H800M0 320H800M0 360H800M0 400H800"/>
  </g>
  <!-- outer frame, thick black border -->
  <rect x="12" y="12" width="776" height="426" fill="none" stroke="#111111" stroke-width="4"/>
  <!-- scattered server node blocks (abstract rectangles) -->
  <g stroke="#111111" stroke-width="3" fill="#FFFDF5">
    <rect x="90" y="70" width="70" height="46"/>
    <rect x="200" y="150" width="70" height="46"/>
    <rect x="120" y="280" width="70" height="46"/>
    <rect x="330" y="90" width="70" height="46"/>
    <rect x="620" y="120" width="70" height="46"/>
    <rect x="560" y="300" width="70" height="46"/>
    <rect x="660" y="250" width="70" height="46"/>
    <rect x="420" y="330" width="70" height="46"/>
    <rect x="250" y="340" width="70" height="46"/>
  </g>
  <!-- one exposed node glowing orange, slow pulse -->
  <g>
    <rect x="620" y="120" width="70" height="46" fill="#FF4D00" stroke="#111111" stroke-width="3" opacity="0.85">
      <animate attributeName="opacity" values="0.85;0.35;0.85" dur="8s" repeatCount="indefinite"/>
    </rect>
    <circle cx="655" cy="143" r="60" fill="none" stroke="#FF4D00" stroke-width="2">
      <animate attributeName="r" values="24;92" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0" dur="7s" repeatCount="indefinite"/>
    </circle>
  </g>
  <!-- radar sweep: slow rotating wedge from center -->
  <g opacity="0.55">
    <g>
      <path d="M400 225 L400 45 A180 180 0 0 1 527 98 Z" fill="#FF4D00" opacity="0.25"/>
      <line x1="400" y1="225" x2="400" y2="45" stroke="#111111" stroke-width="3"/>
      <animateTransform attributeName="transform" type="rotate" from="0 400 225" to="360 400 225" dur="36s" repeatCount="indefinite"/>
    </g>
    <!-- concentric radar rings -->
    <circle cx="400" cy="225" r="60" fill="none" stroke="#111111" stroke-width="2"/>
    <circle cx="400" cy="225" r="120" fill="none" stroke="#111111" stroke-width="2"/>
    <circle cx="400" cy="225" r="180" fill="none" stroke="#111111" stroke-width="2"/>
    <circle cx="400" cy="225" r="6" fill="#111111"/>
  </g>
  <!-- drifting scan line across the grid, slow -->
  <rect x="0" y="0" width="3" height="450" fill="#111111" opacity="0.25">
    <animate attributeName="x" values="20;780;20" dur="18s" repeatCount="indefinite"/>
  </rect>
  <!-- blinking signal dots on safe nodes, slow -->
  <g fill="#111111">
    <circle cx="125" cy="93" r="4">
      <animate attributeName="opacity" values="1;0.15;1" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="235" cy="173" r="4">
      <animate attributeName="opacity" values="0.15;1;0.15" dur="11s" repeatCount="indefinite"/>
    </circle>
    <circle cx="365" cy="113" r="4">
      <animate attributeName="opacity" values="1;0.15;1" dur="13s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
