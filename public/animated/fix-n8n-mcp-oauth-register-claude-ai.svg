<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="Animated schematic: a registration token travels from a public tunnel to a server gate that first rejects it, then accepts it">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#111111" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- sheet -->
  <rect x="0" y="0" width="800" height="450" fill="#FFFDF5"/>
  <rect x="0" y="0" width="800" height="450" fill="url(#grid)"/>
  <rect x="14" y="14" width="772" height="422" fill="none" stroke="#111111" stroke-width="3"/>

  <!-- tunnel (left): public entry -->
  <g stroke="#111111" stroke-width="3" fill="none">
    <path d="M 90 300 L 90 150 Q 90 110 130 110 L 210 110 Q 250 110 250 150 L 250 300 Q 250 340 210 340 L 130 340 Q 90 340 90 300 Z"/>
    <path d="M 130 150 L 130 300" stroke-width="2"/>
    <path d="M 170 150 L 170 300" stroke-width="2"/>
    <path d="M 210 150 L 210 300" stroke-width="2"/>
  </g>
  <circle cx="170" cy="225" r="26" fill="#FF4D00" stroke="#111111" stroke-width="3">
    <animate attributeName="r" values="26;30;26" dur="6s" repeatCount="indefinite"/>
  </circle>

  <!-- cable from tunnel to gate -->
  <path d="M 250 225 L 470 225" stroke="#111111" stroke-width="3" fill="none" stroke-dasharray="10 8">
    <animate attributeName="stroke-dashoffset" values="0;-72" dur="6s" repeatCount="indefinite"/>
  </path>

  <!-- token envelope travelling along the cable -->
  <g>
    <rect x="-14" y="-10" width="28" height="20" fill="#FFFDF5" stroke="#111111" stroke-width="2.5"/>
    <path d="M -14 -10 L 0 2 L 14 -10" fill="none" stroke="#111111" stroke-width="2"/>
    <animateMotion dur="12s" repeatCount="indefinite" path="M 250 225 L 470 225" keyPoints="0;1" keyTimes="0;1" calcMode="linear"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.92;1" dur="12s" repeatCount="indefinite"/>
  </g>

  <!-- gate (right): server -->
  <g stroke="#111111" stroke-width="3" fill="none">
    <rect x="470" y="110" width="240" height="230" fill="#FFFDF5"/>
    <path d="M 470 170 L 710 170" stroke-width="2"/>
    <path d="M 470 280 L 710 280" stroke-width="2"/>
    <path d="M 550 110 L 550 340" stroke-width="2"/>
    <path d="M 630 110 L 630 340" stroke-width="2"/>
  </g>

  <!-- gate bars sliding open/closed slowly -->
  <g stroke="#FF4D00" stroke-width="6">
    <line x1="590" y1="110" x2="590" y2="340">
      <animate attributeName="x1" values="590;606;590" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="590;606;590" dur="12s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- status lamp on the gate -->
  <circle cx="680" cy="140" r="12" fill="#FF4D00" stroke="#111111" stroke-width="3">
    <animate attributeName="fill" values="#FF4D00;#111111;#FF4D00" keyTimes="0;0.5;1" dur="12s" repeatCount="indefinite"/>
  </circle>

  <!-- small orbiting dot around the lamp (slow rotation) -->
  <g>
    <circle cx="680" cy="116" r="4" fill="#111111"/>
    <animateTransform attributeName="transform" type="rotate" from="0 680 140" to="360 680 140" dur="30s" repeatCount="indefinite"/>
  </g>

  <!-- rejected token bouncing back (faint, slow) -->
  <g opacity="0.55">
    <rect x="-12" y="-9" width="24" height="18" fill="#FFFDF5" stroke="#111111" stroke-width="2"/>
    <path d="M -12 -9 L 0 1 L 12 -9" fill="none" stroke="#111111" stroke-width="1.8"/>
    <animateMotion dur="12s" repeatCount="indefinite" path="M 470 260 L 330 260" keyPoints="0;1" keyTimes="0;1" calcMode="linear"/>
    <animate attributeName="opacity" values="0;0.55;0.55;0" keyTimes="0;0.1;0.9;1" dur="12s" repeatCount="indefinite"/>
  </g>

  <!-- slow rotating gear accent, bottom right -->
  <g transform="translate(680 380)" stroke="#111111" stroke-width="2.5" fill="none">
    <circle r="18"/>
    <path d="M 0 -26 L 0 -18 M 0 18 L 0 26 M -26 0 L -18 0 M 18 0 L 26 0 M -18 -18 L -13 -13 M 18 18 L 13 13 M 18 -18 L 13 -13 M -18 18 L -13 13"/>
    <animateTransform attributeName="transform" type="rotate" from="0 680 380" to="360 680 380" dur="36s" repeatCount="indefinite"/>
  </g>

  <!-- baseline -->
  <line x1="60" y1="400" x2="740" y2="400" stroke="#111111" stroke-width="2"/>
</svg>
