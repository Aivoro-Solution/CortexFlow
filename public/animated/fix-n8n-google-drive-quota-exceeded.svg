<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Animated schematic: usage bars rise toward an orange quota limit line while a gauge needle sweeps">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#111111" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- paper -->
  <rect x="0" y="0" width="800" height="450" fill="#FFFDF5"/>
  <rect x="0" y="0" width="800" height="450" fill="url(#grid)"/>
  <rect x="14" y="14" width="772" height="422" fill="none" stroke="#111111" stroke-width="3"/>

  <!-- cloud made of flat blocks (left) -->
  <g stroke="#111111" stroke-width="4" fill="#FFFDF5">
    <rect x="80" y="120" width="150" height="70"/>
    <rect x="150" y="80" width="130" height="60"/>
    <rect x="230" y="130" width="110" height="60"/>
    <rect x="110" y="180" width="170" height="50"/>
  </g>
  <circle cx="215" cy="115" r="7" fill="#FF4D00">
    <animate attributeName="opacity" values="1;0.25;1" dur="6s" repeatCount="indefinite"/>
  </circle>

  <!-- gauge arc (right) -->
  <g fill="none" stroke="#111111" stroke-width="5">
    <path d="M 480 300 A 110 110 0 0 1 700 300"/>
    <path d="M 500 300 A 90 90 0 0 1 680 300" stroke-width="3"/>
  </g>
  <!-- gauge needle, slow sweep -->
  <g>
    <line x1="590" y1="300" x2="590" y2="205" stroke="#FF4D00" stroke-width="6" stroke-linecap="round"/>
    <circle cx="590" cy="300" r="10" fill="#111111"/>
    <animateTransform attributeName="transform" type="rotate" values="-55 590 300; 55 590 300; -55 590 300" dur="36s" repeatCount="indefinite"/>
  </g>
  <!-- slow rotating dashed ring around the gauge -->
  <g>
    <circle cx="590" cy="300" r="132" fill="none" stroke="#FF4D00" stroke-width="3" stroke-dasharray="12 10"/>
    <animateTransform attributeName="transform" type="rotate" from="0 590 300" to="360 590 300" dur="45s" repeatCount="indefinite"/>
  </g>

  <!-- quota limit line -->
  <line x1="60" y1="330" x2="740" y2="330" stroke="#FF4D00" stroke-width="5"/>
  <circle cx="740" cy="330" r="7" fill="#FF4D00">
    <animate attributeName="opacity" values="1;0.3;1" dur="7s" repeatCount="indefinite"/>
  </circle>

  <!-- usage bars rising toward the limit -->
  <g fill="#111111">
    <rect x="90" y="370" width="44" height="40">
      <animate attributeName="height" values="40;58;40" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="y" values="370;352;370" dur="8s" repeatCount="indefinite"/>
    </rect>
    <rect x="160" y="350" width="44" height="60">
      <animate attributeName="height" values="60;78;60" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="y" values="350;332;350" dur="9s" repeatCount="indefinite"/>
    </rect>
    <rect x="230" y="330" width="44" height="80">
      <animate attributeName="height" values="80;96;80" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="y" values="330;314;330" dur="7s" repeatCount="indefinite"/>
    </rect>
    <rect x="300" y="310" width="44" height="100">
      <animate attributeName="height" values="100;118;100" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="y" values="310;292;310" dur="10s" repeatCount="indefinite"/>
    </rect>
    <rect x="370" y="290" width="44" height="120" fill="#FF4D00">
      <animate attributeName="height" values="120;136;120" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="y" values="290;274;290" dur="8s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- drifting dots -->
  <g fill="#111111">
    <circle cx="480" cy="90" r="5">
      <animate attributeName="cy" values="90;115;90" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="720" cy="130" r="5" fill="#FF4D00">
      <animate attributeName="cx" values="720;690;720" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="90" cy="400" r="5">
      <animate attributeName="cx" values="90;140;90" dur="9s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
