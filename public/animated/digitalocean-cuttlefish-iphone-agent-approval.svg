<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Abstract animation: an agent's tool-call cards travel along a conveyor toward a phone with a pulsing orange approval button">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#111111" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- paper -->
  <rect width="800" height="450" fill="#FFFDF5"/>
  <rect width="800" height="450" fill="url(#grid)"/>

  <!-- frame -->
  <rect x="14" y="14" width="772" height="422" fill="none" stroke="#111111" stroke-width="3"/>

  <!-- cloud server block (top left) -->
  <g stroke="#111111" stroke-width="3" fill="#FFFDF5">
    <rect x="70" y="70" width="150" height="46" rx="4"/>
    <rect x="70" y="126" width="150" height="46" rx="4"/>
    <line x1="90" y1="93" x2="130" y2="93" stroke-width="2"/>
    <line x1="90" y1="149" x2="130" y2="149" stroke-width="2"/>
    <circle cx="200" cy="93" r="6" fill="#FF4D00" stroke="none">
      <animate attributeName="opacity" values="1;0.25;1" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="200" cy="149" r="6" fill="#FF4D00" stroke="none">
      <animate attributeName="opacity" values="0.25;1;0.25" dur="6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- conveyor belt -->
  <g stroke="#111111" stroke-width="3" fill="#FFFDF5">
    <rect x="70" y="300" width="330" height="34" rx="17"/>
    <circle cx="100" cy="317" r="9" fill="none"/>
    <circle cx="370" cy="317" r="9" fill="none"/>
    <circle cx="100" cy="317" r="3" fill="#111111" stroke="none"/>
    <circle cx="370" cy="317" r="3" fill="#111111" stroke="none"/>
  </g>

  <!-- tool-call cards riding the belt -->
  <g stroke="#111111" stroke-width="3" fill="#FFFDF5">
    <rect x="120" y="262" width="40" height="38" rx="3">
      <animate attributeName="x" values="120;330;120" dur="18s" repeatCount="indefinite"/>
    </rect>
    <rect x="200" y="262" width="40" height="38" rx="3">
      <animate attributeName="x" values="200;330;200" dur="18s" begin="6s" repeatCount="indefinite"/>
    </rect>
    <rect x="280" y="262" width="40" height="38" rx="3">
      <animate attributeName="x" values="280;330;280" dur="18s" begin="12s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- dashed path from server to phone -->
  <path d="M 220 172 L 220 240 L 520 240" fill="none" stroke="#111111" stroke-width="2" stroke-dasharray="8 8">
    <animate attributeName="stroke-dashoffset" values="0;-64" dur="8s" repeatCount="indefinite"/>
  </path>

  <!-- phone -->
  <g>
    <rect x="500" y="90" width="180" height="300" rx="24" fill="#FFFDF5" stroke="#111111" stroke-width="4"/>
    <rect x="520" y="112" width="140" height="190" rx="8" fill="none" stroke="#111111" stroke-width="2"/>
    <line x1="560" y1="104" x2="620" y2="104" stroke="#111111" stroke-width="3"/>
    <!-- approval button -->
    <circle cx="590" cy="207" r="42" fill="#FF4D00" stroke="#111111" stroke-width="4">
      <animate attributeName="r" values="42;48;42" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="590" cy="207" r="58" fill="none" stroke="#FF4D00" stroke-width="2">
      <animate attributeName="opacity" values="0.9;0.1;0.9" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="r" values="52;66;52" dur="6s" repeatCount="indefinite"/>
    </circle>
    <!-- check mark -->
    <path d="M 572 207 L 585 220 L 610 192" fill="none" stroke="#FFFDF5" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- deny bar -->
    <rect x="540" y="330" width="100" height="14" rx="7" fill="#111111">
      <animate attributeName="opacity" values="1;0.35;1" dur="9s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- orbiting signal dot around the phone -->
  <g>
    <circle cx="590" cy="60" r="8" fill="#FF4D00" stroke="#111111" stroke-width="2">
      <animateTransform attributeName="transform" type="rotate" from="0 590 240" to="360 590 240" dur="30s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- slow drifting accent shapes -->
  <g>
    <circle cx="720" cy="90" r="26" fill="#FF4D00" stroke="#111111" stroke-width="3">
      <animate attributeName="cy" values="90;120;90" dur="12s" repeatCount="indefinite"/>
    </circle>
    <rect x="60" y="380" width="60" height="18" fill="none" stroke="#111111" stroke-width="3">
      <animate attributeName="x" values="60;110;60" dur="15s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
