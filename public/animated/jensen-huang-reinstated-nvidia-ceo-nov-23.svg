<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="Abstract animation: a chip with a return arrow and a market line plunging then rising">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#111111" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- paper -->
  <rect x="0" y="0" width="800" height="450" fill="#FFFDF5"/>
  <rect x="0" y="0" width="800" height="450" fill="url(#grid)"/>
  <rect x="6" y="6" width="788" height="438" fill="none" stroke="#111111" stroke-width="3"/>

  <!-- market line: plunges, then rockets back up -->
  <g fill="none" stroke="#111111" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
    <path d="M 60 120 L 150 128 L 240 118 L 300 190 L 360 260 L 420 300 L 480 210 L 540 150 L 620 110 L 740 78">
      <animate attributeName="stroke-dasharray" values="0 1200; 1200 0" dur="12s" repeatCount="indefinite"/>
    </path>
  </g>
  <circle cx="420" cy="300" r="7" fill="#FF4D00" stroke="#111111" stroke-width="3">
    <animate attributeName="r" values="7;10;7" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="740" cy="78" r="7" fill="#FF4D00" stroke="#111111" stroke-width="3">
    <animate attributeName="r" values="7;10;7" dur="6s" begin="3s" repeatCount="indefinite"/>
  </circle>

  <!-- GPU chip -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -8; 0 0" dur="9s" repeatCount="indefinite"/>
    <rect x="330" y="180" width="140" height="140" fill="#FFFDF5" stroke="#111111" stroke-width="4"/>
    <rect x="352" y="202" width="96" height="96" fill="none" stroke="#111111" stroke-width="3"/>
    <rect x="372" y="222" width="56" height="56" fill="#FF4D00" stroke="#111111" stroke-width="3"/>
    <g stroke="#111111" stroke-width="3" stroke-linecap="round">
      <line x1="350" y1="200" x2="350" y2="180"/><line x1="375" y1="200" x2="375" y2="180"/><line x1="400" y1="200" x2="400" y2="180"/><line x1="425" y1="200" x2="425" y2="180"/><line x1="450" y1="200" x2="450" y2="180"/>
      <line x1="350" y1="300" x2="350" y2="320"/><line x1="375" y1="300" x2="375" y2="320"/><line x1="400" y1="300" x2="400" y2="320"/><line x1="425" y1="300" x2="425" y2="320"/><line x1="450" y1="300" x2="450" y2="320"/>
      <line x1="330" y1="210" x2="310" y2="210"/><line x1="330" y1="240" x2="310" y2="240"/><line x1="330" y1="270" x2="310" y2="270"/><line x1="330" y1="300" x2="310" y2="300"/>
      <line x1="470" y1="210" x2="490" y2="210"/><line x1="470" y1="240" x2="490" y2="240"/><line x1="470" y1="270" x2="490" y2="270"/><line x1="470" y1="300" x2="490" y2="300"/>
    </g>
  </g>

  <!-- return arrow looping back to the chip -->
  <g fill="none" stroke="#FF4D00" stroke-width="4" stroke-linecap="round">
    <path d="M 520 250 A 110 110 0 1 1 480 150">
      <animate attributeName="stroke-dashoffset" values="700; 0" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="stroke-dasharray" values="700 700" dur="12s" repeatCount="indefinite"/>
    </path>
  </g>
  <g>
    <animateTransform attributeName="transform" type="rotate" values="0 400 250; 360 400 250" dur="36s" repeatCount="indefinite"/>
    <polygon points="480,138 496,162 468,162" fill="#FF4D00" stroke="#111111" stroke-width="3" stroke-linejoin="round"/>
  </g>

  <!-- drifting sparks -->
  <g fill="#FF4D00" stroke="#111111" stroke-width="2">
    <circle cx="140" cy="330" r="5">
      <animate attributeName="cy" values="330; 300; 330" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1; 0.4; 1" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="660" cy="330" r="5">
      <animate attributeName="cy" values="330; 302; 330" dur="8s" begin="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1; 0.4; 1" dur="8s" begin="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="600" cy="120" r="4">
      <animate attributeName="cy" values="120; 96; 120" dur="6s" begin="1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1; 0.4; 1" dur="6s" begin="1s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
