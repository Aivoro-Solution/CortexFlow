<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#E8E2D0" stroke-width="1"/>
    </pattern>
    <clipPath id="radarClip">
      <circle cx="400" cy="170" r="86"/>
    </clipPath>
  </defs>

  <rect width="800" height="450" fill="#FFFDF5"/>
  <rect width="800" height="450" fill="url(#grid)"/>

  <!-- thick border frame -->
  <rect x="10" y="10" width="780" height="430" fill="none" stroke="#111111" stroke-width="6"/>

  <!-- orbit ring, very slow rotation -->
  <circle cx="400" cy="170" r="132" fill="none" stroke="#111111" stroke-width="3" stroke-dasharray="14 18">
    <animateTransform attributeName="transform" type="rotate" from="0 400 170" to="360 400 170" dur="48s" repeatCount="indefinite"/>
  </circle>

  <!-- watcher eye (the agent that only observes) -->
  <circle cx="400" cy="170" r="104" fill="#FFFFFF" stroke="#111111" stroke-width="6"/>
  <g clip-path="url(#radarClip)">
    <g>
      <path d="M 400 170 L 400 84 A 86 86 0 0 1 461 107 Z" fill="#FF4D00" opacity="0.30"/>
      <animateTransform attributeName="transform" type="rotate" from="0 400 170" to="360 400 170" dur="32s" repeatCount="indefinite"/>
    </g>
  </g>
  <circle cx="400" cy="170" r="26" fill="#111111"/>
  <circle cx="400" cy="170" r="11" fill="#FF4D00">
    <animate attributeName="r" values="11;14;11" dur="8s" repeatCount="indefinite"/>
  </circle>

  <!-- sight lines from the eye down to each cabin -->
  <g stroke="#111111" stroke-width="2.5" opacity="0.45">
    <line x1="400" y1="274" x2="160" y2="330">
      <animate attributeName="opacity" values="0.45;0.15;0.45" dur="10s" repeatCount="indefinite"/>
    </line>
    <line x1="400" y1="274" x2="280" y2="330"/>
    <line x1="400" y1="274" x2="400" y2="330">
      <animate attributeName="opacity" values="0.45;0.15;0.45" dur="10s" begin="2s" repeatCount="indefinite"/>
    </line>
    <line x1="400" y1="274" x2="520" y2="330"/>
    <line x1="400" y1="274" x2="640" y2="330">
      <animate attributeName="opacity" values="0.45;0.15;0.45" dur="10s" begin="4s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- row of cabins (the listings being watched) -->
  <g stroke="#111111" stroke-width="4" fill="#FFFFFF">
    <g>
      <rect x="130" y="330" width="60" height="46"/>
      <polygon points="130,330 160,306 190,330"/>
    </g>
    <g>
      <rect x="250" y="330" width="60" height="46"/>
      <polygon points="250,330 280,306 310,330"/>
    </g>
    <g>
      <rect x="370" y="330" width="60" height="46"/>
      <polygon points="370,330 400,306 430,330"/>
    </g>
    <g>
      <rect x="490" y="330" width="60" height="46"/>
      <polygon points="490,330 520,306 550,330"/>
    </g>
    <g>
      <rect x="610" y="330" width="60" height="46"/>
      <polygon points="610,330 640,306 670,330"/>
    </g>
  </g>
  <!-- one flagged cabin: orange roof pulses slowly -->
  <polygon points="490,330 520,306 550,330" fill="#FF4D00" stroke="#111111" stroke-width="4" opacity="0.55">
    <animate attributeName="opacity" values="0.55;1;0.55" dur="12s" repeatCount="indefinite"/>
  </polygon>

  <!-- the human approval stamp: fades in, holds, fades out -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.25;0.75;1" dur="12s" repeatCount="indefinite"/>
    <circle cx="672" cy="112" r="42" fill="none" stroke="#FF4D00" stroke-width="7"/>
    <path d="M 650 112 l 15 15 l 30 -32" fill="none" stroke="#FF4D00" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- drifting data dots, slow -->
  <circle cx="120" cy="120" r="5" fill="#FF4D00" opacity="0.6">
    <animate attributeName="cy" values="120;100;120" dur="9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="96" cy="200" r="4" fill="#111111" opacity="0.5">
    <animate attributeName="cx" values="96;116;96" dur="11s" repeatCount="indefinite"/>
  </circle>
  <circle cx="700" cy="300" r="5" fill="#111111" opacity="0.5">
    <animate attributeName="cy" values="300;322;300" dur="10s" repeatCount="indefinite"/>
  </circle>
  <circle cx="730" cy="180" r="4" fill="#FF4D00" opacity="0.6">
    <animate attributeName="cx" values="730;712;730" dur="12s" repeatCount="indefinite"/>
  </circle>
</svg>
