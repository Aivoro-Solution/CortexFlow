<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Abstract server rack with a checklist line threading through it">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#111111" stroke-width="0.6" opacity="0.12"/>
    </pattern>
  </defs>

  <!-- cream sheet + fine grid -->
  <rect x="0" y="0" width="800" height="450" fill="#FFFDF5"/>
  <rect x="0" y="0" width="800" height="450" fill="url(#grid)"/>

  <!-- thick frame -->
  <rect x="14" y="14" width="772" height="422" fill="none" stroke="#111111" stroke-width="6"/>

  <!-- server rack: three server boxes, abstract -->
  <g stroke="#111111" stroke-width="5" fill="#FFFDF5">
    <rect x="120" y="90" width="220" height="90">
      <animate attributeName="y" values="90;96;90" dur="9s" repeatCount="indefinite"/>
    </rect>
    <rect x="120" y="200" width="220" height="90">
      <animate attributeName="y" values="200;194;200" dur="11s" repeatCount="indefinite"/>
    </rect>
    <!-- the failing unit: orange accent -->
    <rect x="120" y="310" width="220" height="90" fill="#FF4D00">
      <animate attributeName="opacity" values="1;0.55;1" dur="7s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- status lights on the servers -->
  <g fill="#111111">
    <circle cx="150" cy="135" r="7">
      <animate attributeName="opacity" values="1;0.3;1" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="150" cy="245" r="7">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="8s" repeatCount="indefinite"/>
    </circle>
  </g>
  <circle cx="150" cy="355" r="7" fill="#FFFDF5">
    <animate attributeName="opacity" values="1;0.2;1" dur="7s" repeatCount="indefinite"/>
  </circle>

  <!-- vent lines on servers -->
  <g stroke="#111111" stroke-width="3" opacity="0.7">
    <line x1="200" y1="125" x2="310" y2="125"/>
    <line x1="200" y1="145" x2="310" y2="145"/>
    <line x1="200" y1="235" x2="310" y2="235"/>
    <line x1="200" y1="255" x2="310" y2="255"/>
  </g>

  <!-- checklist panel, right side -->
  <g stroke="#111111" stroke-width="5" fill="#FFFDF5">
    <rect x="440" y="90" width="240" height="310"/>
  </g>
  <!-- checkboxes, checking one by one in a slow loop -->
  <g stroke="#111111" stroke-width="5" fill="none">
    <rect x="470" y="125" width="34" height="34"/>
    <rect x="470" y="185" width="34" height="34"/>
    <rect x="470" y="245" width="34" height="34"/>
    <rect x="470" y="305" width="34" height="34"/>
  </g>
  <g stroke="#FF4D00" stroke-width="7" fill="none" stroke-linecap="round">
    <path d="M476 142 l10 12 l18 -26" opacity="1">
      <animate attributeName="opacity" values="1;1;0;0;1;1" keyTimes="0;0.2;0.25;0.75;0.8;1" dur="24s" repeatCount="indefinite"/>
    </path>
    <path d="M476 202 l10 12 l18 -26" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.2;0.25;0.45;0.5;1" dur="24s" repeatCount="indefinite"/>
    </path>
    <path d="M476 262 l10 12 l18 -26" opacity="0">
      <animate attributeName="opacity" values="0;0;0;1;1;0" keyTimes="0;0.45;0.5;0.7;0.75;1" dur="24s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- dotted thread connecting rack to checklist, slow dash drift -->
  <path d="M340 245 C 390 245, 390 200, 440 200" fill="none" stroke="#111111" stroke-width="4" stroke-dasharray="10 10">
    <animate attributeName="stroke-dashoffset" values="0;-80" dur="12s" repeatCount="indefinite"/>
  </path>
  <circle cx="340" cy="245" r="9" fill="#FF4D00">
    <animate attributeName="cy" values="245;245" dur="12s" repeatCount="indefinite"/>
    <animateMotion dur="12s" repeatCount="indefinite" path="M340 245 C 390 245, 390 200, 440 200"/>
  </circle>

  <!-- slow rotating gear accent, 40s rotation -->
  <g transform="translate(640,330)">
    <g stroke="#111111" stroke-width="5" fill="none">
      <circle r="34"/>
      <g>
        <line x1="-46" y1="0" x2="-22" y2="0"/>
        <line x1="46" y1="0" x2="22" y2="0"/>
        <line x1="0" y1="-46" x2="0" y2="-22"/>
        <line x1="0" y1="46" x2="0" y2="22"/>
        <line x1="-32" y1="-32" x2="-16" y2="-16"/>
        <line x1="32" y1="-32" x2="16" y2="-16"/>
        <line x1="-32" y1="32" x2="-16" y2="16"/>
        <line x1="32" y1="32" x2="16" y2="16"/>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="40s" repeatCount="indefinite"/>
      </g>
    </g>
    <circle r="10" fill="#FF4D00"/>
  </g>
</svg>
