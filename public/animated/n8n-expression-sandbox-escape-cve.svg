<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Abstract animation: workflow nodes with one cracked node leaking orange code">
  <rect width="800" height="450" fill="#FFFDF5"/>
  <!-- fine grid -->
  <g stroke="#E8E4D8" stroke-width="1">
    <path d="M50 0v450M100 0v450M150 0v450M200 0v450M250 0v450M300 0v450M350 0v450M400 0v450M450 0v450M500 0v450M550 0v450M600 0v450M650 0v450M700 0v450M750 0v450"/>
    <path d="M0 50h800M0 100h800M0 150h800M0 200h800M0 250h800M0 300h800M0 350h800M0 400h800"/>
  </g>

  <!-- workflow pipeline: nodes connected by pipes -->
  <g stroke="#111111" stroke-width="8" fill="#FFFDF5">
    <rect x="90" y="175" width="110" height="100" fill="#FFFDF5"/>
    <circle cx="320" cy="225" r="50" fill="#FFFDF5"/>
    <rect x="500" y="175" width="110" height="100" fill="#FFFDF5"/>
    <line x1="200" y1="225" x2="270" y2="225"/>
    <line x1="370" y1="225" x2="430" y2="225"/>
    <line x1="610" y1="225" x2="700" y2="225"/>
  </g>

  <!-- the vulnerable middle node: cracked box -->
  <g>
    <rect x="400" y="175" width="100" height="100" fill="#FFFDF5" stroke="#111111" stroke-width="8"/>
    <!-- cracks -->
    <polyline points="450,175 442,205 458,225 446,250 456,275" fill="none" stroke="#111111" stroke-width="5"/>
    <polyline points="400,215 425,228 415,248" fill="none" stroke="#111111" stroke-width="5"/>
    <polyline points="500,240 478,250 488,268" fill="none" stroke="#111111" stroke-width="5"/>
    <!-- pulsing crack glow -->
    <polyline points="450,175 442,205 458,225 446,250 456,275" fill="none" stroke="#FF4D00" stroke-width="4">
      <animate attributeName="opacity" values="1;0.25;1" dur="6s" repeatCount="indefinite"/>
    </polyline>
  </g>

  <!-- orange code-leak stream pouring from the crack -->
  <g fill="#FF4D00">
    <rect x="452" y="262" width="14" height="120" rx="7">
      <animate attributeName="height" values="120;140;120" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="y" values="262;252;262" dur="8s" repeatCount="indefinite"/>
    </rect>
    <rect x="436" y="270" width="10" height="90" rx="5">
      <animate attributeName="height" values="90;115;90" dur="7s" repeatCount="indefinite"/>
    </rect>
    <rect x="470" y="266" width="10" height="105" rx="5">
      <animate attributeName="height" values="105;130;105" dur="9s" repeatCount="indefinite"/>
    </rect>
    <!-- code dashes floating out of the stream -->
    <g stroke="#FF4D00" stroke-width="6" stroke-linecap="round">
      <line x1="430" y1="330" x2="470" y2="330">
        <animate attributeName="opacity" values="1;0.15;1" dur="6s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 26;0 0" dur="6s" repeatCount="indefinite"/>
      </line>
      <line x1="445" y1="356" x2="490" y2="356">
        <animate attributeName="opacity" values="0.15;1;0.15" dur="6s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 22;0 0" dur="6s" repeatCount="indefinite"/>
      </line>
      <line x1="428" y1="384" x2="462" y2="384">
        <animate attributeName="opacity" values="1;0.15;1" dur="7s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 18;0 0" dur="7s" repeatCount="indefinite"/>
      </line>
      <line x1="452" y1="408" x2="496" y2="408">
        <animate attributeName="opacity" values="0.15;1;0.15" dur="7s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 14;0 0" dur="7s" repeatCount="indefinite"/>
      </line>
    </g>
  </g>

  <!-- shield node: the patched state, slow rotating ring -->
  <g transform="translate(320 225)">
    <g fill="none" stroke="#111111" stroke-width="6" opacity="0.35">
      <circle r="78">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="40s" repeatCount="indefinite"/>
      </circle>
      <path d="M0 -78 A78 78 0 0 1 67 -39" stroke="#FF4D00" stroke-width="10" stroke-linecap="round">
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="40s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>

  <!-- decorative bolts, drifting slowly -->
  <g fill="#111111">
    <circle cx="140" cy="90" r="7">
      <animate attributeName="cy" values="90;104;90" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="660" cy="360" r="7">
      <animate attributeName="cy" values="360;346;360" dur="10s" repeatCount="indefinite"/>
    </circle>
    <circle cx="690" cy="80" r="5">
      <animate attributeName="cy" values="80;92;80" dur="8s" repeatCount="indefinite"/>
    </circle>
  </g>
  <rect x="720" y="60" width="26" height="26" fill="#FF4D00" stroke="#111111" stroke-width="6">
    <animateTransform attributeName="transform" type="rotate" from="0 733 73" to="360 733 73" dur="30s" repeatCount="indefinite"/>
  </rect>
</svg>
