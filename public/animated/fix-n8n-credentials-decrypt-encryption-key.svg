<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Animated schematic: an encryption key turning inside a lock, unlocking credential capsules">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#111111" stroke-width="0.6" opacity="0.14"/>
    </pattern>
  </defs>

  <!-- cream sheet -->
  <rect x="0" y="0" width="800" height="450" fill="#FFFDF5"/>
  <rect x="0" y="0" width="800" height="450" fill="url(#grid)"/>
  <rect x="6" y="6" width="788" height="438" fill="none" stroke="#111111" stroke-width="4"/>

  <!-- central lock body -->
  <g>
    <rect x="310" y="180" width="180" height="170" rx="14" fill="#FFFDF5" stroke="#111111" stroke-width="6"/>
    <rect x="310" y="180" width="180" height="170" rx="14" fill="none" stroke="#111111" stroke-width="6" opacity="0.12" transform="translate(12 14)"/>
    <!-- shackle -->
    <path d="M355 182 V140 a45 45 0 0 1 90 0 V182" fill="none" stroke="#111111" stroke-width="16" stroke-linecap="round">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 0;0 -10;0 0" dur="9s" repeatCount="indefinite"/>
    </path>
    <!-- keyhole -->
    <circle cx="400" cy="265" r="22" fill="#111111"/>
    <rect x="392" y="265" width="16" height="42" fill="#111111"/>
    <!-- lock glow ring: unlock pulse -->
    <circle cx="400" cy="265" r="34" fill="none" stroke="#FF4D00" stroke-width="5" opacity="0.9">
      <animate attributeName="r" values="34;52;34" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0.15;0.9" dur="7s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- the key: slides in from the left, then rotates to unlock -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="-260 0;-40 0;-40 0;-260 0" dur="14s" repeatCount="indefinite"/>
    <g opacity="0">
      <animate attributeName="opacity" values="0;1;1;0" dur="14s" repeatCount="indefinite"/>
    </g>
    <g>
      <rect x="120" y="252" width="190" height="26" fill="#FF4D00" stroke="#111111" stroke-width="6"/>
      <rect x="268" y="238" width="26" height="20" fill="#FF4D00" stroke="#111111" stroke-width="6"/>
      <rect x="268" y="272" width="26" height="22" fill="#FF4D00" stroke="#111111" stroke-width="6"/>
      <rect x="120" y="252" width="190" height="26" fill="none" stroke="#111111" stroke-width="6"/>
      <rect x="296" y="240" width="40" height="64" rx="8" fill="#FFFDF5" stroke="#111111" stroke-width="6"/>
      <circle cx="316" cy="272" r="10" fill="#111111"/>
      <animateTransform attributeName="transform" type="rotate" values="0 400 265;0 400 265;25 400 265;25 400 265" dur="14s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- credential capsules flowing toward the lock: encrypted (black) -> decrypted (orange-lit) -->
  <g>
    <!-- capsule 1: left rail, encrypted -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;170 0;170 0;0 0" dur="10s" repeatCount="indefinite"/>
      <rect x="60" y="120" width="120" height="52" rx="26" fill="#FFFDF5" stroke="#111111" stroke-width="5"/>
      <path d="M75 146 L105 146 M115 146 L145 146" stroke="#111111" stroke-width="5" stroke-linecap="round"/>
      <rect x="150" y="138" width="16" height="16" fill="#111111">
        <animate attributeName="opacity" values="1;1;0;0" dur="10s" repeatCount="indefinite"/>
      </rect>
    </g>
    <!-- capsule 2: bottom rail -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;-150 0;-150 0;0 0" dur="12s" repeatCount="indefinite"/>
      <rect x="620" y="330" width="120" height="52" rx="26" fill="#FFFDF5" stroke="#111111" stroke-width="5"/>
      <path d="M635 356 L665 356 M675 356 L705 356" stroke="#111111" stroke-width="5" stroke-linecap="round"/>
      <rect x="600" y="348" width="16" height="16" fill="#111111">
        <animate attributeName="opacity" values="1;1;0;0" dur="12s" repeatCount="indefinite"/>
      </rect>
    </g>
    <!-- decrypted capsules: glowing orange outline leaving the lock -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 0;60 0;0 0" dur="14s" repeatCount="indefinite"/>
      <g opacity="0.2">
        <animate attributeName="opacity" values="0.2;0.2;1;0.2" dur="14s" repeatCount="indefinite"/>
      </g>
      <rect x="540" y="120" width="120" height="52" rx="26" fill="#FFFDF5" stroke="#FF4D00" stroke-width="5"/>
      <path d="M555 146 L585 146 M595 146 L625 146" stroke="#FF4D00" stroke-width="5" stroke-linecap="round"/>
      <rect x="640" y="250" width="120" height="52" rx="26" fill="#FFFDF5" stroke="#FF4D00" stroke-width="5"/>
      <path d="M655 276 L685 276 M695 276 L725 276" stroke="#FF4D00" stroke-width="5" stroke-linecap="round"/>
    </g>
  </g>

  <!-- lock-state dial: flips as the key turns -->
  <g transform="translate(668 130)">
    <circle cx="0" cy="0" r="34" fill="#FFFDF5" stroke="#111111" stroke-width="6"/>
    <line x1="0" y1="0" x2="0" y2="-22" stroke="#FF4D00" stroke-width="7" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" values="-45;-45;45;45" dur="14s" repeatCount="indefinite"/>
    </line>
    <circle cx="0" cy="0" r="6" fill="#111111"/>
  </g>

  <!-- dotted path rails -->
  <path d="M60 146 H300 M500 146 H800" fill="none" stroke="#111111" stroke-width="2" stroke-dasharray="8 8" opacity="0.4"/>
  <path d="M620 356 H500 M300 356 H0" fill="none" stroke="#111111" stroke-width="2" stroke-dasharray="8 8" opacity="0.4"/>

  <!-- slow orbit ring around the lock -->
  <ellipse cx="400" cy="265" rx="150" ry="120" fill="none" stroke="#111111" stroke-width="2" stroke-dasharray="4 10" opacity="0.35">
    <animateTransform attributeName="transform" type="rotate" values="0 400 265;360 400 265" dur="40s" repeatCount="indefinite"/>
  </ellipse>
</svg>
