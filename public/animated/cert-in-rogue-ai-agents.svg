<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Abstract animated diagram of an AI agent breaching a security perimeter">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#111111" stroke-width="0.5" opacity="0.12"/>
    </pattern>
  </defs>
  <rect x="0" y="0" width="800" height="450" fill="#FFFDF5"/>
  <rect x="0" y="0" width="800" height="450" fill="url(#grid)"/>
  <rect x="8" y="8" width="784" height="434" fill="none" stroke="#111111" stroke-width="3"/>

  <!-- Security perimeter wall -->
  <g opacity="0.9">
    <rect x="120" y="90" width="16" height="270" fill="#111111"/>
    <rect x="664" y="90" width="16" height="270" fill="#111111"/>
    <rect x="136" y="90" width="528" height="16" fill="#111111"/>
    <rect x="136" y="344" width="528" height="16" fill="#111111"/>
  </g>

  <!-- Breach crack in the right side of the perimeter (orange pulsing) -->
  <g stroke="#FF4D00" stroke-width="5" fill="none" stroke-linecap="round">
    <path d="M 640 170 L 676 196 L 648 230 L 680 262">
      <animate attributeName="opacity" values="1;0.35;1" dur="8s" repeatCount="indefinite"/>
    </path>
    <path d="M 640 170 L 610 200 L 622 244" stroke-width="3">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="10s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Agent node: orange core with orbiting signal rings -->
  <g transform="translate(400 225)">
    <circle cx="0" cy="0" r="34" fill="#FF4D00" stroke="#111111" stroke-width="4"/>
    <circle cx="0" cy="0" r="52" fill="none" stroke="#111111" stroke-width="2">
      <animate attributeName="r" values="46;64;46" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0.25;0.9" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="78" fill="none" stroke="#111111" stroke-width="1.5" stroke-dasharray="10 8">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="36s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="7" fill="#FFFDF5">
      <animate attributeName="opacity" values="1;0.2;1" dur="6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Protruding tendrils: agent reaching outward -->
  <g stroke="#111111" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M 434 225 C 480 200, 540 205, 600 190">
      <animate attributeName="stroke-dashoffset" values="0;-60" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="stroke-dasharray" values="6 8"/>
    </path>
    <path d="M 434 250 C 490 262, 545 255, 596 272">
      <animate attributeName="stroke-dashoffset" values="0;60" dur="14s" repeatCount="indefinite"/>
      <animate attributeName="stroke-dasharray" values="6 8"/>
    </path>
    <path d="M 400 191 C 380 150, 360 130, 330 108">
      <animate attributeName="stroke-dashoffset" values="0;-60" dur="11s" repeatCount="indefinite"/>
      <animate attributeName="stroke-dasharray" values="6 8"/>
    </path>
  </g>

    <g stroke="#111111" stroke-width="3" fill="#FFFDF5">
      <g>
        <circle cx="0" cy="-104" r="12"/>
        <path d="M 0 -92 L 0 -78 M -6 -85 L 6 -85" stroke-width="2"/>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="30s" repeatCount="indefinite"/>
      </g>
      <g>
        <circle cx="0" cy="104" r="12"/>
        <path d="M 0 92 L 0 106 M -6 99 L 6 99" stroke-width="2"/>
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="40s" repeatCount="indefinite"/>
      </g>
    </g>
  </g>

  <!-- Alert pings radiating from the breach point -->
  <g transform="translate(664 215)" stroke="#FF4D00" stroke-width="2.5" fill="none">
    <circle cx="0" cy="0" r="10">
      <animate attributeName="r" values="8;44" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="10">
      <animate attributeName="r" values="8;44" dur="7s" begin="3.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0" dur="7s" begin="3.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Slow sweeping scan line -->
  <rect x="120" y="90" width="6" height="270" fill="#111111" opacity="0.15">
    <animate attributeName="x" values="120;540;120" dur="18s" repeatCount="indefinite"/>
  </rect>
</svg>
