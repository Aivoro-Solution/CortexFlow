<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Abstract frozen spreadsheet row with a spinning listener">
  <rect width="800" height="450" fill="#FFFDF5"/>
  <g stroke="#111" stroke-width="1" opacity="0.12">
    <g id="grid">
      <path d="M0 50H800M0 100H800M0 150H800M0 200H800M0 250H800M0 300H800M0 350H800M0 400H800"/>
      <path d="M50 0V450M100 0V450M150 0V450M200 0V450M250 0V450M300 0V450M350 0V450M400 0V450M450 0V450M500 0V450M550 0V450M600 0V450M650 0V450M700 0V450M750 0V450"/>
    </g>
  </g>

  <!-- Spreadsheet sheet card -->
  <g>
    <rect x="120" y="80" width="560" height="290" fill="#FFFDF5" stroke="#111" stroke-width="3"/>
    <rect x="132" y="92" width="560" height="290" fill="none" stroke="#111" stroke-width="3" opacity="0.18"/>
    <!-- header row -->
    <rect x="120" y="80" width="560" height="52" fill="#111"/>
    <rect x="148" y="96" width="90" height="18" fill="#FFFDF5" opacity="0.9"/>
    <rect x="262" y="96" width="120" height="18" fill="#FFFDF5" opacity="0.6"/>
    <rect x="406" y="96" width="80" height="18" fill="#FFFDF5" opacity="0.75"/>
    <!-- data rows -->
    <g fill="none" stroke="#111" stroke-width="2">
      <rect x="148" y="152" width="524" height="34"/>
      <rect x="148" y="196" width="524" height="34"/>
      <rect x="148" y="240" width="524" height="34"/>
    </g>
    <g stroke="#111" stroke-width="2">
      <line x1="148" y1="152" x2="148" y2="274"/><line x1="320" y1="152" x2="320" y2="274"/><line x1="492" y1="152" x2="492" y2="274"/>
    </g>
    <g fill="#111" opacity="0.55">
      <rect x="164" y="164" width="70" height="12"/><rect x="340" y="164" width="100" height="12"/>
      <rect x="164" y="208" width="90" height="12"/><rect x="508" y="208" width="70" height="12"/>
    </g>
    <!-- the stuck row: orange accent -->
    <rect x="148" y="240" width="524" height="34" fill="#FF4D00" opacity="0.25"/>
    <rect x="148" y="240" width="524" height="34" fill="none" stroke="#FF4D00" stroke-width="3"/>
    <g fill="#FF4D00"><rect x="164" y="252" width="80" height="12"/><rect x="340" y="252" width="110" height="12"/></g>
  </g>

  <!-- spinning listener dial (slow, 30s) -->
  <g>
    <circle cx="620" cy="140" r="46" fill="#FFFDF5" stroke="#111" stroke-width="3"/>
    <circle cx="620" cy="140" r="6" fill="#FF4D00"/>
    <g stroke="#FF4D00" stroke-width="6" stroke-linecap="round">
      <line x1="620" y1="104" x2="620" y2="126">
        <animateTransform attributeName="transform" type="rotate" from="0 620 140" to="360 620 140" dur="30s" repeatCount="indefinite"/>
      </line>
    </g>
    <g stroke="#111" stroke-width="3" opacity="0.35">
      <line x1="586" y1="140" x2="654" y2="140"/><line x1="620" y1="106" x2="620" y2="174"/>
    </g>
  </g>

  <!-- waiting pulse traveling down the stuck row -->
  <g>
    <rect x="148" y="240" width="60" height="34" fill="#FF4D00" opacity="0.45">
      <animate attributeName="x" values="148;612;148" dur="12s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- event arrow arriving from a cloud (slow, 9s) -->
  <g>
    <path d="M120 380 q10 -18 30 -18 q6 -14 24 -14 q20 0 26 16 q16 -4 24 8 q6 12 -6 20 l-86 0 q-18 -2 -12 -12z" fill="#FFFDF5" stroke="#111" stroke-width="3"/>
    <g>
      <rect x="238" y="380" width="180" height="10" fill="#FF4D00" opacity="0.6"/>
      <polygon points="418,368 452,385 418,402" fill="#FF4D00"/>
      <animateTransform attributeName="transform" type="translate" values="0 0;-160 0;0 0" dur="9s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- poll clock, slow tick (14s) -->
  <g>
    <circle cx="200" cy="400" r="26" fill="#FFFDF5" stroke="#111" stroke-width="3"/>
    <line x1="200" y1="400" x2="200" y2="382" stroke="#111" stroke-width="3" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" from="0 200 400" to="360 200 400" dur="14s" repeatCount="indefinite"/>
    </line>
  </g>
</svg>
