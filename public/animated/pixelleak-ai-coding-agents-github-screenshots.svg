<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Abstract schematic: an AI coding agent leaking screenshots from a locked private window into an open public repository">
  <!-- PixelLeak animated hero — hand-written SMIL, slow loops only, no text -->
  <rect x="0" y="0" width="800" height="450" fill="#FFFDF5"/>

  <!-- fine grid -->
  <g stroke="#E8E2D3" stroke-width="1">
    <path d="M0 90H800M0 180H800M0 270H800M0 360H800"/>
    <path d="M160 0V450M320 0V450M480 0V450M640 0V450"/>
  </g>

  <!-- private locked window (left) — thick black frame -->
  <g>
    <rect x="70" y="90" width="250" height="270" fill="#FFFFFF" stroke="#111111" stroke-width="6"/>
    <rect x="70" y="90" width="250" height="44" fill="#111111"/>
    <circle cx="96" cy="112" r="7" fill="#FFFDF5"/>
    <circle cx="120" cy="112" r="7" fill="#FF4D00"/>
    <circle cx="144" cy="112" r="7" fill="#FFFDF5"/>
    <!-- code lines inside window -->
    <g stroke="#111111" stroke-width="6" stroke-linecap="round">
      <line x1="100" y1="165" x2="240" y2="165"/>
      <line x1="100" y1="192" x2="270" y2="192"/>
      <line x1="100" y1="219" x2="210" y2="219"/>
      <line x1="100" y1="246" x2="255" y2="246"/>
    </g>
    <!-- lock symbol on window -->
    <g transform="translate(275,305)">
      <rect x="-22" y="-6" width="44" height="34" fill="#FF4D00" stroke="#111111" stroke-width="5"/>
      <path d="M-12 -6 V-18 a12 12 0 0 1 24 0 V-6" fill="none" stroke="#111111" stroke-width="5"/>
    </g>
    <!-- leaking screenshot frames escaping to the right (slow drift) -->
    <g fill="#FFFFFF" stroke="#111111" stroke-width="4">
      <rect x="0" y="0" width="86" height="60">
        <animateTransform attributeName="transform" type="translate" from="340 150" to="560 150" dur="12s" repeatCount="indefinite"/>
      </rect>
      <rect x="0" y="0" width="86" height="60">
        <animateTransform attributeName="transform" type="translate" from="340 150" to="560 150" dur="12s" begin="6s" repeatCount="indefinite"/>
      </rect>
      <rect x="0" y="0" width="70" height="50">
        <animateTransform attributeName="transform" type="translate" from="340 240" to="560 260" dur="15s" begin="3s" repeatCount="indefinite"/>
      </rect>
      <rect x="0" y="0" width="70" height="50">
        <animateTransform attributeName="transform" type="translate" from="340 240" to="560 260" dur="15s" begin="10.5s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <!-- public open repository (right) — orange accent box with open lid -->
  <g>
    <rect x="560" y="230" width="170" height="130" fill="#FFFFFF" stroke="#111111" stroke-width="6"/>
    <rect x="560" y="230" width="170" height="40" fill="#FF4D00" stroke="#111111" stroke-width="6">
      <animateTransform attributeName="transform" type="rotate" values="0 645 235; -8 645 235; 0 645 235" dur="9s" repeatCount="indefinite"/>
    </rect>
    <circle cx="645" cy="295" r="14" fill="none" stroke="#111111" stroke-width="5"/>
  </g>

  <!-- incoming screenshots settle into the open repo: fade in at right -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.2;0.8;1" dur="12s" repeatCount="indefinite"/>
    <rect x="585" y="170" width="86" height="60" fill="#FFFFFF" stroke="#111111" stroke-width="4"/>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.2;0.8;1" dur="15s" begin="3s" repeatCount="indefinite"/>
    <rect x="610" y="180" width="70" height="50" fill="#FFFFFF" stroke="#FF4D00" stroke-width="4"/>
  </g>

  <!-- slow orbiting scan ring around the leak path (very slow rotation) -->
  <g transform="translate(450,205)">
    <animateTransform attributeName="transform" type="rotate" from="0 450 205" to="360 450 205" dur="40s" repeatCount="indefinite" additive="replace"/>
    <circle cx="0" cy="-70" r="10" fill="#FF4D00"/>
    <circle cx="0" cy="70" r="10" fill="none" stroke="#111111" stroke-width="4"/>
  </g>

  <!-- ground shadows, hard offset style -->
  <rect x="86" y="368" width="250" height="14" fill="#111111" opacity="0.12"/>
  <rect x="576" y="368" width="170" height="14" fill="#111111" opacity="0.12"/>
</svg>
