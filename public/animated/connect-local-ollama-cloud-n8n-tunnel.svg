<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <rect x="0" y="0" width="800" height="450" fill="#FFFDF5"/>
  <g stroke="#111" stroke-width="1" opacity="0.15">
    <path d="M0 75 H800 M0 150 H800 M0 225 H800 M0 300 H800 M0 375 H800"/>
    <path d="M100 0 V450 M200 0 V450 M300 0 V450 M400 0 V450 M500 0 V450 M600 0 V450 M700 0 V450"/>
  </g>

  <!-- local machine -->
  <g>
    <rect x="70" y="180" width="120" height="90" fill="#FFFDF5" stroke="#111" stroke-width="5"/>
    <rect x="85" y="195" width="90" height="40" fill="#111"/>
    <rect x="120" y="278" width="20" height="14" fill="#111"/>
    <rect x="95" y="292" width="70" height="10" fill="#111"/>
    <rect x="95" y="205" width="12" height="12" fill="#FF4D00">
      <animate attributeName="opacity" values="1;0.2;1" dur="6s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- cloud -->
  <g>
    <ellipse cx="640" cy="225" rx="80" ry="52" fill="#FFFDF5" stroke="#111" stroke-width="5"/>
    <ellipse cx="640" cy="212" rx="30" ry="18" fill="#FF4D00" stroke="#111" stroke-width="4">
      <animate attributeName="opacity" values="1;0.35;1" dur="8s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <!-- tunnel arc -->
  <path d="M190 225 C 340 110, 440 340, 560 225" fill="none" stroke="#111" stroke-width="8"/>
  <path d="M190 225 C 340 110, 440 340, 560 225" fill="none" stroke="#FF4D00" stroke-width="4"/>

  <!-- packet travelling through the tunnel -->
  <circle r="12" fill="#FF4D00" stroke="#111" stroke-width="4">
    <animateMotion dur="7s" repeatCount="indefinite" path="M190 225 C 340 110, 440 340, 560 225"/>
  </circle>

  <!-- slow rotating gear accent -->
  <g transform="translate(400,90)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="40s" repeatCount="indefinite"/>
      <rect x="-26" y="-26" width="52" height="52" fill="none" stroke="#111" stroke-width="4"/>
      <rect x="-10" y="-34" width="20" height="68" fill="#FFFDF5" stroke="#111" stroke-width="4"/>
      <rect x="-34" y="-10" width="68" height="20" fill="#FFFDF5" stroke="#111" stroke-width="4"/>
      <circle r="8" fill="#FF4D00" stroke="#111" stroke-width="3"/>
    </g>
  </g>
</svg>
