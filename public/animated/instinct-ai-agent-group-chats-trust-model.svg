<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Abstract animation: an AI agent handoff between two conversation clusters through a permission gate">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#E7E0CF" stroke-width="1"/>
    </pattern>
    <filter id="hardshadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="5" dy="5" stdDeviation="0" flood-color="#111111"/>
    </filter>
  </defs>

  <!-- cream sheet -->
  <rect x="0" y="0" width="800" height="450" fill="#FFFDF5"/>
  <rect x="0" y="0" width="800" height="450" fill="url(#grid)"/>
  <rect x="14" y="14" width="772" height="422" fill="none" stroke="#111111" stroke-width="4"/>

  <!-- left cluster: personal conversation -->
  <g stroke="#111111" stroke-width="4" fill="#FFFDF5" filter="url(#hardshadow)">
    <rect x="90" y="120" width="150" height="70" rx="14">
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -10; 0 0" dur="12s" repeatCount="indefinite"/>
    </rect>
    <rect x="130" y="205" width="130" height="62" rx="14" fill="#F4EEDF">
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 8; 0 0" dur="14s" repeatCount="indefinite"/>
    </rect>
    <rect x="80" y="282" width="150" height="66" rx="14">
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -8; 0 0" dur="16s" repeatCount="indefinite"/>
    </rect>
  </g>
  <!-- ink lines suggesting message text -->
  <g stroke="#111111" stroke-width="5" stroke-linecap="round" opacity="0.85">
    <line x1="112" y1="145" x2="208" y2="145"><animate attributeName="opacity" values="0.85;0.3;0.85" dur="7s" repeatCount="indefinite"/></line>
    <line x1="112" y1="165" x2="178" y2="165"><animate attributeName="opacity" values="0.85;0.3;0.85" dur="9s" repeatCount="indefinite"/></line>
    <line x1="152" y1="228" x2="238" y2="228"><animate attributeName="opacity" values="0.85;0.3;0.85" dur="8s" repeatCount="indefinite"/></line>
    <line x1="152" y1="248" x2="212" y2="248"><animate attributeName="opacity" values="0.85;0.3;0.85" dur="11s" repeatCount="indefinite"/></line>
    <line x1="102" y1="306" x2="198" y2="306"><animate attributeName="opacity" values="0.85;0.3;0.85" dur="10s" repeatCount="indefinite"/></line>
  </g>

  <!-- right cluster: group conversation -->
  <g stroke="#111111" stroke-width="4" fill="#FFFDF5" filter="url(#hardshadow)">
    <rect x="560" y="120" width="150" height="70" rx="14" fill="#F4EEDF">
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 10; 0 0" dur="13s" repeatCount="indefinite"/>
    </rect>
    <rect x="540" y="205" width="130" height="62" rx="14">
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -9; 0 0" dur="15s" repeatCount="indefinite"/>
    </rect>
    <rect x="570" y="282" width="150" height="66" rx="14" fill="#F4EEDF">
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 7; 0 0" dur="11s" repeatCount="indefinite"/>
    </rect>
  </g>
  <g stroke="#111111" stroke-width="5" stroke-linecap="round" opacity="0.85">
    <line x1="582" y1="145" x2="678" y2="145"><animate attributeName="opacity" values="0.85;0.3;0.85" dur="8s" repeatCount="indefinite"/></line>
    <line x1="582" y1="165" x2="648" y2="165"><animate attributeName="opacity" values="0.85;0.3;0.85" dur="10s" repeatCount="indefinite"/></line>
    <line x1="562" y1="228" x2="648" y2="228"><animate attributeName="opacity" values="0.85;0.3;0.85" dur="9s" repeatCount="indefinite"/></line>
    <line x1="592" y1="306" x2="688" y2="306"><animate attributeName="opacity" values="0.85;0.3;0.85" dur="12s" repeatCount="indefinite"/></line>
  </g>

  <!-- the permission gate between the clusters -->
  <g>
    <circle cx="400" cy="235" r="64" fill="#FFFDF5" stroke="#111111" stroke-width="4" filter="url(#hardshadow)">
      <animate attributeName="r" values="64;70;64" dur="8s" repeatCount="indefinite"/>
    </circle>
    <g stroke="#FF4D00" stroke-width="6" fill="none">
      <circle cx="400" cy="235" r="44" stroke-dasharray="18 14">
        <animateTransform attributeName="transform" type="rotate" from="0 400 235" to="360 400 235" dur="60s" repeatCount="indefinite"/>
      </circle>
    </g>
    <!-- keyhole: the gate's consent signal -->
    <circle cx="400" cy="222" r="10" fill="#FF4D00">
      <animate attributeName="opacity" values="1;0.35;1" dur="6s" repeatCount="indefinite"/>
    </circle>
    <rect x="395" y="228" width="10" height="24" rx="4" fill="#FF4D00">
      <animate attributeName="opacity" values="1;0.35;1" dur="6s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- message token travelling left -> gate -> right (permission-gated handoff) -->
  <path id="handoff" d="M 240 235 C 300 235, 300 235, 336 235 S 500 235, 560 235" fill="none"/>
  <circle r="11" fill="#FF4D00" stroke="#111111" stroke-width="4">
    <animateMotion dur="10s" repeatCount="indefinite" rotate="0">
      <mpath href="#handoff"/>
    </animateMotion>
    <animate attributeName="opacity" values="1;1;0.25;1;1" keyTimes="0;0.38;0.5;0.62;1" dur="10s" repeatCount="indefinite"/>
  </circle>

  <!-- corner registration marks -->
  <g stroke="#111111" stroke-width="3">
    <line x1="30" y1="30" x2="52" y2="30"/><line x1="30" y1="30" x2="30" y2="52"/>
    <line x1="770" y1="30" x2="748" y2="30"/><line x1="770" y1="30" x2="770" y2="52"/>
    <line x1="30" y1="420" x2="52" y2="420"/><line x1="30" y1="420" x2="30" y2="398"/>
    <line x1="770" y1="420" x2="748" y2="420"/><line x1="770" y1="420" x2="770" y2="398"/>
  </g>
</svg>
