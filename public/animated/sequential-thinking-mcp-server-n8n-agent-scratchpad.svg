<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M25 0H0V25" fill="none" stroke="#111111" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
  </defs>
  <rect x="0" y="0" width="800" height="450" fill="#FFFDF5"/>
  <rect x="0" y="0" width="800" height="450" fill="url(#grid)"/>
  <!-- staircase of thought cards -->
  <g fill="#FFFDF5" stroke="#111111" stroke-width="3">
    <rect x="90" y="330" width="90" height="60">
      <animate attributeName="y" values="330;322;330" dur="8s" repeatCount="indefinite"/>
    </rect>
    <rect x="200" y="285" width="90" height="60">
      <animate attributeName="y" values="285;277;285" dur="8s" begin="1s" repeatCount="indefinite"/>
    </rect>
    <rect x="310" y="240" width="90" height="60">
      <animate attributeName="y" values="240;232;240" dur="8s" begin="2s" repeatCount="indefinite"/>
    </rect>
    <rect x="420" y="195" width="90" height="60">
      <animate attributeName="y" values="195;187;195" dur="8s" begin="3s" repeatCount="indefinite"/>
    </rect>
    <rect x="530" y="150" width="90" height="60">
      <animate attributeName="y" values="150;142;150" dur="8s" begin="4s" repeatCount="indefinite"/>
    </rect>
  </g>
  <!-- card ticks -->
  <g stroke="#111111" stroke-width="2">
    <line x1="105" y1="350" x2="165" y2="350"/>
    <line x1="215" y1="305" x2="275" y2="305"/>
    <line x1="325" y1="260" x2="385" y2="260"/>
    <line x1="435" y1="215" x2="495" y2="215"/>
    <line x1="545" y1="170" x2="605" y2="170"/>
  </g>
  <!-- branch card -->
  <rect x="420" y="320" width="90" height="60" fill="#FFFDF5" stroke="#111111" stroke-width="3" stroke-dasharray="7 5">
    <animate attributeName="opacity" values="0.35;1;0.35" dur="12s" repeatCount="indefinite"/>
  </rect>
  <!-- revision loop -->
  <path d="M465 195 C 420 120, 300 110, 255 285" fill="none" stroke="#111111" stroke-width="3" stroke-dasharray="10 8">
    <animate attributeName="stroke-dashoffset" values="0;-180" dur="30s" repeatCount="indefinite"/>
  </path>
  <path d="M255 285 l-14 -4 l8 14 z" fill="#111111"/>
  <!-- approval gate -->
  <g>
    <rect x="648" y="120" width="16" height="140" fill="#111111"/>
    <rect x="724" y="120" width="16" height="140" fill="#111111"/>
    <rect x="648" y="120" width="92" height="16" fill="#FF4D00" stroke="#111111" stroke-width="3">
      <animate attributeName="y" values="120;104;120" dur="10s" repeatCount="indefinite"/>
    </rect>
  </g>
  <!-- moving dot along the stairs -->
  <circle r="9" fill="#FF4D00" stroke="#111111" stroke-width="3">
    <animateMotion dur="24s" repeatCount="indefinite" path="M135 330 L245 285 L355 240 L465 195 L575 150 L694 140"/>
  </circle>
  <!-- base rail -->
  <line x1="60" y1="400" x2="760" y2="400" stroke="#111111" stroke-width="4"/>
  <g stroke="#111111" stroke-width="2">
    <line x1="120" y1="400" x2="120" y2="414"/>
    <line x1="240" y1="400" x2="240" y2="414"/>
    <line x1="360" y1="400" x2="360" y2="414"/>
    <line x1="480" y1="400" x2="480" y2="414"/>
    <line x1="600" y1="400" x2="600" y2="414"/>
    <line x1="720" y1="400" x2="720" y2="414"/>
  </g>
</svg>
