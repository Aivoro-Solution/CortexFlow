<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Abstract animation of a concurrency queue: tokens wait in line while one slips past the gate">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#111111" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- paper -->
  <rect width="800" height="450" fill="#FFFDF5"/>
  <rect width="800" height="450" fill="url(#grid)"/>

  <!-- frame -->
  <rect x="14" y="14" width="772" height="422" fill="none" stroke="#111111" stroke-width="4"/>

  <!-- queue rail -->
  <line x1="90" y1="300" x2="560" y2="300" stroke="#111111" stroke-width="4" stroke-linecap="round"/>
  <line x1="90" y1="300" x2="90" y2="330" stroke="#111111" stroke-width="4" stroke-linecap="round"/>
  <line x1="560" y1="300" x2="560" y2="330" stroke="#111111" stroke-width="4" stroke-linecap="round"/>

  <!-- waiting tokens, gently bobbing in place -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -6; 0 0" dur="6s" repeatCount="indefinite"/>
    <rect x="130" y="252" width="48" height="48" fill="#FFFDF5" stroke="#111111" stroke-width="4"/>
    <rect x="142" y="264" width="24" height="24" fill="#111111"/>
  </g>
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -6; 0 0" dur="6s" begin="1s" repeatCount="indefinite"/>
    <rect x="210" y="252" width="48" height="48" fill="#FFFDF5" stroke="#111111" stroke-width="4"/>
    <rect x="222" y="264" width="24" height="24" fill="#111111"/>
  </g>
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -6; 0 0" dur="6s" begin="2s" repeatCount="indefinite"/>
    <rect x="290" y="252" width="48" height="48" fill="#FFFDF5" stroke="#111111" stroke-width="4"/>
    <rect x="302" y="264" width="24" height="24" fill="#111111"/>
  </g>

  <!-- the gate: a single narrow opening -->
  <g>
    <rect x="600" y="180" width="14" height="150" fill="#111111"/>
    <rect x="680" y="180" width="14" height="150" fill="#111111"/>
    <rect x="600" y="180" width="94" height="14" fill="#111111"/>
  </g>

  <!-- the token that slips through: orange, drifting slowly past the gate -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 60 0; 0 0" dur="12s" repeatCount="indefinite"/>
    <rect x="620" y="252" width="48" height="48" fill="#FF4D00" stroke="#111111" stroke-width="4"/>
    <rect x="632" y="264" width="24" height="24" fill="#FFFDF5"/>
  </g>

  <!-- running slot: a token already past the gate, slowly rotating -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="0 745 150; 360 745 150" dur="40s" repeatCount="indefinite"/>
    <rect x="720" y="125" width="50" height="50" fill="#FFFDF5" stroke="#111111" stroke-width="4"/>
    <circle cx="745" cy="150" r="12" fill="#FF4D00" stroke="#111111" stroke-width="3"/>
  </g>

  <!-- slow drifting dashed flow line above the queue -->
  <line x1="90" y1="120" x2="560" y2="120" stroke="#111111" stroke-width="3" stroke-dasharray="14 18" stroke-linecap="round">
    <animate attributeName="stroke-dashoffset" values="0; -64" dur="8s" repeatCount="indefinite"/>
  </line>

  <!-- slow pulsing limit marker -->
  <circle cx="745" cy="330" r="26" fill="none" stroke="#FF4D00" stroke-width="4">
    <animate attributeName="r" values="22; 30; 22" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="stroke-opacity" values="1; 0.45; 1" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="745" cy="330" r="8" fill="#FF4D00"/>
</svg>
