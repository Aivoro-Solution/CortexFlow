<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="Paginated pages flowing toward an empty final page">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#111111" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="450" fill="#FFFDF5"/>
  <rect width="800" height="450" fill="url(#grid)"/>

  <!-- flowing page cards -->
  <g stroke="#111111" stroke-width="3" fill="#FFFDF5">
    <rect x="70" y="170" width="120" height="90" rx="4"/>
    <rect x="230" y="170" width="120" height="90" rx="4"/>
    <rect x="390" y="170" width="120" height="90" rx="4"/>
  </g>
  <!-- empty final page, orange outline -->
  <rect x="550" y="170" width="120" height="90" rx="4" fill="#FFFDF5" stroke="#FF4D00" stroke-width="4" stroke-dasharray="10 6">
    <animate attributeName="stroke-opacity" values="1;0.35;1" dur="6s" repeatCount="indefinite"/>
  </rect>

  <!-- text lines on populated pages -->
  <g stroke="#111111" stroke-width="4" stroke-linecap="round">
    <line x1="90" y1="195" x2="170" y2="195"/>
    <line x1="90" y1="215" x2="150" y2="215"/>
    <line x1="90" y1="235" x2="160" y2="235"/>
    <line x1="250" y1="195" x2="330" y2="195"/>
    <line x1="250" y1="215" x2="310" y2="215"/>
    <line x1="250" y1="235" x2="320" y2="235"/>
    <line x1="410" y1="195" x2="490" y2="195"/>
    <line x1="410" y1="215" x2="470" y2="215"/>
    <line x1="410" y1="235" x2="480" y2="235"/>
  </g>

  <!-- connector arrows between pages -->
  <g stroke="#111111" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 195 215 H 225">
      <animate attributeName="stroke-dashoffset" values="0;-24" dur="6s" repeatCount="indefinite"/>
    </path>
    <path d="M 355 215 H 385">
      <animate attributeName="stroke-dashoffset" values="0;-24" dur="6s" repeatCount="indefinite"/>
    </path>
  </g>
  <g fill="#111111">
    <polygon points="225,209 237,215 225,221"/>
    <polygon points="385,209 397,215 385,221"/>
  </g>

  <!-- broken link to the empty page: dashed orange gap -->
  <g stroke="#FF4D00" stroke-width="3" stroke-dasharray="6 8" stroke-linecap="round">
    <line x1="515" y1="215" x2="545" y2="215">
      <animate attributeName="stroke-dashoffset" values="0;-28" dur="6s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- orange stop marker above the empty page -->
  <g>
    <circle cx="610" cy="120" r="26" fill="#FF4D00" stroke="#111111" stroke-width="3"/>
    <rect x="606" y="106" width="8" height="20" fill="#FFFDF5"/>
    <rect x="606" y="130" width="8" height="8" fill="#FFFDF5"/>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 8; 0 0" dur="8s" repeatCount="indefinite"/>
  </g>

  <!-- slow drifting page stack below -->
  <g opacity="0.9">
    <rect x="300" y="300" width="200" height="14" rx="3" fill="#FFFDF5" stroke="#111111" stroke-width="3"/>
    <rect x="320" y="322" width="160" height="14" rx="3" fill="#FFFDF5" stroke="#111111" stroke-width="3"/>
    <rect x="340" y="344" width="120" height="14" rx="3" fill="#FF4D00" stroke="#111111" stroke-width="3"/>
    <animateTransform attributeName="transform" type="translate" values="0 0; 12 0; 0 0" dur="12s" repeatCount="indefinite"/>
  </g>

  <!-- rotating dashed ring, very slow -->
  <g fill="none" stroke="#111111" stroke-width="2" stroke-dasharray="4 8" opacity="0.5">
    <circle cx="610" cy="120" r="44">
      <animateTransform attributeName="transform" type="rotate" from="0 610 120" to="360 610 120" dur="60s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
