<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Schematic animation of a PHP worker press: a request part is machined, its tray lifts away empty, an orange leftover part remains, and the next request rolls in on a rail">
  <rect x="0" y="0" width="800" height="450" fill="#FFFDF5"/>
  <g stroke="#E4E0D5" stroke-width="1">
    <path d="M0 50 H800 M0 100 H800 M0 150 H800 M0 200 H800 M0 250 H800 M0 300 H800 M0 350 H800 M0 400 H800"/>
    <path d="M50 0 V450 M100 0 V450 M150 0 V450 M200 0 V450 M250 0 V450 M300 0 V450 M350 0 V450 M400 0 V450 M450 0 V450 M500 0 V450 M550 0 V450 M600 0 V450 M650 0 V450 M700 0 V450 M750 0 V450"/>
  </g>

  <!-- Bench -->
  <rect x="90" y="330" width="620" height="10" fill="#FFFDF5" stroke="#111" stroke-width="3"/>
  <path d="M120 340 V366 M680 340 V366" stroke="#111" stroke-width="3"/>

  <!-- Worker press frame -->
  <g stroke="#111" stroke-width="3" fill="#FFFDF5">
    <rect x="180" y="150" width="16" height="180"/>
    <rect x="324" y="150" width="16" height="180"/>
    <rect x="172" y="132" width="176" height="20"/>
  </g>
  <!-- Press screw + gear, turning slowly -->
  <g transform="translate(260 108)">
    <g stroke="#111" stroke-width="3" fill="#FFFDF5">
      <circle r="17"/>
      <path d="M-17 0 H-24 M17 0 H24 M0 -17 V-24 M0 17 V24 M-12 -12 L-17 -17 M12 -12 L17 -17 M-12 12 L-17 17 M12 12 L17 17"/>
    </g>
    <circle r="5" fill="#111"/>
    <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="36s" repeatCount="indefinite" additive="sum"/>
  </g>
  <rect x="252" y="125" width="16" height="30" fill="#FFFDF5" stroke="#111" stroke-width="3"/>
  <!-- Ram: presses down slowly, returns -->
  <g>
    <rect x="238" y="155" width="44" height="16" fill="#FFFDF5" stroke="#111" stroke-width="3"/>
    <rect x="254" y="171" width="12" height="34" fill="#111"/>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 26; 0 26; 0 0" keyTimes="0;0.3;0.6;1" dur="12s" repeatCount="indefinite"/>
  </g>

  <!-- Memory tray on the press bed -->
  <rect x="205" y="306" width="110" height="12" fill="#FFFDF5" stroke="#111" stroke-width="3"/>
  <path d="M222 306 V318 M260 306 V318 M298 306 V318" stroke="#111" stroke-width="2"/>

  <!-- The leftover part: stays on the bed, gently pulsing -->
  <g>
    <rect x="243" y="272" width="34" height="34" fill="#FF4D00" stroke="#111" stroke-width="3"/>
    <rect x="252" y="281" width="16" height="16" fill="#FFFDF5" stroke="#111" stroke-width="2"/>
    <animate attributeName="opacity" values="1;0.72;1" dur="6s" repeatCount="indefinite"/>
  </g>
  <!-- Pointer that never lets go: post + arm + needle to the part -->
  <rect x="150" y="238" width="10" height="92" fill="#FFFDF5" stroke="#111" stroke-width="3"/>
  <rect x="150" y="230" width="86" height="10" fill="#FFFDF5" stroke="#111" stroke-width="3"/>
  <path d="M232 240 L254 268" stroke="#FF4D00" stroke-width="3"/>
  <circle cx="256" cy="271" r="4" fill="#FF4D00"/>

  <!-- Hoist: empty tray lifts away and drifts back, slowly -->
  <g>
    <path d="M392 96 H560 M552 96 V330" stroke="#111" stroke-width="3" fill="none"/>
    <rect x="384" y="86" width="90" height="14" fill="#FFFDF5" stroke="#111" stroke-width="3"/>
    <g>
      <path d="M420 128 L408 176 M468 128 L480 176" stroke="#111" stroke-width="2"/>
      <rect x="398" y="176" width="92" height="10" fill="#FFFDF5" stroke="#111" stroke-width="3"/>
      <path d="M410 186 V196 M444 186 V196 M478 186 V196" stroke="#111" stroke-width="2"/>
      <animateTransform attributeName="transform" type="translate" values="0 60; 0 0; 0 0; 0 60" keyTimes="0;0.35;0.7;1" dur="18s" repeatCount="indefinite"/>
    </g>
    <circle cx="444" cy="112" r="7" fill="#FFFDF5" stroke="#111" stroke-width="3"/>
  </g>

  <!-- Rail + next request rolling in, pausing, returning -->
  <path d="M356 322 H760" stroke="#111" stroke-width="3"/>
  <path d="M356 332 H760" stroke="#111" stroke-width="2"/>
  <g>
    <rect x="0" y="288" width="74" height="14" fill="#FFFDF5" stroke="#111" stroke-width="3"/>
    <rect x="22" y="258" width="30" height="30" fill="#FFFDF5" stroke="#111" stroke-width="3"/>
    <circle cx="16" cy="308" r="6" fill="#111"/>
    <circle cx="58" cy="308" r="6" fill="#111"/>
    <animateTransform attributeName="transform" type="translate" values="640 0; 372 0; 372 0; 640 0" keyTimes="0;0.3;0.65;1" dur="18s" repeatCount="indefinite"/>
  </g>

  <!-- Request dots travelling the line -->
  <g fill="#111">
    <circle r="6" cx="370" cy="316">
      <animateMotion dur="9s" repeatCount="indefinite" path="M0 0 L300 0"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle r="6" cx="370" cy="316">
      <animateMotion dur="9s" begin="4.5s" repeatCount="indefinite" path="M0 0 L300 0"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="9s" begin="4.5s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
