<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#111111" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- sheet -->
  <rect x="0" y="0" width="800" height="450" fill="#FFFDF5"/>
  <rect x="0" y="0" width="800" height="450" fill="url(#grid)"/>

  <!-- picture frame: the image being generated -->
  <g>
    <rect x="180" y="80" width="440" height="290" fill="#FFFFFF" stroke="#111111" stroke-width="4"/>
    <rect x="196" y="96" width="408" height="258" fill="none" stroke="#111111" stroke-width="2"/>
    <!-- mountains + sun inside the frame -->
    <circle cx="520" cy="160" r="34" fill="#FF4D00">
      <animate attributeName="cy" values="160;150;160" dur="9s" repeatCount="indefinite"/>
    </circle>
    <path d="M 210 330 L 330 200 L 420 290 L 500 210 L 590 330 Z" fill="none" stroke="#111111" stroke-width="3"/>
    <path d="M 210 330 L 590 330" stroke="#111111" stroke-width="3"/>
    <!-- paintbrush sweeping across the frame -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; 26 -8; 0 0" dur="7s" repeatCount="indefinite"/>
      <rect x="560" y="120" width="10" height="120" fill="#111111" transform="rotate(28 565 180)"/>
      <path d="M 600 226 L 626 250 L 612 264 L 588 240 Z" fill="#FF4D00"/>
    </g>
  </g>

  <!-- fading pixels drifting off the frame's right edge -->
  <g fill="#111111">
    <rect x="640" y="120" width="14" height="14">
      <animate attributeName="opacity" values="1;0.15;1" dur="6s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 0; 18 10; 0 0" dur="6s" repeatCount="indefinite"/>
    </rect>
    <rect x="648" y="180" width="10" height="10" fill="#FF4D00">
      <animate attributeName="opacity" values="0.9;0.1;0.9" dur="8s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 0; 24 -6; 0 0" dur="8s" repeatCount="indefinite"/>
    </rect>
    <rect x="636" y="240" width="12" height="12">
      <animate attributeName="opacity" values="1;0.2;1" dur="7s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 0; 16 14; 0 0" dur="7s" repeatCount="indefinite"/>
    </rect>
    <rect x="652" y="300" width="9" height="9" fill="#FF4D00">
      <animate attributeName="opacity" values="0.8;0.1;0.8" dur="9s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 0; 20 -10; 0 0" dur="9s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- calendar page with a cross mark, bottom-left -->
  <g>
    <rect x="80" y="300" width="110" height="90" fill="#FFFFFF" stroke="#111111" stroke-width="4"/>
    <rect x="80" y="300" width="110" height="22" fill="#111111"/>
    <line x1="104" y1="292" x2="104" y2="308" stroke="#111111" stroke-width="5"/>
    <line x1="166" y1="292" x2="166" y2="308" stroke="#111111" stroke-width="5"/>
    <path d="M 108 342 L 162 372 M 162 342 L 108 372" stroke="#FF4D00" stroke-width="7" stroke-linecap="round">
      <animate attributeName="opacity" values="1;0.35;1" dur="6s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- slow rotating dashed ring around the frame corner -->
  <g>
    <circle cx="620" cy="80" r="26" fill="none" stroke="#111111" stroke-width="2" stroke-dasharray="6 8">
      <animateTransform attributeName="transform" type="rotate" from="0 620 80" to="360 620 80" dur="40s" repeatCount="indefinite"/>
    </circle>
    <circle cx="620" cy="80" r="6" fill="#FF4D00"/>
  </g>

  <!-- ground shadow line -->
  <line x1="120" y1="410" x2="680" y2="410" stroke="#111111" stroke-width="3"/>
</svg>
