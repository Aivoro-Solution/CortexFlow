<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Animated schematic: a personal agent works inside a sandbox on a laptop, with an approval gate in front of every outward action">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#111111" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- paper -->
  <rect width="800" height="450" fill="#FFFDF5"/>
  <rect width="800" height="450" fill="url(#grid)"/>
  <rect x="6" y="6" width="788" height="438" fill="none" stroke="#111111" stroke-width="3"/>

  <!-- laptop base -->
  <g stroke="#111111" stroke-width="3" fill="#FFFDF5">
    <rect x="180" y="300" width="440" height="26" fill="#111111"/>
    <rect x="200" y="306" width="400" height="14" fill="#FFFDF5" stroke="none"/>
    <!-- screen -->
    <rect x="230" y="110" width="340" height="200" fill="#FFFDF5"/>
    <rect x="230" y="110" width="340" height="200" fill="none"/>
  </g>

  <!-- sandbox box on screen -->
  <g stroke="#111111" stroke-width="3" fill="none">
    <rect x="255" y="135" width="180" height="130"/>
    <line x1="255" y1="160" x2="435" y2="160"/>
    <line x1="255" y1="240" x2="435" y2="240"/>
  </g>
  <!-- browser window inside sandbox -->
  <g stroke="#111111" stroke-width="2.5" fill="none">
    <rect x="275" y="180" width="140" height="45"/>
    <line x1="275" y1="195" x2="415" y2="195"/>
    <circle cx="288" cy="187" r="3" fill="#111111" stroke="none"/>
    <circle cx="302" cy="187" r="3" fill="#111111" stroke="none"/>
    <circle cx="316" cy="187" r="3" fill="#FF4D00" stroke="none"/>
  </g>
  <!-- agent dot moving between browser tabs -->
  <circle cx="290" cy="212" r="7" fill="#FF4D00" stroke="#111111" stroke-width="2.5">
    <animate attributeName="cx" values="290;400;290" dur="12s" repeatCount="indefinite"/>
  </circle>
  <!-- memory drum -->
  <g stroke="#111111" stroke-width="2.5" fill="none">
    <ellipse cx="345" cy="255" rx="34" ry="9"/>
    <path d="M311 255v-14a34 9 0 0 1 68 0v14"/>
  </g>
  <rect x="335" y="246" width="20" height="5" fill="#FF4D00" stroke="none">
    <animate attributeName="width" values="20;6;20" dur="8s" repeatCount="indefinite"/>
  </rect>

  <!-- approval gate: lever + outward arrow path -->
  <g stroke="#111111" stroke-width="3" fill="none">
    <line x1="460" y1="200" x2="560" y2="200"/>
    <line x1="545" y1="190" x2="560" y2="200"/>
    <line x1="545" y1="210" x2="560" y2="200"/>
    <circle cx="500" cy="200" r="16" fill="#FFFDF5"/>
  </g>
  <!-- gate lever rotating slowly -->
  <g transform="rotate(0 500 200)">
    <line x1="500" y1="200" x2="500" y2="176" stroke="#FF4D00" stroke-width="4"/>
    <circle cx="500" cy="176" r="5" fill="#FF4D00" stroke="#111111" stroke-width="2.5"/>
    <animateTransform attributeName="transform" type="rotate" from="0 500 200" to="360 500 200" dur="36s" repeatCount="indefinite"/>
  </g>

  <!-- outward actions queue: three small squares drifting to the gate -->
  <g fill="#FFFDF5" stroke="#111111" stroke-width="2.5">
    <rect x="470" y="150" width="16" height="16">
      <animate attributeName="y" values="150;170;150" dur="9s" repeatCount="indefinite"/>
    </rect>
    <rect x="500" y="240" width="16" height="16">
      <animate attributeName="y" values="240;222;240" dur="9s" begin="3s" repeatCount="indefinite"/>
    </rect>
    <rect x="530" y="160" width="16" height="16" fill="#FF4D00">
      <animate attributeName="y" values="160;178;160" dur="9s" begin="6s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- cost dial -->
  <g stroke="#111111" stroke-width="2.5" fill="none">
    <circle cx="620" cy="280" r="30" fill="#FFFDF5"/>
    <line x1="620" y1="280" x2="620" y2="256" stroke="#FF4D00" stroke-width="3">
      <animateTransform attributeName="transform" type="rotate" from="-40 620 280" to="40 620 280" dur="10s" repeatCount="indefinite"/>
    </line>
    <circle cx="620" cy="280" r="4" fill="#111111" stroke="none"/>
  </g>

  <!-- ground line -->
  <line x1="120" y1="360" x2="680" y2="360" stroke="#111111" stroke-width="3"/>
  <line x1="150" y1="375" x2="650" y2="375" stroke="#111111" stroke-width="2" stroke-dasharray="8 8"/>
</svg>
