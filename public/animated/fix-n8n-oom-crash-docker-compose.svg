<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="Abstract container filling with memory blocks">
  <!-- cream background + fine grid -->
  <rect x="0" y="0" width="800" height="450" fill="#FFFDF5"/>
  <g stroke="#0C0C10" stroke-width="0.5" opacity="0.12">
    <path d="M0,45 H800 M0,90 H800 M0,135 H800 M0,180 H800 M0,225 H800 M0,270 H800 M0,315 H800 M0,360 H800 M0,405 H800"/>
    <path d="M40,0 V450 M80,0 V450 M120,0 V450 M160,0 V450 M200,0 V450 M240,0 V450 M280,0 V450 M320,0 V450 M360,0 V450 M400,0 V450 M440,0 V450 M480,0 V450 M520,0 V450 M560,0 V450 M600,0 V450 M640,0 V450 M680,0 V450 M720,0 V450 M760,0 V450"/>
  </g>

  <!-- big container outline with hard offset shadow -->
  <g>
    <rect x="206" y="96" width="388" height="268" fill="#0C0C10"/>
    <rect x="198" y="88" width="388" height="268" fill="#FFFDF5" stroke="#0C0C10" stroke-width="6"/>
    <!-- inner capacity line marks -->
    <line x1="230" y1="160" x2="566" y2="160" stroke="#0C0C10" stroke-width="2" stroke-dasharray="10 8"/>
    <line x1="230" y1="240" x2="566" y2="240" stroke="#0C0C10" stroke-width="2" stroke-dasharray="10 8"/>
    <!-- orange warning ceiling -->
    <rect x="230" y="116" width="336" height="12" fill="#FF4D00"/>
  </g>

  <!-- slowly filling memory blocks -->
  <g stroke="#0C0C10" stroke-width="4" fill="#0C0C10" opacity="0.85">
    <rect x="240" y="300" width="120" height="40">
      <animate attributeName="y" values="380;300;380" dur="9s" repeatCount="indefinite"/>
    </rect>
    <rect x="380" y="286" width="90" height="54">
      <animate attributeName="y" values="380;286;380" dur="11s" repeatCount="indefinite"/>
    </rect>
    <rect x="490" y="310" width="60" height="30">
      <animate attributeName="y" values="380;310;380" dur="8s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- orange overflow shards escaping the container -->
  <g fill="#FF4D00" stroke="#0C0C10" stroke-width="3">
    <polygon points="580,120 640,150 580,180">
      <animateTransform attributeName="transform" type="translate" values="0,0; 40,-30; 0,0" dur="7s" repeatCount="indefinite"/>
    </polygon>
    <polygon points="150,140 190,170 150,200">
      <animateTransform attributeName="transform" type="translate" values="0,0; -36,-26; 0,0" dur="8.5s" repeatCount="indefinite"/>
    </polygon>
  </g>

  <!-- slow gauge needle sweeping toward the red zone -->
  <g transform="translate(120,380)">
    <circle cx="0" cy="0" r="56" fill="#FFFDF5" stroke="#0C0C10" stroke-width="6"/>
    <circle cx="0" cy="0" r="8" fill="#FF4D00" stroke="#0C0C10" stroke-width="3"/>
    <line x1="0" y1="0" x2="0" y2="-44" stroke="#0C0C10" stroke-width="6" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" values="-50;50;-50" dur="10s" repeatCount="indefinite"/>
    </line>
    <path d="M -56,-8 A 57 57 0 0 1 56,-8" fill="none" stroke="#FF4D00" stroke-width="6"/>
  </g>

  <!-- slow ambient bar pulsing upward -->
  <g fill="#0C0C10" opacity="0.25">
    <rect x="660" y="240" width="34" height="140">
      <animate attributeName="height" values="140;60;140" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="y" values="240;320;240" dur="12s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- decorative corner marks -->
  <g stroke="#0C0C10" stroke-width="5" fill="none">
    <path d="M40,90 h-20 v20 M40,360 h-20 v-20 M760,90 h20 v20 M760,360 h20 v-20"/>
  </g>
</svg>
